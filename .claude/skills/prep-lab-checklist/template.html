<style>
  @page { size: A4; margin: 12mm 10mm; }
  body { font-family: 'Apple SD Gothic Neo', sans-serif; font-size: 10pt; }

  /* 공통면은 한 장으로 끝나고 회로가 새 쪽에서 시작한다. */
  .common { break-after: page; }
  .common .power { font-weight: 700; border: 2px solid #000;
                   padding: 3mm; margin-bottom: 4mm; }
  .common li { font-size: 12pt; line-height: 1.7; }

  /* 회로 경계 = 칩을 뽑고 다시 꽂는 경계다 (netlist M10). 항상 새 쪽. */
  .circuit { break-before: page; }
  .closing { break-before: page; }

  /* 오늘의 흐름 — 도착 직후 오늘 뭘 몇 개 하는지 한눈에. */
  .flow td, .flow th { text-align: left; }

  /* 칩 교체 배너. 준비물이 종류당 하나라 순차 배선이 강제된다. */
  .banner { border: 2px solid #000; padding: 2mm 3mm; margin: 2mm 0 3mm;
            font-weight: 700; }

  /* 원자 단위는 **칩 상자**다. 결선도+배선 전체를 통짜로 묶으면 새 장을 열자마자
     그 덩어리가 다음 장으로 밀려 제목과 배너만 남은 백지가 생긴다(실측 16쪽 중
     3장). 그리고 칩 교체 배너가 그것을 실행하며 봐야 할 배선과 다른 장에 놓인다.
     칩 하나의 배선은 절대 갈리지 않으므로 갈리는 지점은 "이 칩을 다 꽂았다"가 된다. */
  .wirebox .chip { border: 1px solid #333; padding: 2mm 3mm; margin-bottom: 3mm;
                   break-inside: avoid; }
  .wirebox img { break-after: avoid; }
  .wirebox .chip h4 { margin: 0 0 1.5mm; font-size: 11pt; }
  .wirebox ol { margin: 0; padding-left: 6mm; }
  .wirebox li { font-size: 11pt; line-height: 1.6; }

  /* 플로팅 입력이 이 과목의 대표 실패 원인이다. 목록 끝에 묻지 않는다. */
  .unused { border: 2px solid #000; padding: 2mm 3mm; margin: 3mm 0; }
  /* 칩 구획이 쪽 경계를 타면 머리글 없는 `미사용 출력핀 … 개방` 줄만 다음 쪽
     꼭대기에 남는다 — 칩 라벨을 되살린 이유가 그대로 무너진다. 3줄짜리라
     통짜로 묶어도 백지 비용이 없다. */
  .unused .chipunused { margin-top: 2mm; break-inside: avoid; }

  /* 펜으로 칠하는 칸. `.check` 는 명세의 기록 대상 표 행 전용이고
     (개수를 테스트가 명세에서 세어 대조한다), 그 외 체크박스는 `.box` 다. */
  .box { display: inline-block; width: 4mm; height: 4mm;
         border: 1px solid #333; vertical-align: middle; margin-right: 2mm; }
  td.box { display: table-cell; width: 8mm; height: 8mm; margin: 0; }

  /* 표가 쪽 경계에서 쪼개지면 헤더 없는 진리표 조각이 남아 실험실에서 못 읽는다.
     가능하면 통째로 넘기고, 넘길 수 없을 만큼 크면 헤더를 반복한다.
     제목만 앞 쪽에 남는 것(위도우)도 막는다. */
  table { border-collapse: collapse; margin-bottom: 6mm; break-inside: avoid; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  h2, h3, h4 { break-after: avoid; }
  .tblock { break-inside: avoid; }   /* 제목·출처·표를 한 덩어리로 */
  th, td { border: 1px solid #333; padding: 2mm 3mm; text-align: center; }
  td.check { width: 10mm; height: 8mm; background: #fafafa; }

  /* 스텝표의 기입 칸. `.check` 와 뜻이 다르다 — `.check` 는 예상값과의 일치
     여부이고, 이쪽은 읽은 값을 단위와 함께 적는 자리라 더 넓어야 한다. */
  td.fill { width: 22mm; height: 8mm; background: #fafafa; }

  /* 결과보고서의 "예상과의 비교"가 여기서 나온다. 확인 칸 하나로는 좁다. */
  .mismatch td { height: 8mm; background: #fafafa; }

  .legend { font-size: 9pt; margin: 1mm 0 4mm; }
  .src { font-size: 9pt; margin: 0 0 1mm; }
  .photo { font-size: 9pt; margin: 0 0 3mm; }

  /* 중첩 오버바((A'·B)' 처럼)가 같은 높이에 겹쳐 그려지지 않도록 inline-block
     으로 자기 높이를 갖게 한다. border-top 만으로는 두 겹이 한 줄로 뭉개진다. */
  .ov { border-top: 1px solid currentColor; display: inline-block;
        line-height: 1.35; padding-top: 1px; }
  /* 파형 자리. `capture` 는 셀 표를 갖지 않으므로 미니표가 먹던 지면을
     스케치가 받는다 — 격자가 좁으면 계단 열 개를 그릴 수 없다. */
  .sketch { border: 1px solid #333; height: 65mm; }
  /* 예상 산문이 이 표의 판정 기준 전부다. 눈에 띄게 두른다. */
  .expected { border: 1px solid #333; padding: 2mm 3mm; margin-bottom: 2mm;
              font-size: 9.5pt; line-height: 1.5; }
  .readout { font-size: 9pt; margin: 1mm 0; }
  /* 미니표가 없는 자리를 대신한다. 두 줄쯤 쓸 높이. */
  .differs { border: 1px solid #333; padding: 2mm 3mm; height: 16mm;
             margin-bottom: 6mm; }
</style>

<h1>{{TITLE}}</h1>
<section class="common">{{COMMON}}</section>
<section class="circuits">{{CIRCUITS}}</section>
<section class="closing">{{CLOSING}}</section>
