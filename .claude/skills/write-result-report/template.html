<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 18mm 16mm 20mm 16mm; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #fff; color: #111;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 10.5pt; line-height: 1.65;
  }

  /* Header — ③ 예비보고서와 같은 톤, 레이블만 RESULT-REPORT 로 바꾼다. */
  .doc-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 4mm; margin-bottom: 7mm;
    border-bottom: 1px solid #1a1a1a;
  }
  .doc-header .label {
    font-size: 7.5pt; letter-spacing: 0.45em; color: #888; margin-bottom: 2.5mm;
  }
  .doc-header .title { font-size: 19pt; font-weight: 300; line-height: 1.2; letter-spacing: -0.01em; }
  .doc-header .meta { text-align: right; font-size: 8.5pt; color: #666; line-height: 1.5; }
  .doc-header .meta .course { color: #111; font-weight: 500; }

  /* Cover-pending notice — ③과 동일 규칙. §실행 절차 10 의 조 편성 미확정
     분기에서만 쓰인다. 안내 문장이 # 로 시작하면 섹션으로 오인돼 ⑤ 검증을
     오염시키므로 헤딩이 아니라 이 div 로 감싼다. (주의: 이 파일의 CSS
     주석에는 백틱을 쓰지 않는다 — check_rendered_html 은 <style> 블록
     내용을 걷어내지 않으므로, 여기 쓴 백틱까지 렌더된 본문의 "코드 스팬
     잔존" 오탐으로 세어 버린다.) */
  .cover-pending {
    background: #f7f7f7; border: 1px dashed #999; color: #444;
    font-size: 8.5pt; padding: 3mm 4mm; margin: 0 0 6mm 0;
  }

  /* Content */
  .content h2 {
    font-size: 13pt; font-weight: 600; margin: 9mm 0 3mm;
    padding-bottom: 1.5mm; border-bottom: 1px solid #ddd;
  }
  .content h2:first-child { margin-top: 0; }
  .content h3 { font-size: 11pt; font-weight: 600; margin: 6mm 0 2mm; color: #222; }
  .content p { margin: 2.5mm 0; }
  .content ul, .content ol { margin: 2.5mm 0; padding-left: 6mm; }
  .content li { margin: 1mm 0; }
  .content strong { font-weight: 600; }
  .content h2, .content h3 { break-after: avoid; }

  /* 인용/강조 박스 — ①·③·⑥ 과 동일 톤 */
  .callout {
    background: #f7f7f7; border-left: 3px solid #1a1a1a;
    padding: 3mm 4mm; margin: 3mm 0; font-size: 10pt;
  }
  .summary {
    border: 1px solid #1a1a1a; padding: 3.5mm 4mm; margin: 5mm 0 2mm;
    font-weight: 500;
  }
  /* source 각주 — 예상값 표 바로 아래, 표와 한 덩어리로 묶인다 (③과 동일) */
  .cite { font-size: 9pt; color: #555; margin: 1.5mm 0 4mm; padding-left: 3mm;
          border-left: 2px solid #ccc; }

  /* 표 — 쪽 경계에서 쪼개지면 헤더 없는 결과 표 조각이 남는다. 가능하면
     통째로 넘긴다 (②·③ 과 동일 규칙). */
  table { width: 100%; border-collapse: collapse; margin: 3mm 0; font-size: 9.5pt;
          break-inside: avoid; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  /* 제목·출처와 표가 갈라지면 어느 표의 근거인지 알 수 없다. */
  .tblock { break-inside: avoid; }
  th, td { border: 1px solid #ccc; padding: 1.8mm 2.5mm; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; font-weight: 600; }
  td.center, th.center { text-align: center; }

  /* 불일치 셀 — §절대 규칙 5 "일치한 척하지 않는다" 를 시각으로도 강제한다.
     체크 표시 행(예상값 그대로)과 실제 관찰값을 적은 불일치 행이 표 안에서
     눈으로도 구별돼야, 전부 일치한 것처럼 보이는 표를 무심코 만들지 않는다. */
  td.mismatch {
    background: #fdecea; color: #a5291b; font-weight: 600;
  }
  td.unchecked { color: #999; font-style: italic; }

  /* 보수 오버바 — 부울식에만 적용. 표 헤더·신호명·셀 값(예: 실험6 의
     Q(t-1)' 같은 상태 토큰)은 그대로 ' 를 쓴다. display: inline-block +
     padding-top 이 핵심이다 — 순수 border-top 만으로는 중첩된 .ov 두 겹이 같은 높이에
     겹쳐 그려져 바깥쪽 바 하나만 있는 것처럼 보인다. inline-block 은 안쪽
     span 의 padding 을 자기 박스 높이에 반영하므로, 그걸 감싼 바깥쪽 span 의
     border-top 이 그만큼 더 위에서 그려져 두 단으로 분리된다. */
  .ov { display: inline-block; border-top: 1px solid currentColor; padding-top: 0.16em; }

  /* 실험사진 — ③의 브레드보드 캔버스(빈 템플릿)와 달리 여기는 실제로 찍은
     사진이다. 파일명(예: 1-2 000.jpg)을 캡션에 그대로 남겨 어느 확인 칸의
     증거인지 추적 가능하게 한다 (§사진 배치). */
  .photo-block { margin: 4mm 0; break-inside: avoid; }
  .photo-block img { width: 100%; max-width: 100%; object-fit: contain;
                      border: 1px solid #ccc; }
  .photo-block figcaption { font-size: 8.5pt; color: #666; margin-top: 1.5mm; }
  .photo-row { display: flex; gap: 4mm; }
  .photo-row .photo-block { flex: 1; margin: 0; }

  /* 퀴즈 해설 — §8. generate: true 인 프리셋에서만 실제로 쓰인다. */
  .quiz-item { border: 1px solid #ccc; padding: 3mm 4mm; margin: 3mm 0; break-inside: avoid; }
  .quiz-q { font-weight: 600; }
  .quiz-a { margin-top: 2mm; }

  /* 매 쪽 반복 footer 는 일부러 두지 않는다. position: fixed 는 Chromium
     인쇄에서 페이지 여백 안에만 머문다는 보장이 없고, 밀도 높은 표가 페이지
     하단까지 채워질 때 footer 문구가 본문 위에 겹쳐 찍히는 것을 확인했다
     (②·③·⑥ 템플릿에도 이런 footer 가 없다 — 그 관행을 따른다). */
  .page-break { break-before: page; }
</style>
</head>
<body>
  <div class="doc-header">
    <div class="left">
      <div class="label">RESULT-REPORT</div>
      <div class="title">{{TITLE}}</div>
    </div>
    <div class="meta">
      <div class="course">{{COURSE}}</div>
      <div>작성일 {{DATE}}</div>
    </div>
  </div>

  <div class="content">
{{CONTENT}}
  </div>
</body>
</html>
