<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 18mm 16mm 20mm 16mm; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #fff; color: #111;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 10.5pt; line-height: 1.65;
  }

  /* Header */
  .doc-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 4mm; margin-bottom: 7mm;
    border-bottom: 1px solid #1a1a1a;
  }
  .doc-header .label {
    font-size: 7.5pt; letter-spacing: 0.45em; color: #888; margin-bottom: 2.5mm;
  }
  .doc-header .title { font-size: 19pt; font-weight: 300; line-height: 1.2; letter-spacing: -0.01em; }
  .doc-header .meta { text-align: right; font-size: 8.5pt; color: #666; line-height: 1.5; }
  .doc-header .meta .course { color: #111; font-weight: 500; }

  /* Cover-pending notice — only present when §실행 절차 조 편성 미확정 분기다.
     본문만 낸 상태임을 PDF 자체에서도 알 수 있게 한다. */
  .cover-pending {
    background: #f7f7f7; border: 1px dashed #999; color: #444;
    font-size: 8.5pt; padding: 3mm 4mm; margin: 0 0 6mm 0;
  }

  /* Content */
  .content h2 {
    font-size: 13pt; font-weight: 600; margin: 9mm 0 3mm;
    padding-bottom: 1.5mm; border-bottom: 1px solid #ddd;
  }
  .content h2:first-child { margin-top: 0; }
  .content h3 { font-size: 11pt; font-weight: 600; margin: 6mm 0 2mm; color: #222; }
  .content p { margin: 2.5mm 0; }
  .content ul, .content ol { margin: 2.5mm 0; padding-left: 6mm; }
  .content li { margin: 1mm 0; }
  .content strong { font-weight: 600; }
  .content h2, .content h3 { break-after: avoid; }

  /* 인용/강조 박스 — ①·⑥ 과 동일 톤 */
  .callout {
    background: #f7f7f7; border-left: 3px solid #1a1a1a;
    padding: 3mm 4mm; margin: 3mm 0; font-size: 10pt;
  }
  .summary {
    border: 1px solid #1a1a1a; padding: 3.5mm 4mm; margin: 5mm 0 2mm;
    font-weight: 500;
  }
  /* source 각주 (R4) — 예상값 표 바로 아래, 표와 한 덩어리로 묶인다 */
  .cite { font-size: 9pt; color: #555; margin: 1.5mm 0 4mm; padding-left: 3mm;
          border-left: 2px solid #ccc; }

  /* 표 — 쪽 경계에서 쪼개지면 헤더 없는 진리표 조각이 남는다. 가능하면
     통째로 넘긴다 (② 체크리스트·① 프리뷰와 동일 규칙). */
  table { width: 100%; border-collapse: collapse; margin: 3mm 0; font-size: 9.5pt;
          break-inside: avoid; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  /* 제목·출처와 표가 갈라지면 어느 표의 근거인지 알 수 없다. */
  .tblock { break-inside: avoid; }
  th, td { border: 1px solid #ccc; padding: 1.8mm 2.5mm; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; font-weight: 600; }
  td.center, th.center { text-align: center; }

  /* 보수 오버바 (R5) — 부울식에만 적용. 표 헤더·신호명·셀 값은 그대로 ' 를 쓴다.
     `display: inline-block` + `padding-top` 이 핵심이다 — 순수 `border-top`
     만으로는 중첩된 `.ov` 두 겹(예: `(A'·B)'`)이 같은 높이에 겹쳐 그려져
     바깥쪽 바 하나만 있는 것처럼 보인다(직접 렌더링해 확인). inline-block 은
     안쪽 span 의 padding 을 자기 박스 높이에 반영하므로, 그걸 감싼 바깥쪽
     span 의 border-top 이 그만큼 더 위에서 그려져 두 단으로 분리된다. */
  .ov { display: inline-block; border-top: 1px solid currentColor; padding-top: 0.16em; }

  /* 브레드보드 캔버스 — 자동 배선도가 아니라 빈 템플릿. netlist 가 요구하는
     행 수만큼만 보여준다 (② render.crop_rows 와 동일 계산). */
  .breadboard-block { margin: 4mm 0; break-inside: avoid; }
  .breadboard-block img { width: 100%; object-fit: cover; object-position: top;
                          border: 1px solid #ccc; }
  .breadboard-block figcaption { font-size: 8.5pt; color: #666; margin-top: 1.5mm; }

  /* 매 쪽 반복 footer 는 일부러 두지 않는다. `position: fixed` 는 Chromium
     인쇄에서 페이지 여백 안에만 머문다는 보장이 없고, 실제로 이 문서의
     밀도 높은 표(§2.4 요약 박스 등)가 페이지 하단까지 채워질 때 footer 문구가
     본문 위에 겹쳐 찍히는 것을 확인했다 (② 체크리스트·⑥ 표지 템플릿에도
     이런 footer 가 없다 — 그 관행을 따른다). */
  .page-break { break-before: page; }
</style>
</head>
<body>
  <div class="doc-header">
    <div class="left">
      <div class="label">PRE-REPORT</div>
      <div class="title">{{TITLE}}</div>
    </div>
    <div class="meta">
      <div class="course">{{COURSE}}</div>
      <div>작성일 {{DATE}}</div>
    </div>
  </div>

  <div class="content">
{{CONTENT}}
  </div>
</body>
</html>
