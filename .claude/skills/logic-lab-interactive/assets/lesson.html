<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>@@CHIP@@ · @@TITLE@@</title>
  <script>document.documentElement.classList.add('js');try{const t=localStorage.getItem('od-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <style>@@FONTS@@
@@CSS@@</style>
</head>
<body>
<div id="ec2-lab-root" class="lab-app" data-drawer="none">
  <header class="topbar">
    <button class="text-btn panel-toggle" type="button" data-drawer-btn="left" aria-label="조작 패널" aria-expanded="true" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="strip" x="3" y="4" width="6" height="16" rx="1"></rect><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg><span>조작</span></button>
    <h1 class="brand">실험 @@EXPERIMENT@@ · @@CHIP@@ · @@TITLE@@</h1>
    <a class="text-btn back" href="@@NOTE@@">실험설명으로</a>
    <button class="text-btn theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
    <button class="text-btn panel-toggle" type="button" data-drawer-btn="right" aria-label="설명 패널" aria-expanded="true" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="strip" x="15" y="4" width="6" height="16" rx="1"></rect><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M15 4v16"></path></svg><span>설명</span></button>
  </header>
  <div class="layout">
    <aside id="panel-left" class="panel panel-left" aria-label="조작">
      <div class="panel-inner">
        <div class="panel-head"><h2>조작</h2><button type="button" class="text-btn" data-close-drawer aria-label="조작 닫기">×</button></div>
        <section class="sec" aria-labelledby="input-title">
          <h2 class="sec-title" id="input-title">입력 조작</h2>
          <div class="opt" id="inputs"></div>
          <p class="sub" id="input-error" role="status" hidden></p>
        </section>
        <section class="sec" aria-labelledby="steps-title">
          <h2 class="sec-title" id="steps-title">단계별 살펴보기</h2>
          <nav class="steps" id="tasks" aria-label="실험 순서"></nav>
          <button type="button" class="text-btn" id="reset">이 단계 처음부터</button>
        </section>
      </div>
    </aside>
    <main class="stage" id="stage" aria-label="74HC76 회로 실험실">
      <div class="predict-slot">
        <section class="predict-card" id="prediction" aria-label="예측 확인">
          <div class="predict-head">
            <div>
              <h2 class="predict-prompt" id="task-title"></h2>
              <p id="prompt"></p>
            </div>
            <button class="predict-skip" id="skip" type="button">건너뛰기</button>
          </div>
          <fieldset id="choices"><legend class="visually-hidden">예측 답안</legend><div class="predict-opts" id="options"></div></fieldset>
          <button type="button" class="predict-btn submit" id="submit" hidden>예측 확인</button>
          <p class="predict-feedback" id="feedback" role="status" hidden></p>
        </section>
      </div>
      <section class="lab-stage-wrap" aria-label="74HC76 결선 회로도">
        <div class="lab-stage"><div class="circuit-scroll" id="circuit">@@CIRCUIT@@</div></div>
        <p class="sub circuit-hint">바뀐 입력과 출력 핀에서 파형을 선택해요. PR·CLR은 0에서 작동해요.</p>
      </section>
      <div class="plot-slot">
        <section class="plot-wrap" aria-labelledby="trace-title">
          <div class="plot-head">
            <div>
              <h2 class="sec-title" id="trace-title">신호 파형</h2>
              <p class="sub trace-hint"><span>선을 가리켜 이유 확인</span><span>선을 눌러 이유 확인</span></p>
            </div>
            <button type="button" class="predict-btn submit" id="advance"></button>
            <div class="history num" aria-label="조작 이력">
              <button type="button" class="text-btn" id="previous" aria-label="이전 조작">←</button>
              <output id="position"></output>
              <button type="button" class="text-btn" id="next" aria-label="다음 조작">→</button>
            </div>
          </div>
          <p id="fixed-inputs" class="sub num" hidden><strong>고정 입력</strong> <span id="fixed-values"></span></p>
          <p id="trace-keys" class="visually-hidden">좌우 화살표로 조작 시점을, 위아래 화살표로 핀을 선택해요. Enter로 설명을 열고 Escape로 닫아요.</p>
          <div class="trace-area">
            <div id="traces" tabindex="0" role="region" aria-label="조작 순서별 신호 파형" aria-describedby="trace-keys"></div>
            <div id="trace-hover" class="trace-card diagnosis" aria-hidden="true" hidden>
              <b data-trace-value></b>
              <small data-trace-step></small>
              <span data-trace-reason></span>
              <small data-trace-truth></small>
            </div>
          </div>
          <div id="trace-detail" class="trace-card diagnosis" hidden>
            <button type="button" class="text-btn trace-close" aria-label="파형 설명 닫기">×</button>
            <b data-trace-value></b>
            <small data-trace-step></small>
            <span data-trace-reason></span>
            <small data-trace-truth></small>
          </div>
          <p id="trace-announcement" class="visually-hidden" role="status"></p>
          <p id="event" role="status"></p>
        </section>
      </div>
      <noscript>핀과 파형을 조작하려면 JavaScript를 켜 주세요.</noscript>
    </main>
    <aside id="panel-right" class="panel panel-right" aria-label="설명">
      <div class="panel-inner">
        <div class="panel-head"><h2>설명</h2><button type="button" class="text-btn" data-close-drawer aria-label="설명 닫기">×</button></div>
        <section class="sec" aria-labelledby="values-title">
          <h2 class="sec-title" id="values-title">현재 핀 값</h2>
          <div class="tiles" id="pin-values"></div>
        </section>
        <section class="sec" aria-labelledby="truth-title">
          <h2 class="sec-title" id="truth-title"></h2>
          <table id="truth-table" aria-labelledby="truth-title"></table>
        </section>
      </div>
    </aside>
  </div>
  <div class="scrim" aria-hidden="true"></div>
</div>
<script type="application/json" id="lesson">@@LESSON@@</script>
<script type="module">
@@MODEL@@
@@SHELL@@
@@RUNTIME@@
</script>
</body>
</html>
