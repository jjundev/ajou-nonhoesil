<title>실험NN 예상 결과 그림</title>
<meta charset="utf-8">
<!--
  artifact: (게시 전)
  draw-expected-figure 템플릿. 실험 폴더의 output/ 에 <폴더 이름>_예상결과.html 로 복사해
  제목 세 곳(title·eyebrow·h1)의 자리표시를 바꾸고, 아래 FIGURES 와 요소·근거 표만 채운다.
  그림 속 숫자는 예비보고서 md 에 같은 글자로 있어야 하고, 눈금 라벨은
  text(..., { tick: true }) 로 쓴다.
  PNG: python3 -m scripts.lab.figure_export <실험번호>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F3F4F6;
    --surface: #FFFFFF;
    --ink: #1A1D21;
    --muted: #5B636D;
    --line: #D9DDE2;
    --accent: #1F4FA8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15181C;
      --surface: #1E2227;
      --ink: #E7EAEE;
      --muted: #9BA3AD;
      --line: #313740;
      --accent: #8FB0EC;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15181C;
    --surface: #1E2227;
    --ink: #E7EAEE;
    --muted: #9BA3AD;
    --line: #313740;
    --accent: #8FB0EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 40px 64px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  header { display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  h1 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
  h2 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
  p { margin: 0; }
  .lede { color: var(--muted); }
  #figures { display: flex; flex-direction: column; gap: 40px; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
  .fig-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .fig-head .file {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  /* 그림은 노션의 흰 페이지에 들어가므로 테마와 무관하게 흰 종이로 고정한다 */
  .paper { background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .paper svg { display: block; width: 100%; height: auto; }
  figcaption { max-width: 72ch; padding-left: 14px; border-left: 2px solid var(--accent); }
  .notes { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .scroll { overflow-x: auto; }
  table.evidence { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.evidence th, table.evidence td {
    text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line);
  }
  table.evidence th { color: var(--muted); font-weight: 600; }

  /* ?fig=N 추출 모드: 그림 한 장만 가로 1000 으로 */
  html.export, html.export body { background: #FFFFFF; }
  html.export .wrap { max-width: none; padding: 0; gap: 0; }
  html.export header, html.export .notes, html.export figcaption,
  html.export .fig-head, html.export figure:not(.on) { display: none; }
  html.export .paper { border: 0; border-radius: 0; padding: 0; }
  html.export .paper svg { width: 1000px; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">실험NN · 예비보고서 · 예상 결과</span>
    <h1>실험NN 예상 결과 그림</h1>
    <p class="lede">capture 표마다 한 장이다. 캡션은 이미지 밖 글자로 보고서에 붙는다.</p>
  </header>

  <div id="figures"></div>

  <section class="notes">
    <h2>그림 요소와 근거</h2>
    <div class="scroll">
      <table class="evidence">
        <thead><tr><th>그림</th><th>요소</th><th>근거</th><th>모양·위치</th></tr></thead>
        <tbody>
          <!-- 요소마다 한 행. 근거는 예비보고서 문장, 명세 expected, 강의노트 그림 쪽 중 하나 이상.
               근거 칸을 채울 수 없는 요소는 그리지 않는다. 모양·위치 칸에는 근거가 정한 모양 낱말이나
               위치 값을 본문 글자 그대로 적고, 본문에 값이 없는 위치면 `모식` 이라 적는다. -->
        </tbody>
      </table>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var W = 1000;
  var C = {
    ink: "#1A1D21", muted: "#5B636D", faint: "#9AA1AA", grid: "#E4E7EB", frame: "#9AA1AA",
    line1: "#1F4FA8", line2: "#6B737D", mark: "#B8322A", band: "rgba(184,50,42,0.12)"
  };
  var FONT = "'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  var MONO = "'IBM Plex Mono',ui-monospace,monospace";

  function lin(d0, d1, r0, r1) {
    return function (v) { return r0 + (v - d0) * (r1 - r0) / (d1 - d0); };
  }
  function f2(n) { return Math.round(n * 100) / 100; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  // "V_{x}" → 아래첨자
  function rich(s) {
    return esc(s).replace(/_\{([^}]*)\}/g, function (_, sub) {
      return '<tspan dy="5" font-size="0.74em">' + sub + '</tspan><tspan dy="-5">​</tspan>';
    });
  }
  function text(x, y, s, o) {
    o = o || {};
    var a = ' x="' + f2(x) + '" y="' + f2(y) + '" font-size="' + (o.size || 17) + '" fill="' + (o.fill || C.ink) + '"';
    if (o.tick) a += ' class="tick"';
    if (o.anchor) a += ' text-anchor="' + o.anchor + '"';
    if (o.weight) a += ' font-weight="' + o.weight + '"';
    if (o.rotate) a += ' transform="rotate(-90 ' + f2(x) + " " + f2(y) + ')"';
    if (o.mono) a += ' font-family="' + MONO + '"';
    return "<text" + a + ">" + rich(s) + "</text>";
  }
  function line(x1, y1, x2, y2, stroke, w, dash, extra) {
    return '<line x1="' + f2(x1) + '" y1="' + f2(y1) + '" x2="' + f2(x2) + '" y2="' + f2(y2) +
      '" stroke="' + stroke + '" stroke-width="' + w + '"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : "") + (extra || "") + " />";
  }
  function path(pts, stroke, w, extra) {
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + f2(p[0]) + " " + f2(p[1]); }).join("");
    return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + w +
      '" stroke-linejoin="round" stroke-linecap="round"' + (extra || "") + " />";
  }
  function arrowHead(x, y, dx, dy, fill, size) {
    size = size || 11;
    var L = Math.hypot(dx, dy); dx /= L; dy /= L;
    var bx = x - dx * size, by = y - dy * size, px = -dy * size * 0.5, py = dx * size * 0.5;
    return '<path d="M' + f2(x) + " " + f2(y) + "L" + f2(bx + px) + " " + f2(by + py) +
      "L" + f2(bx - px) + " " + f2(by - py) + 'Z" fill="' + fill + '" />';
  }
  function circle(x, y, r, fill, stroke, w) {
    return '<circle cx="' + f2(x) + '" cy="' + f2(y) + '" r="' + r + '" fill="' + fill + '"' +
      (stroke ? ' stroke="' + stroke + '" stroke-width="' + w + '"' : "") + " />";
  }
  function svgWrap(body, h, label) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + h + '" role="img" aria-label="' +
      esc(label) + '" font-family="' + FONT + '"><rect width="' + W + '" height="' + h + '" fill="#FFFFFF" />' +
      body + "</svg>";
  }

  // 그림 목록. capture 표마다 하나, 명세 순서대로.
  //   title   — 명세 항목 제목
  //   file    — figure.figure_png_name 이 정한 PNG 이름
  //   caption — 번호 없는 한 줄. 이미지 안에는 넣지 않는다
  //   draw    — { h: 높이, svg: svgWrap(본문, 높이, 설명) } 를 돌려준다. 가로는 1000 고정
  var FIGURES = [
  ];

  var host = document.getElementById("figures");
  var heights = [];
  FIGURES.forEach(function (f, i) {
    var r = f.draw();
    var fig = document.createElement("figure");
    fig.id = "f" + (i + 1);
    var head = document.createElement("div");
    head.className = "fig-head";
    var h2 = document.createElement("h2");
    h2.textContent = f.title;
    var file = document.createElement("span");
    file.className = "file";
    file.textContent = f.file;
    head.appendChild(h2);
    head.appendChild(file);
    var paper = document.createElement("div");
    paper.className = "paper";
    paper.innerHTML = r.svg;
    var cap = document.createElement("figcaption");
    cap.textContent = f.caption;
    fig.appendChild(head);
    fig.appendChild(paper);
    fig.appendChild(cap);
    host.appendChild(fig);
    heights.push(r.h);
  });
  document.documentElement.setAttribute("data-fig-heights", heights.join(","));

  var q = null;
  try { q = new URLSearchParams(location.search).get("fig"); } catch (e) {}
  var on = q && document.getElementById("f" + q);
  if (on) {
    document.documentElement.classList.add("export");
    on.classList.add("on");
  }
})();
</script>
