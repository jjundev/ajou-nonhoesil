[pytest]
# 16코어 PC 에서 직렬 3분 52초 → loadfile 1분 37초(2026-09-29 실측). loadfile 은 무거운
# 파일 하나가 워커 하나를 끝까지 잡아 두었다 — "모든 회로" 테스트가 회로 42장을 한
# 워커에서 다 그렸다. 그래서 loadgroup 으로 돌리고 그룹은 `tests/conftest.py` 가 정한다:
# 회로별·실험별 클래스(`tests/_boards.py`)는 회로·실험 단위로, 나머지는 파일::클래스 단위로.
# 한 줄씩 보며 디버깅할 때는 `-n0` 으로 끈다.
addopts = -n auto --dist loadgroup
