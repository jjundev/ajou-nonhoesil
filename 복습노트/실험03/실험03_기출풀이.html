<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>답안지</title>
<link rel="stylesheet" href="assets/vendor/pretendard/pretendard.css">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<script defer src="assets/vendor/katex/katex.min.js"></script>
<script defer src="assets/vendor/katex/auto-render.min.js"></script>
<style>
/* ==========================================================================
   답안지 템플릿 (문제 + 풀이 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 문제 데이터는 문제집과 같고, 문제마다
   solution {steps: [{label, html}], answer} 를 더한다. 1–3절은 문제집 템플릿과 같다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 10pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 6.5pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 15pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 9pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.ans-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--kind);
  border: .25mm solid var(--kind); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 10pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 7.5pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 40mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문: 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 (문제지와 같음) */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* 풀이 칸 (답안지): 점 격자 위에 번호 단계, 맨 아래 답. 맞춤: 글자 0.9 → 0.8 → 2단 */
.work {
  --sfs: 1;
  --sol-step-gap: 10mm;          /* 풀이 단계 사이 상하 여백 */
  display: flex; flex-direction: column; gap: 3mm; overflow: hidden;
  padding: 1mm 2mm 0 1mm;
  font-size: calc(var(--fs-body) * var(--sfs));
}
.sol-flow { flex: 1; min-height: 0; overflow: hidden; padding-top: 2.5mm; column-gap: 8mm; column-fill: auto; }
.sol-flow.is-2col { column-count: 2; }
.sol-steps { list-style: none; margin: 0; padding: 0; }
.sol-step {
  display: grid; grid-template-columns: 5mm minmax(0, 1fr); column-gap: 2mm;
  break-inside: avoid;
}
.sol-step + .sol-step { margin-top: var(--sol-step-gap); }
.sol-step::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: start;
  width: 5mm; height: 5mm; border-radius: 50%;
  background: var(--kind); color: var(--paper);
  font-size: 7pt; font-weight: 700; line-height: 5mm; text-align: center;
}
.sol-step-label {
  grid-column: 2; grid-row: 1; align-self: center;
  font-size: .9em; font-weight: 700; line-height: 1.3;
}
.sol-step-body { grid-column: 2; margin-top: 2.5mm; }
.sol-step-body:first-child { grid-row: 1; margin-top: 0; }
.sol-step-body .katex-display { overflow-x: clip; }
.sol-answer { flex: none; }

/* Hint 띠: 전체가 Hint 쪽 링크 */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 9pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 7.5pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 표: 격자선, 머리행 강조. 원문 표의 빈 칸은 태블릿 펜으로 쓸 높이(7mm)를 갖는다 */
#book table { border-collapse: collapse; width: 100%; margin: 1mm 0; }
#book th, #book td {
  border: .3mm solid var(--ink); padding: 1.2mm 1.2mm; text-align: center;
  overflow-wrap: break-word; word-break: keep-all; line-height: 1.3;
}
#book th { font-weight: 700; background: var(--paper); }
#book .original td { height: 7mm; }
/* 채울 표(work-table)는 풀이 칸 맨 위(.work-block)로 옮겨진다. 풀이 공간은 최소 25mm를 남긴다 */
#book .work-block { flex: none; }
#book .work-block .table-wrap { margin: 0; }
#book .work-block table { table-layout: fixed; margin: 0; }
#book .work-block td { height: 7mm; }
.page-center > .work-block ~ .work { min-height: 25mm; }

/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 9.5pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 9pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.5pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 8.5pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}
</style>
</head>

<script type="application/json" id="workbook-data">{"meta": {"mode": "answers", "title": "실험 3 · 기출 풀이", "chapter": 0, "total": 15}, "problems": [{"id": "q-ha-table", "kind": "출처 미확인", "number": "1", "title": "반가산기 진리표 채우기", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음은 2개의 2진 입력( x, y) 와 2개의 2진 출력으로 구성되는 반가산기의 진리표이다. 빈칸을 채워 넣어라.\u003c/p>", "conditions": "\u003cdiv class=\"table-wrap work-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>c\u003c/th>\u003cth>s\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>출력 열의 순서는 c(올림), s(합)예요.\u003c/p>", "ask": "\u003cp>빈칸을 채우세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>x와 y를 이진수 한 자리로 더하세요. 결과를 두 자리로 쓰고 왼쪽 자리가 올림 c, 오른쪽 자리가 합 s예요.\u003c/p>"}], "solution": {"steps": [{"label": "행마다 더하기", "html": "\u003cp>0+0 = 00이라서 c=0, s=0이에요. 0+1 = 01이라서 c=0, s=1이에요. 1+0 = 01이라서 c=0, s=1이에요. 1+1 = 10이라서 c=1, s=0이에요.\u003c/p>"}, {"label": "완성한 표", "html": "\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>c\u003c/th>\u003cth>s\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "검산", "html": "\u003cp>s = x⊕y이고 c = x·y예요. (1,1)에서 XOR = 0, AND = 1이라서 표와 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>열 순서가 c, s예요. 교안의 표는 S, C 순서라서 순서를 바꿔 쓰기 쉬워요. 열 머리글을 보고 채워요.\u003c/p>"}], "answer": "\u003cp>(0,0)→c=0, s=0 / (0,1)→c=0, s=1 / (1,0)→c=0, s=1 / (1,1)→c=1, s=0이에요.\u003c/p>"}}, {"id": "q-ha-design-eq", "kind": "예상문제", "number": "2", "title": "식(1)로 반가산기 설계", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>반가산기의 단순화된 부울 함수는 식 (1) 과 같다.\u003c/p>\u003cp>S = x′y + xy′,  C = xy  (1)\u003c/p>\u003cp>식 (1) 을 바탕으로 AND gate 1개 와 XOR gate 1개를 이용하여 반가산기의 회로도를 작성하라.\u003c/p>", "conditions": "\u003cp>AND gate 1개, XOR gate 1개를 사용해요.\u003c/p>", "ask": "\u003cp>반가산기의 회로도를 그리세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>S의 식 x′y + xy′가 어떤 게이트의 정의와 같은지 떠올려 보세요.\u003c/p>"}], "solution": {"steps": [{"label": "S", "html": "\u003cp>x′y + xy′는 x와 y가 서로 다를 때 1이에요. XOR의 정의와 같아서 S = x⊕y이고 XOR 하나로 만들어요.\u003c/p>"}, {"label": "C", "html": "\u003cp>C = xy는 AND 하나로 만들어요.\u003c/p>"}, {"label": "완성 회로", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-ha-design-eq-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"XOR 하나로 S, AND 하나로 C를 만드는 반가산기\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>x=0, y=1이면 S = 0′·1 + 0·1′ = 1이고 XOR(0,1)도 1이에요. C = 0이에요. x=y=1이면 S = 0, C = 1이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>x′y + xy′를 NOT 두 개, AND 두 개, OR 하나로 만들면 조건(AND 1개, XOR 1개)에 맞지 않아요. 이 식은 XOR 하나로 줄어요.\u003c/p>"}], "answer": "\u003cp>x, y를 XOR에 넣어 S를, AND에 넣어 C를 만들어요.\u003c/p>"}}, {"id": "q-ha-design-ic", "kind": "기출", "number": "3", "title": "7486·7408로 반가산기 설계", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>XOR(IC 7486)gate와 AND(IC 7408)gate를 이용하여 2-Input Half adder의 게이트 회로도를 설계 하시오. (input : A, B , output: S, Co 로 표현) (3점.)\u003c/p>", "conditions": "\u003cp>XOR은 IC 7486, AND는 IC 7408을 사용해요. 입력은 A, B이고 출력은 S, Co예요.\u003c/p>", "ask": "\u003cp>반가산기의 게이트 회로도를 그리세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>반가산기의 진리표에서 S와 Co가 각각 어떤 게이트와 같은 모양인지 비교하세요.\u003c/p>"}], "solution": {"steps": [{"label": "식 정하기", "html": "\u003cp>합 S는 두 입력이 다를 때 1이라서 XOR이에요. 올림 Co는 두 입력이 모두 1일 때만 1이라서 AND예요.\u003c/p>"}, {"label": "IC와 연결", "html": "\u003cp>A와 B를 7486(XOR)의 두 입력에 연결해서 S를 만들고, 같은 A와 B를 7408(AND)의 두 입력에 연결해서 Co를 만들어요. 입력 A와 B는 각각 두 게이트에 나뉘어 들어가요.\u003c/p>\u003cp>\u003cimg src=\"figures/solutions/q-ha-design-ic-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"7486 XOR로 S, 7408 AND로 Co를 만드는 반가산기\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>A=1, B=1이면 S = 0, Co = 1이에요. A=1, B=0이면 S = 1, Co = 0이에요. 반가산기 진리표와 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>출력 이름을 C로 쓰지 않도록 주의해요. 이 문제는 Co로 지정했어요. 또 IC의 전원(VCC)과 GND 연결을 빠뜨리면 실제 회로가 동작하지 않아요. 핀 번호는 데이터시트로 확인해요.\u003c/p>"}], "answer": "\u003cp>A, B를 XOR(7486)에 넣어 S를, AND(7408)에 넣어 Co를 만들어요.\u003c/p>"}}, {"id": "q-cs-roles", "kind": "기출", "number": "4", "title": "반가산기·전가산기의 C, S 역할", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>반가산기, 전가산기 에서의 C, S 출력 각각의 역할을 설명하라. (Describe the roles of C, S in half-adder and full-adder.)\u003c/p>", "conditions": "", "ask": "\u003cp>C 출력과 S 출력이 각각 무엇을 나타내는지 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>1+1을 이진수로 계산하면 한 자리에 안 들어가요. 오른쪽에 쓰는 값과 왼쪽으로 넘기는 값이 각각 어느 출력인지 생각하세요.\u003c/p>"}], "solution": {"steps": [{"label": "S의 역할", "html": "\u003cp>S(sum)는 입력을 더한 합을 한 자리로 나타낸 값이에요. 반가산기에서 S = A⊕B이고, 전가산기에서 S = A⊕B⊕Ci예요.\u003c/p>"}, {"label": "C의 역할", "html": "\u003cp>C(carry)는 한 자리에 안 들어가서 윗자리로 넘기는 올림이에요. 반가산기에서 C = A·B이고, 전가산기에서는 Co = A·B + (A⊕B)·Ci로 쓰기도 해요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>A=1, B=1이면 반가산기에서 S = 0, C = 1이에요. 1+1 = 10(이진수)이라서 오른쪽 자리 0이 S, 올림 1이 C예요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>S가 두 입력을 단순히 OR한 값이라고 생각하면 안 돼요. 1+1일 때 S는 0이고 올림이 C에 나타나요.\u003c/p>"}], "answer": "\u003cp>S는 합의 한 자리 값, C는 윗자리로 넘기는 올림이에요.\u003c/p>"}}, {"id": "q-ha-lsb", "kind": "기출", "number": "5", "title": "반가산기를 LSB에만 쓰는 이유", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Half adder를 2진수 덧셈에서, 맨 오른쪽 자리(LSB) 계산에만 사용 하는 이유를 Full adder와 비교하여 서술하시오. (3점.)\u003c/p>", "conditions": "", "ask": "\u003cp>이유를 서술하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>반가산기와 전가산기의 입력 개수를 비교하세요. 맨 오른쪽 자리와 그 윗자리에서 “아래 자리의 올림”이 있는지 없는지 따져 보세요.\u003c/p>"}], "solution": {"steps": [{"label": "비교", "html": "\u003cp>반가산기는 입력이 A, B 둘뿐이라서 아래 자리에서 올라오는 올림을 받을 수 없어요. 전가산기는 A, B에 올림 입력 Ci까지 받아서 세 개를 더해요.\u003c/p>"}, {"label": "이유", "html": "\u003cp>맨 오른쪽 자리(LSB)는 그보다 아래 자리가 없어서 받을 올림이 없어요. 그래서 올림 입력이 필요 없는 반가산기로 충분해요. 윗자리는 아래 자리에서 올림이 올라올 수 있어서 전가산기를 써야 해요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>0011 + 0001을 더하면 맨 아래 자리 1+1에서 올림 1이 생겨요. 그 윗자리는 1+0+올림 1을 더해야 해요. 올림을 받는 전가산기가 없으면 이 올림이 사라져요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>“반가산기는 계산이 틀리다”라고 쓰면 안 돼요. 반가산기도 두 비트의 합은 정확해요. 올림 입력을 받는 기능이 없다는 점이 이유예요.\u003c/p>"}], "answer": "\u003cp>LSB에는 아래 자리에서 오는 올림이 없어서 올림 입력이 없는 반가산기로 충분해요. 윗자리는 아래 자리의 올림을 받아야 해서 전가산기가 필요해요.\u003c/p>"}}, {"id": "q-adder-diff", "kind": "출처 미확인", "number": "6", "title": "전가산기와 반가산기의 차이", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>전가산기와 반가산기의 차이를 간단히 설명하라.\u003c/p>", "conditions": "", "ask": "\u003cp>차이를 간단히 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>두 회로의 입력 개수가 몇 개씩인지 먼저 세어 보세요.\u003c/p>"}], "solution": {"steps": [{"label": "입력의 차이", "html": "\u003cp>반가산기는 A, B 두 개를 입력받아요. 전가산기는 A, B에 아래 자리에서 올라온 올림 Ci까지 세 개를 입력받아요.\u003c/p>"}, {"label": "구성과 쓰임", "html": "\u003cp>전가산기는 반가산기 두 개와 OR 게이트로 만들어요. 올림을 받아서 처리할 수 있어서 여러 자리 덧셈의 윗자리에 쓰고, 반가산기는 맨 아래 자리에 써요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>진리표 행 수로도 확인돼요. 반가산기는 입력 2개라서 4행, 전가산기는 입력 3개라서 8행이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>출력 개수가 다르다고 쓰면 안 돼요. 둘 다 합과 올림 두 출력이에요. 다른 점은 올림을 입력으로 받느냐예요.\u003c/p>"}], "answer": "\u003cp>전가산기는 아래 자리의 올림(Ci)까지 입력으로 받아 더하고, 반가산기는 올림 입력 없이 두 비트만 더해요.\u003c/p>"}}, {"id": "q-fa-table", "kind": "출처 미확인", "number": "7", "title": "전가산기 진리표 일부 채우기", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>전가산기는 3개의 입력 비트들의 합을 계산하는 조합회로이며 3개의 입력(x,y,z)과 2개의 출력(c,s) 으로 구성된다. 다음은 전가산기의 진리표 일부이다. 빈칸을 채워라.\u003c/p>", "conditions": "\u003cdiv class=\"table-wrap work-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>z\u003c/th>\u003cth>C\u003c/th>\u003cth>S\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>출력 열의 순서는 C(올림), S(합)예요.\u003c/p>", "ask": "\u003cp>빈칸을 채우세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>세 입력의 1의 개수를 세세요. 1이 한 개면 합 1·올림 0, 두 개면 합 0·올림 1이에요. 이진수로 쓴 결과의 왼쪽 자리가 올림이에요.\u003c/p>"}], "solution": {"steps": [{"label": "행마다 더하기", "html": "\u003cp>(0,1,1): 0+1+1 = 10이라서 C=1, S=0이에요. (1,0,0): 1+0+0 = 01이라서 C=0, S=1이에요. (1,0,1): 1+0+1 = 10이라서 C=1, S=0이에요.\u003c/p>"}, {"label": "완성한 표", "html": "\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>z\u003c/th>\u003cth>C\u003c/th>\u003cth>S\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "검산", "html": "\u003cp>S = x⊕y⊕z이고 C는 1이 두 개 이상일 때 1이에요. (1,0,1)은 1이 두 개라서 C=1이고 XOR 결과는 0이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>열 순서가 C, S예요. S를 먼저 쓰지 않도록 주의해요. (0,1,1)에서 합을 1로 쓰는 실수도 많아요. 1이 두 개면 합은 0이에요.\u003c/p>"}], "answer": "\u003cp>(0,1,1)→C=1, S=0 / (1,0,0)→C=0, S=1 / (1,0,1)→C=1, S=0이에요.\u003c/p>"}}, {"id": "q-fa-design", "kind": "기출", "number": "8", "title": "식(1)로 전가산기 설계", "section": "실험 3 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음은 전가산기의 단순화 된 부울함수이다. (Following equation is a simplified bool function of a full-adder.)\u003c/p>\u003cp>S = x′y′z + x′yz′ + xy′z′ + xyz,  C = xy + yz + zx  (1)\u003c/p>\u003cp>식(1)을 바탕으로 3 개의 AND gate, 1 개의 OR gate, 그리고 2개의 XOR gate 를 사용해서 전가산기의 회로도를 작성하자. (Design a circuit diagram of full-adder using three AND gates, one OR gate, and two XOR gates based on the equation (1).)\u003c/p>", "conditions": "\u003cp>AND gate 3개, OR gate 1개, XOR gate 2개를 사용해요.\u003c/p>", "ask": "\u003cp>식(1)에서 S와 C를 만드는 전가산기 회로도를 그리세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>S의 네 항이 입력에서 1이 몇 개일 때 1이 되는지 세어 보세요. 그 패턴을 XOR 두 개로 만들 수 있는지 생각해 보세요.\u003c/p>"}, {"label": "접근 순서", "html": "\u003cp>C는 식 그대로 곱 세 개를 합한 꼴이에요. 곱 하나가 AND 게이트 하나이고, 그 세 개를 OR로 합쳐요. 마지막에 게이트 개수를 세어 조건과 맞춰 보세요.\u003c/p>"}], "solution": {"steps": [{"label": "S와 C 정리", "html": "\u003cp>S가 1인 입력은 001, 010, 100, 111이에요. 1이 홀수 개인 행들이라서 S = x⊕y⊕z이고 XOR 두 개를 이어서 만들어요. C = xy + yz + zx는 AND 3개로 xy, yz, zx를 만들고 3입력 OR 1개로 합쳐요.\u003c/p>"}, {"label": "완성 회로", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-fa-design-solution-01.png\" width=\"380\" style=\"max-width:100%;height:auto\" alt=\"AND 세 개와 3입력 OR 하나로 C를, XOR 두 개로 S를 만드는 전가산기\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>x=0, y=1, z=1이면 x⊕y = 1이라서 S = 1⊕1 = 0이고 yz = 1이라서 C = 1이에요. 진리표 011과 같아요.\u003c/p>"}, {"label": "제공 답안과 비교", "html": "\u003cp>제공 답안은 반가산기 두 개와 OR 하나예요. C 값은 같지만 AND가 두 개라서 문제의 “AND 3개” 조건과 달라요. 문제가 3입력 OR 하나를 허용한다는 해석이면 위 회로가 조건에 맞아요.\u003c/p>\u003cp>\u003cimg src=\"figures/solutions/q-fa-design-solution-02.png\" width=\"340\" style=\"max-width:100%;height:auto\" alt=\"반가산기 두 개와 OR 하나로 만든 전가산기. AND는 두 개\">\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>C의 세 항 중 zx를 빼먹기 쉬워요. S를 곱의 합 네 항 그대로 만들면 XOR 2개 조건에 어긋나요.\u003c/p>"}], "answer": "\u003cp>S = (x⊕y)⊕z는 XOR 두 개로, C = xy + yz + zx는 AND 세 개와 OR 하나로 만들어요.\u003c/p>"}}, {"id": "q-hs-bool", "kind": "출처 미확인", "number": "9", "title": "반감산기의 단순화 부울 함수", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음은 반감산기의 진리표이다. 이 진리표를 바탕으로 단순화된 부울 함수를 작성하라.\u003c/p>", "conditions": "\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>B\u003c/th>\u003cth>D\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>표의 입력은 x, y이고 출력은 B(내림), D(차)예요. 이 표는 문제에 주어진 조건이에요.\u003c/p>", "ask": "\u003cp>B = ____, D = ____ 의 식을 쓰세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>출력이 1인 행마다 입력 조건을 곱(AND)으로 쓰고, 그 곱들을 더하세요(OR). 그다음 줄일 수 있는지 보세요.\u003c/p>"}], "solution": {"steps": [{"label": "B", "html": "\u003cp>B가 1인 행은 (x,y) = (0,1) 하나예요. 그 조건은 x′y예요. 그래서 B = x′y예요.\u003c/p>"}, {"label": "D", "html": "\u003cp>D가 1인 행은 (0,1)과 (1,0)이에요. 곱은 x′y와 xy′이에요. 합치면 D = x′y + xy′이고, 이는 x⊕y와 같아요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>(1,1)에서 B = 1′·1 = 0이고 D = 1′·1 + 1·1′ = 0이에요. (0,1)에서 B = 0′·1 = 1이고 D = 0′·1 + 0·1′ = 1이에요. 표와 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>B = xy′로 쓰면 틀려요. (0,1)에서 1이 나와야 해요. 뺄셈은 순서가 있어서 NOT이 빼지는 수 x에 붙어요.\u003c/p>"}], "answer": "\u003cp>B = x′y, D = x′y + xy′ (= x⊕y)이에요.\u003c/p>"}}, {"id": "q-hs-circuit", "kind": "기출", "number": "10", "title": "반감산기 회로 설계", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음은 반감산기의 진리표이다. 이 진리표를 바탕으로 AND gate 1개, NOT gate 1개, 그리고 XOR gate 1개를 사용하여 반감산기의 회로도를 작성하여라. (2점.)\u003c/p>", "conditions": "\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>B\u003c/th>\u003cth>D\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>표의 입력은 x, y이고 출력은 B(내림), D(차)예요. 이 표는 문제에 주어진 조건이에요.\u003c/p>\u003cp>AND gate 1개, NOT gate 1개, XOR gate 1개를 사용해요.\u003c/p>", "ask": "\u003cp>반감산기의 회로도를 그리세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>D 열이 어떤 게이트의 진리표와 같은지 비교하세요. B 열은 1이 되는 행이 하나뿐이니, 그 행의 조건(x와 y의 값)을 AND와 NOT으로 쓸 수 있는지 생각하세요.\u003c/p>"}], "solution": {"steps": [{"label": "D", "html": "\u003cp>D 열은 x와 y가 다를 때 1이에요. XOR의 진리표와 같아서 D = x⊕y예요.\u003c/p>"}, {"label": "B", "html": "\u003cp>B 열은 (x,y) = (0,1)일 때만 1이에요. “x가 0이고 y가 1”이라서 B = x′·y이고, x에 NOT을 붙인 뒤 y와 AND해요.\u003c/p>"}, {"label": "완성 회로", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-hs-circuit-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"XOR 하나, NOT 하나, AND 하나로 만든 반감산기 회로\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>(x,y) = (1,0)이면 D = 1⊕0 = 1이고 B = 1′·0 = 0이에요. (1,1)이면 D = 0, B = 1′·1 = 0이에요. 표와 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>NOT을 y에 붙이면 B = x·y′가 돼요. 그러면 (1,0)에서 1이 나와서 표와 달라요. NOT은 x에 붙여요.\u003c/p>"}], "answer": "\u003cp>D = x⊕y를 XOR 하나로, B = x′·y를 NOT 하나(x에)와 AND 하나로 만들어요.\u003c/p>"}}, {"id": "q-sub-diff", "kind": "예상문제", "number": "11", "title": "반감산기와 전감산기의 차이", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>반감산기와 전감산기의 차이를 간단히 서술하라.\u003c/p>", "conditions": "", "ask": "\u003cp>차이를 간단히 서술하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>두 회로의 입력 개수를 비교하세요. 가산기에서 반가산기와 전가산기가 달랐던 점과 같은 질문이에요.\u003c/p>"}], "solution": {"steps": [{"label": "입력의 차이", "html": "\u003cp>반감산기는 A, B 두 개를 입력받고, 전감산기는 A, B에 아래 자리가 빌려 간 값(내림 입력 Bi)까지 세 개를 입력받아요.\u003c/p>"}, {"label": "구성과 쓰임", "html": "\u003cp>전감산기는 반감산기 두 개와 OR 게이트로 만들어요. 내림을 받아서 처리하기 때문에 여러 자리 뺄셈의 윗자리에 쓰고, 반감산기는 맨 아래 자리 뺄셈에 써요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>진리표 행 수는 반감산기 4행, 전감산기 8행이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>“반감산기는 내림을 출력하지 않는다”가 아니에요. 반감산기도 내림 Bo를 출력해요. 다른 점은 아래 자리의 내림을 입력으로 받느냐예요.\u003c/p>"}], "answer": "\u003cp>전감산기는 아래 자리에서 빌려 간 값(Bi)까지 입력으로 받아 빼고, 반감산기는 그 입력 없이 두 비트만 빼요.\u003c/p>"}}, {"id": "q-fs-table", "kind": "기출", "number": "12", "title": "전감산기 간략 회로도로 진리표 채우기", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음은 전감산기의 간략화된 회로도이다. 이를 바탕으로 전감산기 진리표의 일부를 채워 넣자. (Following figure is a simplified circuit diagram of full-subtractor. Using the figure below, fill in the blanks of the table.)\u003c/p>", "conditions": "\u003cp>HS는 반감산기 블록이에요. 입력 열 x, y, z의 순서는 그림의 A, B, Bi로 읽어요(원문에 이 대응이 적혀 있지 않아 가정해요).\u003c/p>\u003cdiv class=\"table-wrap work-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>z\u003c/th>\u003cth>B\u003c/th>\u003cth>D\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "ask": "\u003cp>표의 출력 B(내림)와 D(차) 빈칸을 채우세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-fs-table-given-01.png", "w_mm": 135.0, "h_mm": 51.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>그림에서 첫 번째 HS는 A와 B를 받아요. 그 차 D0가 둘째 HS의 A 입력으로 가요. 둘째 HS의 B 입력은 Bi예요. 행마다 이 순서로 값을 따라가세요.\u003c/p>"}, {"label": "접근 순서", "html": "\u003cp>HS 블록 하나는 D = A⊕B, 내림 = A′B를 내보내요. 최종 내림은 두 HS의 내림을 OR한 값이에요.\u003c/p>"}], "solution": {"steps": [{"label": "규칙과 첫 행", "html": "\u003cp>HS(A, B)는 차 = A⊕B, 내림 = A′B예요. (0,1,1)이면 첫 HS는 차 1, 내림 1이에요. 둘째 HS는 A=1, B=1이라서 차 0, 내림 0이에요. 그래서 D = 0, B = 1+0 = 1이에요.\u003c/p>\u003cp>\u003cimg src=\"figures/solutions/q-fs-table-solution-01.png\" width=\"360\" style=\"max-width:100%;height:auto\" alt=\"입력 A=0, B=1, Bi=1일 때 각 선의 값을 표시한 전감산기 블록도\">\u003c/p>"}, {"label": "나머지 행", "html": "\u003cp>(1,0,0): 첫 HS 차 1·내림 0, 둘째 HS(1,0)은 차 1·내림 0이라 D=1, B=0이에요. (1,0,1): 첫 HS 차 1·내림 0, 둘째 HS(1,1)은 차 0·내림 0이라 D=0, B=0이에요. (1,1,0): 첫 HS 차 0·내림 0, 둘째 HS(0,0)은 차 0·내림 0이라 D=0, B=0이에요.\u003c/p>"}, {"label": "완성한 표", "html": "\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>z\u003c/th>\u003cth>B\u003c/th>\u003cth>D\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "검산·흔한 실수", "html": "\u003cp>(1,0,1)을 식으로 확인해요. D = 1⊕0⊕1 = 0이고 Bo = A′B + (A⊕B)′Bi = 0 + 0·1 = 0이에요. 둘째 HS의 A와 B를 바꾸면 내림이 달라져요. A에는 첫 HS의 D0가, B에는 Bi가 들어가요.\u003c/p>"}], "answer": "\u003cp>(0,1,1): B=1, D=0 / (1,0,0): B=0, D=1 / (1,0,1): B=0, D=0 / (1,1,0): B=0, D=0이에요.\u003c/p>"}}, {"id": "q-fs-equation", "kind": "기출", "number": "13", "title": "전감산기 회로의 D, Bo 식", "section": "실험 3 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래 Full subtracter 게이트 회로의 출력 D와 Bo의 Boolean equation은? (2점.)\u003c/p>", "conditions": "", "ask": "\u003cp>D = ____, Bo = ____ 의 식을 쓰세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-fs-equation-given-01.png", "w_mm": 159.0, "h_mm": 63.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>첫 번째 XOR의 출력에 이름을 하나 붙이세요. 그 이름으로 둘째 XOR과 둘째 AND의 입력을 적으면 D가 먼저 나와요.\u003c/p>"}, {"label": "접근 순서", "html": "\u003cp>Bo는 AND 두 개의 출력을 OR한 값이에요. 각 AND의 입력에 NOT이 어느 신호에 붙었는지 확인하세요.\u003c/p>"}], "solution": {"steps": [{"label": "중간 신호", "html": "\u003cp>첫 XOR: x = A⊕B예요. 첫 AND는 A를 NOT한 값과 B를 받아서 b1 = A′B예요.\u003c/p>"}, {"label": "D", "html": "\u003cp>둘째 XOR은 Bi와 x를 받아서 D = x⊕Bi = A⊕B⊕Bi예요.\u003c/p>"}, {"label": "Bo", "html": "\u003cp>둘째 AND는 x를 NOT한 값과 Bi를 받아서 b2 = x′·Bi = (A⊕B)′·Bi예요. OR 게이트가 b1과 b2를 합쳐서 Bo = A′B + (A⊕B)′Bi예요.\u003c/p>\u003cp>\u003cimg src=\"figures/solutions/q-fs-equation-solution-01.png\" width=\"560\" style=\"max-width:100%;height:auto\" alt=\"중간 신호 x, b1, b2에 이름을 붙인 전감산기 회로\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>A=0, B=0, Bi=1이면 x=0이라서 D = 1이고 b1 = 0, b2 = 1·1 = 1이라 Bo = 1이에요. 진리표 001의 D=1, Bo=1과 같아요. A=1, B=1, Bi=1이면 x=0이라서 D = 1이고 b2 = 1이라 Bo = 1이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>둘째 NOT이 Bi에 붙었다고 읽으면 Bo의 식이 틀려요. 그림에서 NOT은 x가 지나는 선에 붙어 있어요. 또 (A⊕B)′는 XOR 결과 전체의 부정이에요.\u003c/p>"}], "answer": "\u003cp>D = A⊕B⊕Bi, Bo = A′B + (A⊕B)′Bi예요. 같은 값을 주는 간단한 꼴 Bo = A′B + A′Bi + B·Bi도 정답이에요.\u003c/p>"}}, {"id": "q-fs-roles", "kind": "기출", "number": "14", "title": "전감산기 D, B 출력의 역할", "section": "실험 3 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>전감산기에서의 D 와 B 출력의 각각의 역할을 설명하라. (Describe the roles of D, B in half-adder and full-subtractor.)\u003c/p>", "conditions": "\u003cp>원문 국문은 “전감산기”, 영문은 “half-adder and full-subtractor”로 적혀 있어요. 여기서는 전감산기의 두 출력을 설명해요.\u003c/p>", "ask": "\u003cp>D 출력과 B 출력이 각각 무엇을 나타내는지 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>입력이 A, B, Bi일 때 “A에서 B와 Bi를 뺀 값”이 어디에 나타나는지, 그리고 뺄 수 없을 때 어디에 표시되는지 나눠서 생각하세요.\u003c/p>"}], "solution": {"steps": [{"label": "D의 역할", "html": "\u003cp>D(difference)는 A−B−Bi의 결과를 한 자리로 나타낸 차예요. D = A⊕B⊕Bi라서 입력에서 1이 홀수 개일 때 1이에요.\u003c/p>"}, {"label": "B(Bo)의 역할", "html": "\u003cp>B(내림, borrow)는 그 자리에서 뺄 수 없어서 윗자리에서 빌려 와야 하는지를 나타내요. A가 B와 Bi를 더한 값보다 작을 때 1이에요. Bo = A′B + (A⊕B)′Bi예요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>입력 A=0, B=0, Bi=1이면 0−0−1을 뺄 수 없어요. 10−1 = 1이라서 D = 1, Bo = 1이에요. 진리표 001과 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>출력 B를 입력 B와 같은 값으로 생각하면 안 돼요. 출력 B는 내림이에요. 내림은 윗자리에서 빌려 와야 한다는 신호예요.\u003c/p>"}], "answer": "\u003cp>D는 세 입력을 뺀 차(한 자리 결과), B(Bo)는 윗자리에서 빌려 와야 한다는 내림이에요.\u003c/p>"}}, {"id": "q-cs-roles-sub", "kind": "출처 미확인", "number": "15", "title": "“반감산기·전감산기”의 C, S 역할(표기 불일치)", "section": "실험 3 · 정답 미확정", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>반감산기, 전감산기 에서의 C, S 출력 각각의 역할을 설명하라.\u003c/p>", "conditions": "\u003cp>원문 그대로 옮겼어요. 감산기의 출력은 보통 D(차)와 B(내림)이고 C, S는 가산기의 출력 이름이에요. 이 점은 해설의 원문 대조에서 다뤄요.\u003c/p>", "ask": "\u003cp>C 출력과 S 출력이 각각 무엇을 나타내는지 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>회로의 출력 이름이 C, S인 쪽이 가산기인지 감산기인지 먼저 확인하세요. 그다음 각 출력이 “결과의 한 자리”인지 “윗자리로 넘기는 값”인지 나누세요.\u003c/p>"}], "solution": {"steps": [{"label": "가산기로 읽을 때(제공 답안과 같은 해석)", "html": "\u003cp>S(sum)는 두 입력의 합을 한 자리로 나타낸 값이고, C(carry)는 윗자리로 넘기는 올림이에요. 제공 답안도 “두 입력의 합에 대한 출력이 S, 캐리가 발생하는지에 대한 출력이 C”라고 해요.\u003c/p>"}, {"label": "감산기로 읽을 때", "html": "\u003cp>감산기의 두 출력은 D와 B예요. D(difference)는 한 자리 차이고, B(Bo, borrow)는 윗자리에서 빌려 와야 하는지를 나타내요. 이 해석이면 “C, S”가 아니라 “D, B”의 역할을 묻는 문제로 바뀌어요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>가산기 A=1, B=1이면 S = 0, C = 1이에요. 감산기 A=0, B=1이면 D = 1, 내림 = 1이에요. 두 경우 모두 진리표와 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>감산기 출력에 C, S 이름을 그대로 붙여 외우면 안 돼요. 감산기의 올림에 해당하는 값은 “내림(borrow)”이에요.\u003c/p>"}], "answer": "\u003cp>가산기 해석이면 S는 합, C는 올림이에요. 감산기 해석이면 D는 차, B는 내림이에요. 원문 표기가 가산기/감산기로 엇갈려서 어느 쪽이 의도인지는 확정하지 못했어요.\u003c/p>"}}]}</script>
<main id="book"></main>
<script>
'use strict';

// 생성기가 문자열 치환으로 바꾸는 자리표시자. 여기서 이어 붙여 두어 치환 대상이 되지 않게 한다.
const PLACEHOLDER = '__WORKBOOK' + '_DATA__';
const KIND_SLUG = { '예제': 'example', '연습문제': 'exercise', '장말문제': 'problem', '기출': 'exam' };
const KIND_SHORT = { '예제': '예제', '연습문제': '연습', '장말문제': '문제', '기출': '문항' };   // Hint 쪽 항목 번호 앞 (번호가 종류끼리 겹침)
const FIG_SCALE_CAP = 1.5;        // 교재 인쇄 크기 대비 확대 상한
const MATH_MIN_SCALE = 0.7;
const STRIP_MATH_MIN_SCALE = 0.5;  // Hint 띠 속 식은 띠 폭에 맞춰 더 줄일 수 있음
// 쪽 맞춤 순서: 폭 → 글자. 앞 단계 값은 유지한 채 다음 단계로 간다.
const FIT_STEPS = [
  ['--pw', '40%'], ['--pw', '50%'],
  ['--fs', '0.9'], ['--fs', '0.8'],
];
// 풀이 칸 맞춤 순서: 글자 → 위 회로도 높이 → 2단
const SOL_FIT_STEPS = [['sfs', '0.9'], ['sfs', '0.8'], ['fig', '0.30'], ['fig', '0.22'], ['cols', '2']];
const PAGE_W_PX = 297 * 96 / 25.4;

const book = document.getElementById('book');

/* ---------- 작은 도우미 ---------- */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function txt(tag, cls, text) {
  const e = el(tag, cls);
  e.textContent = text;
  return e;
}
const kindSlug = kind => KIND_SLUG[kind] || 'problem';

async function loadData() {
  const q = new URLSearchParams(location.search).get('data');
  const raw = document.getElementById('workbook-data').textContent.trim();
  const url = q || (raw === PLACEHOLDER ? 'sample.json' : null);
  if (!url) return JSON.parse(raw);
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  renderMathInElement(root, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
    ],
    throwOnError: false,
    fleqn: true,
  });
}

/* ---------- 등식 줄바꿈 ---------- */
// 긴 등식(=, ≈ 등이 있고 EQ_SPLIT_LEN자보다 긴 식)만 한 줄을 따로 차지하는 display 식으로 바꾸고,
// 관계 기호마다 줄을 바꿔 세로로 맞춘다. 짧은 식은 문장 속에 그대로 둔다.
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
const REL_RE = /^(?:=|\\(?:approx|Rightarrow|leq?|geq?)(?![a-zA-Z]))/;
const EQ_SPLIT_LEN = 40;

// 중괄호·\left…\right 바깥의 관계 기호에서 나눈다: [lhs, [rel, rhs], …]
function splitRelations(tex) {
  const parts = [];
  let depth = 0, start = 0, rel = null;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (depth === 0) {
      const m = (c === '=' || c === '\\') && REL_RE.exec(tex.slice(i));
      if (m) {
        parts.push(rel ? [rel, tex.slice(start, i).trim()] : tex.slice(start, i).trim());
        rel = m[0]; i += m[0].length - 1; start = i + 1;
        continue;
      }
    }
    if (c === '{') depth++;
    else if (c === '}') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    }
  }
  if (!rel) return null;
  parts.push([rel, tex.slice(start).trim()]);
  return parts;
}

function equationTex(tex, parts, prefix) {
  const [lhs, ...rest] = parts;
  if (!lhs) return prefix + tex;
  const lines = rest.map(([rel, rhs], i) => `${i ? '' : prefix + lhs} &amp;${rel} ${rhs}`);
  return `\\begin{aligned}${lines.join(' \\\\ ')}\\end{aligned}`;
}

function breakEquations(html) {
  if (!html) return html;
  const toks = [];
  let last = 0;
  for (const m of html.matchAll(MATH_RE)) {
    toks.push({ text: html.slice(last, m.index) });
    const tex = (m[1] ?? m[2]).trim();
    const parts = tex.length > EQ_SPLIT_LEN ? splitRelations(tex) : null;
    toks.push({ tex, parts, display: !!m[1] || !!parts, prefix: '' });
    last = m.index + m[0].length;
  }
  if (!toks.length) return html;
  toks.push({ text: html.slice(last) });

  // 줄로 나뉜 식 사이에 남는 쉼표는 지우고, 식 사이의 → 는 다음 식 앞으로 옮긴다
  toks.forEach((t, k) => {
    if (t.text == null) return;
    const prev = toks[k - 1], next = toks[k + 1];
    const pd = prev && prev.display, nd = next && next.display;
    if (pd && nd && /^\s*(→|⇒)\s*$/.test(t.text)) { t.text = ''; next.prefix = '\\Rightarrow\\ '; return; }
    if (pd) t.text = t.text.replace(/^\s*[,，]\s*/, '');
    if (nd) t.text = t.text.replace(/\s*[,，]\s*$/, ' ');
    if (pd && nd && !t.text.trim()) t.text = '';
  });

  return toks.map(t => {
    if (t.text != null) return t.text;
    if (!t.display) return `$${t.tex}$`;
    return `$$${t.parts ? equationTex(t.tex, t.parts, t.prefix) : t.prefix + t.tex}$$`;
  }).join('');
}

// display 식이 칸보다 넓으면 그 식만 줄인다 (최소 70%)
function fitDisplayMath(root) {
  for (const d of root.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    k.style.transform = '';
    const avail = d.clientWidth, need = k.scrollWidth;
    if (need > avail + 1) {
      k.style.transformOrigin = 'left center';
      k.style.transform = `scale(${Math.max(MATH_MIN_SCALE, avail / need)})`;
    }
  }
}

function nextLayout() {
  void book.offsetHeight;          // 레이아웃을 돌려 새 글꼴(KaTeX 등) 로드를 시작시킴
  return document.fonts.ready;
}

/* ---------- 쪽 틀과 헤더 (공용) ---------- */
function makePage(kind, cls) {
  const page = el('section', `page ${cls}`);
  page.dataset.kind = kind;
  const head = el('header', 'page-head');
  const body = el('div', 'page-body');
  page.append(head, body);
  return { page, head, body };
}

function problemHead(p, n, total) {
  const frag = document.createDocumentFragment();
  const lead = el('div', 'head-lead');
  lead.append(txt('span', 'kind-badge', p.kind), txt('span', 'head-num', p.number));
  if (p.difficulty > 0) lead.append(txt('span', 'head-stars', '★'.repeat(p.difficulty)));
  if (p.sol) lead.append(txt('span', 'sol-tag', 'SOL'));
  lead.append(txt('span', 'ans-tag', '답안'));

  const h2 = el('h2', 'page-title');
  h2.append(txt('span', 'sr', `${p.kind} ${p.number} — `), document.createTextNode(p.title));

  const meta = el('div', 'head-meta');
  const info = [p.section, p.book_page != null ? `p.${p.book_page}` : '', `${n} / ${total}`];
  meta.append(txt('span', 'head-info', info.filter(Boolean).join(' · ')));

  frag.append(lead, h2, meta);
  return frag;
}

/* ---------- 문제 쪽 ---------- */
function figureImg(f) {
  const img = el('img', 'fig');
  img.src = f.src;
  img.alt = '';
  img.width = Math.round(f.w_mm * 10);
  img.height = Math.round(f.h_mm * 10);
  img.style.setProperty('--w-cap', `${f.w_mm * FIG_SCALE_CAP}mm`);
  img.style.setProperty('--ratio', f.w_mm / f.h_mm);
  return img;
}

function block(label, html, cls, lang) {
  const b = el('section', 'block');
  const body = el('div', `prose ${cls}`, breakEquations(html));
  if (lang) body.lang = lang;
  b.append(txt('div', 'block-label', label), body);
  return b;
}

function hintStrip(p) {
  const a = el('a', 'hint-strip');
  a.href = `#hint-${p.id}`;
  a.append(txt('div', 'hint-strip-label', 'Hint'));
  const ol = el('ol', 'hint-strip-list');
  p.hints.forEach((h, i) => {
    const li = el('li', 'hint-strip-item');
    li.dataset.n = i + 1;
    if (h.formula) li.append(stripFormula(h.formula));
    else li.append(el('span', 'hint-strip-text', h.label));   // 이름표 속 KaTeX가 grid 칸으로 흩어지지 않게
    ol.append(li);
  });
  a.append(ol);
  return a;
}

// 'formula'(구분자 없는 LaTeX)가 있으면 띠에는 이름표 대신 식을 보인다
function stripFormula(tex) {
  const span = el('span', 'hint-strip-formula');
  if (typeof katex !== 'undefined') katex.render(tex, span, { throwOnError: false });
  else span.textContent = tex;
  return span;
}

function fitStripFormulas(page) {
  for (const f of page.querySelectorAll('.hint-strip-formula')) {
    f.style.transform = '';
    const avail = f.clientWidth, need = f.scrollWidth;
    if (need > avail + 1) f.style.transform = `scale(${Math.max(STRIP_MATH_MIN_SCALE, avail / need)})`;
  }
}

// 가운데 칸: 풀이 단계와 답. solution이 없으면 빈 점 격자
function solutionArea(p) {
  const work = el('div', 'work');
  const s = p.solution;
  if (!s) return work;
  const flow = el('div', 'sol-flow');
  const ol = el('ol', 'sol-steps');
  (s.steps || []).forEach((st, i) => {
    const li = el('li', 'sol-step');
    li.dataset.n = i + 1;
    if (st.label) li.append(el('div', 'sol-step-label', st.label));
    li.append(el('div', 'prose sol-step-body', breakEquations(st.html)));
    ol.append(li);
  });
  flow.append(ol);
  work.append(flow);
  if (s.answer) {
    const a = block('답', s.answer, 'ask-box');
    a.classList.add('sol-answer');
    work.append(a);
  }
  return work;
}

function problemPage(p, n, total) {
  const { page, head, body } = makePage(kindSlug(p.kind), 'page--problem');
  page.id = p.id;
  head.append(problemHead(p, n, total));

  const row = el('div', 'page-row');
  const panel = el('div', 'panel');
  if (p.html.original) panel.append(block('문제 원문', p.html.original, 'original', p.original_lang || 'en'));   // 원문은 맨 처음
  if (p.html.conditions && p.html.conditions.trim()) panel.append(block('조건', p.html.conditions, 'conditions'));   // 조건이 없으면 라벨도 없다
  panel.append(block('구할 것', p.html.ask, 'ask-box'));
  const center = el('div', 'page-center');
  const figs = p.figures || [];
  if (figs.length) {
    const band = el('div', 'fig-band');
    figs.forEach(f => band.append(figureImg(f)));
    center.append(band);
  }
  center.append(solutionArea(p));
  row.append(panel, center);
  if (p.hints && p.hints.length) {
    row.classList.add('has-strip');
    if (p.hints.some(h => h.formula)) row.classList.add('has-formula');
    row.append(hintStrip(p));
  }
  body.append(row);
  return page;
}

// 6.5 쪽 맞춤. 들어가면 멈추고, 끝까지 넘치면 false.
function fitProblemPage(page) {
  const panel = page.querySelector('.panel');
  const fits = () => panel.scrollHeight <= panel.clientHeight + 1;
  const state = { pw: '33%', fs: '1' };
  for (const [prop, val] of FIT_STEPS) {
    if (fits()) break;
    panel.style.setProperty(prop, val);
    state[{ '--pw': 'pw', '--fs': 'fs' }[prop]] = val;
  }
  page.dataset.fit = `pw=${state.pw} fs=${state.fs}`;
  fitDisplayMath(panel);
  fitStripFormulas(page);
  const ok = fits();
  if (!ok) page.dataset.overflow = '';
  return ok;
}

// 풀이 칸 맞춤. 마지막 단계가 칸 아래나 오른쪽(넘친 단)으로 나가면 넘침.
function fitSolution(page) {
  const work = page.querySelector('.work');
  const flow = work.querySelector('.sol-flow');
  const last = flow && flow.querySelector('.sol-step:last-child');
  if (!last) return true;
  const fits = () => {
    fitDisplayMath(flow);
    const f = flow.getBoundingClientRect(), l = last.getBoundingClientRect();
    return l.bottom <= f.bottom + 1 && l.right <= f.right + 1;
  };
  const band = page.querySelector('.fig-band');
  const state = { sfs: '1', fig: '0.40', cols: '1' };
  for (const [key, val] of SOL_FIT_STEPS) {
    if (fits()) break;
    if (key === 'fig') {
      if (!band) continue;
      band.style.setProperty('--fig-frac', val);
    }
    else if (key === 'cols') flow.classList.add('is-2col');
    else work.style.setProperty(`--${key}`, val);
    state[key] = val;
  }
  const ok = fits();
  fitDisplayMath(work.querySelector('.sol-answer') || work);
  page.dataset.fit += ` sfs=${state.sfs} fig=${state.fig} cols=${state.cols}`;
  if (!ok) page.dataset.overflow = '';
  return ok;
}

/* ---------- Hint 쪽 ---------- */
function hintItem(h, i) {
  const li = el('li', 'hint-item');
  li.dataset.n = i + 1;
  li.append(el('div', 'hint-item-label', h.label), el('div', 'prose hint-item-body', breakEquations(h.html)));
  return li;
}

function hintPage(title, first) {
  const { page, head, body } = makePage('hint', 'page--hint');
  // 이어지는 Hint 쪽은 책갈피가 겹치지 않게 제목을 h2가 아닌 div로 둔다
  head.append(txt('span', 'kind-badge', 'Hint'), txt(first ? 'h2' : 'div', 'page-title', `Hint — ${title}`));
  const cols = el('div', 'hint-cols');
  body.append(cols);
  book.append(page);
  return cols;
}

function hintEntry(p, withId) {
  const root = el('article', 'hint-entry');
  if (withId) root.id = `hint-${p.id}`;
  const num = txt('a', 'hint-entry-num', `${KIND_SHORT[p.kind] || ''} ${p.number}`.trim());
  num.href = `#${p.id}`;
  const list = el('ol', 'hint-items');
  root.append(num, list);
  return { root, list };
}

// 6.6 항목을 하나씩 넣고, 단이 넘치면 새 Hint 쪽에 같은 문제 칸을 열어 잇는다.
function flowHints(meta, problems, staged) {
  const overflow = [];
  const list = problems.filter(p => p.hints && p.hints.length);
  if (!list.length) return overflow;

  let cols = hintPage(meta.title, true);
  const over = () => cols.scrollWidth > cols.clientWidth + 1;

  for (const p of list) {
    let idPlaced = false;
    let entry = hintEntry(p, true);
    cols.append(entry.root);
    for (const li of staged.get(p.id)) {
      entry.list.append(li);
      fitDisplayMath(li);
      if (!over()) continue;

      li.remove();
      if (entry.list.children.length) idPlaced = true;
      else entry.root.remove();
      cols = hintPage(meta.title, false);
      entry = hintEntry(p, !idPlaced);
      cols.append(entry.root);
      entry.list.append(li);
      fitDisplayMath(li);
      if (over()) {                 // 빈 쪽에도 안 들어가는 항목
        cols.closest('.page').dataset.overflow = '';
        overflow.push(`hint-${p.id}`);
      }
    }
  }
  return overflow;
}

/* ---------- 화면 배율 ---------- */
function applyZoom(z) {
  for (const page of book.querySelectorAll(':scope > .page')) page.style.zoom = z;
}
const screenZoom = () => applyZoom(Math.min(1, (innerWidth - 32) / PAGE_W_PX));

/* ---------- 실행 (6.9) ---------- */
async function main() {
  try {
    const data = await loadData();
    const { meta, problems } = data;
    document.title = meta.title;

    // DOM 생성
    const total = meta.total || problems.length;
    problems.forEach((p, i) => book.append(problemPage(p, i + 1, total)));
    const staging = el('div', 'staging');
    staging.setAttribute('aria-hidden', 'true');
    const staged = new Map();
    for (const p of problems) {
      const items = (p.hints || []).map(hintItem);
      staged.set(p.id, items);
      staging.append(...items);
    }
    document.body.append(staging);

    // 글꼴 + 그림 → KaTeX (수식 글꼴도 다 받은 뒤 잰다)
    await Promise.all([nextLayout(), ...[...document.images].map(img => img.decode().catch(() => {}))]);
    renderMath(book);
    renderMath(staging);
    await nextLayout();

    const overflow = [];
    for (const page of book.querySelectorAll('.page--problem')) {
      const panelOk = fitProblemPage(page);
      const solOk = fitSolution(page);
      if (!panelOk || !solOk) overflow.push(page.id);
    }
    overflow.push(...flowHints(meta, problems, staged));
    staging.remove();

    document.body.dataset.overflow = overflow.join(',');
    document.documentElement.dataset.ready = 'true';
  } catch (err) {
    console.error(err);
    book.append(txt('p', 'load-error', `문제 데이터를 읽지 못했습니다: ${err.message}`));
    document.body.dataset.overflow = '';
    document.documentElement.dataset.ready = 'error';
    return;
  }

  // 배율은 맞춤과 Hint 쪽 나누기가 끝난 뒤에만
  screenZoom();
  addEventListener('resize', screenZoom);
  addEventListener('beforeprint', () => applyZoom(''));
  addEventListener('afterprint', screenZoom);
}

addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>
