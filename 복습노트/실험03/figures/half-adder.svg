<path d="M500,90 L700,90" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M500,200 L700,200" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="98" font-size="22" text-anchor="start" fill="#222">S</text>
