<text x="460" y="48" font-size="20" text-anchor="middle" fill="#555">74HC86</text>
<text x="460" y="158" font-size="20" text-anchor="middle" fill="#555">74HC08</text>
<text x="720" y="132" font-size="22" text-anchor="start" fill="#555">S = A⊕B</text>
<text x="720" y="242" font-size="22" text-anchor="start" fill="#555">C = A·B</text></svg>