<svg xmlns="http://www.w3.org/2000/svg" width="135.0mm" height="48.0mm" viewBox="0 0 900 320" role="img"><title>반가산기 회로</title><desc>A와 B가 XOR로 합 S를, AND로 올림 C를 만든다</desc><style>text{font-family:Arial,"Malgun Gothic",sans-serif}</style><rect width="900" height="320" fill="white"/><text x="60" y="82" font-size="22" text-anchor="end" fill="#222">A</text>
