<svg xmlns="http://www.w3.org/2000/svg" width="135.0mm" height="45.0mm" viewBox="0 0 900 300" role="img"><title>출력 확인용 LED 연결</title><desc>게이트 출력에 330옴 저항과 LED를 직렬로 달아 GND에 연결하고 입력선은 5V나 GND에 꽂는다</desc><style>text{font-family:Arial,"Malgun Gothic",sans-serif}</style><rect width="900" height="300" fill="white"/><rect x="40" y="70" width="70" height="40" rx="6" fill="#fff" stroke="#222" stroke-width="3"/>
