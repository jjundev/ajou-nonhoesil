<text x="455" y="140" font-size="22" text-anchor="middle" fill="#222">게이트</text>
<text x="455" y="172" font-size="22" text-anchor="middle" fill="#222">IC</text>
<text x="450" y="285" font-size="20" text-anchor="middle" fill="#555">입력선을 5V나 GND에 번갈아 꽂아요</text>
