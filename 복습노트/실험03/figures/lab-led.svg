<text x="75" y="56" font-size="20" text-anchor="middle" fill="#555">1(H)</text>
<text x="75" y="256" font-size="20" text-anchor="middle" fill="#555">0(L)</text>
<path d="M110,90 L250,150" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
