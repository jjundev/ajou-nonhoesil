<svg xmlns="http://www.w3.org/2000/svg" width="150.0mm" height="37.5mm" viewBox="0 0 1000 250" role="img"><title>실험에서 쓰는 게이트 네 개</title><desc>NOT, AND, OR, XOR 기호와 IC 번호, 부울식</desc><style>text{font-family:Arial,"Malgun Gothic",sans-serif}</style><rect width="1000" height="250" fill="white"/><text x="40" y="128" font-size="22" text-anchor="end" fill="#222">A</text>
