<text x="470" y="128" font-size="22" text-anchor="start" fill="#222">Y</text>
<text x="510" y="113" font-size="22" text-anchor="end" fill="#222">A</text>
<text x="510" y="143" font-size="22" text-anchor="end" fill="#222">B</text>
<path d="M580,90 Q625,90 660,120 Q625,150 580,150 Q600,120 580,90 Z" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
<text x="622" y="127" font-size="20" text-anchor="middle" fill="#222">OR</text>
