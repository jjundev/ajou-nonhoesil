<path d="M900,120 L940,120" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="950" y="128" font-size="22" text-anchor="start" fill="#222">Y</text>
<text x="120" y="60" font-size="22" text-anchor="middle" fill="#555">NOT · 74HC04</text>
<text x="120" y="200" font-size="26" text-anchor="middle" fill="#222">Y = A′</text>
<text x="380" y="60" font-size="22" text-anchor="middle" fill="#555">AND · 74HC08</text>
<text x="380" y="200" font-size="26" text-anchor="middle" fill="#222">Y = A·B</text>
<text x="620" y="60" font-size="22" text-anchor="middle" fill="#555">OR · 74HC32</text>
<text x="620" y="200" font-size="26" text-anchor="middle" fill="#222">Y = A+B</text>
<text x="860" y="60" font-size="22" text-anchor="middle" fill="#555">XOR · 74HC86</text>
<text x="860" y="200" font-size="26" text-anchor="middle" fill="#222">Y = A⊕B</text></svg>