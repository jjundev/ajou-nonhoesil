  <text class="fig-text" x="560" y="44" font-size="24" text-anchor="middle">R<tspan baseline-shift="sub" font-size="78%">f</tspan>
  </text>
  <polyline points="640,74 680,74 680,420" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="680" cy="420" r="5" data-node="out" data-node-color="blue" />
