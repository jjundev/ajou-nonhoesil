  <text class="fig-text" x="791" y="428" font-size="26" text-anchor="start" data-node="out" data-node-color="blue">V<tspan baseline-shift="sub" font-size="78%">o</tspan>
  </text>
  <polyline points="470,460 430,460 430,490" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="430,490 430,500" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
