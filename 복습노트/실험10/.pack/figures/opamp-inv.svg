  <text class="fig-text" x="724" y="211" font-size="26" text-anchor="start" data-node="out" data-node-color="blue">V<tspan baseline-shift="sub" font-size="78%">out</tspan>
  </text>
  <polyline points="405,243 340,243 340,299" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="340,299 340,309" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
