  <text x="425" y="252" font-size="28" text-anchor="start" fill="#18212e" font-weight="bold" data-fill="ink">+</text>
  <text x="463.8" y="211" font-size="18" text-anchor="middle" fill="#6b7585" data-fill="muted">Op-Amp</text>
