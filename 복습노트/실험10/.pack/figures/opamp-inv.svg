<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>반전 증폭기</title><desc>Vin이 R1을 지나 반전 입력으로, Rf가 출력을 반전 입력으로 되돌려요. 비반전 입력은 GND.</desc><rect width="860" height="380" fill="#fff"/><path d="M420,130 L420,290 L560,210 Z" fill="#e8f1ff" stroke="#2674df" stroke-width="3" stroke-linejoin="round"/><text x="434" y="179" font-size="28" text-anchor="start" fill="#18212e" font-weight="bold">−</text><text x="434" y="259" font-size="28" text-anchor="start" fill="#18212e" font-weight="bold">+</text><text x="478.8" y="218" font-size="18" text-anchor="middle" fill="#6b7585">Op-Amp</text><circle cx="120" cy="170" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><text x="108" y="177" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Vin</text><polyline points="126,170 198,170" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M198,170 l5,-10 l10,20 l10,-20 l10,20 l10,-20 l10,20 l5,-10" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><polyline points="258,170 330,170" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="228" y="154" font-size="18" text-anchor="middle" fill="#18212e">R1</text><polyline points="330,170 420,170" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="170" r="5.5" fill="#18212e"/><polyline points="360,170 360,80 440,80" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="440,80 490,80" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M490,80 l5,-10 l10,20 l10,-20 l10,20 l10,-20 l10,20 l5,-10" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><polyline points="550,80 600,80" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="64" font-size="18" text-anchor="middle" fill="#18212e">Rf</text><polyline points="600,80 640,80 640,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="210" r="5.5" fill="#18212e"/><polyline points="560,210 720,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="726" cy="210" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><text x="738" y="217" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">Vout</text><polyline points="420,250 370,250 370,300" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,300 370,310" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="355,310 385,310" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="361,317 379,317" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="367,324 373,324" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="204" font-size="20" text-anchor="end" fill="#c0392b">V− ≈ 0V</text><text x="420" y="360" font-size="22" text-anchor="middle" fill="#2674df" font-weight="bold">Vout = −(Rf/R1)·Vin</text></svg>