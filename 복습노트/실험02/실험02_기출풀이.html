<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>답안지</title>
<link rel="stylesheet" href="assets/vendor/pretendard/pretendard.css">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<script defer src="assets/vendor/katex/katex.min.js"></script>
<script defer src="assets/vendor/katex/auto-render.min.js"></script>
<style>
/* ==========================================================================
   답안지 템플릿 (문제 + 풀이 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 문제 데이터는 문제집과 같고, 문제마다
   solution {steps: [{label, html}], answer} 를 더한다. 1–3절은 문제집 템플릿과 같다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 10pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 6.5pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 15pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 9pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.ans-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--kind);
  border: .25mm solid var(--kind); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 10pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 7.5pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 40mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문: 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 (문제지와 같음) */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* 풀이 칸 (답안지): 점 격자 위에 번호 단계, 맨 아래 답. 맞춤: 글자 0.9 → 0.8 → 2단 */
.work {
  --sfs: 1;
  --sol-step-gap: 10mm;          /* 풀이 단계 사이 상하 여백 */
  display: flex; flex-direction: column; gap: 3mm; overflow: hidden;
  padding: 1mm 2mm 0 1mm;
  font-size: calc(var(--fs-body) * var(--sfs));
}
.sol-flow { flex: 1; min-height: 0; overflow: hidden; padding-top: 2.5mm; column-gap: 8mm; column-fill: auto; }
.sol-flow.is-2col { column-count: 2; }
.sol-steps { list-style: none; margin: 0; padding: 0; }
.sol-step {
  display: grid; grid-template-columns: 5mm minmax(0, 1fr); column-gap: 2mm;
  break-inside: avoid;
}
.sol-step + .sol-step { margin-top: var(--sol-step-gap); }
.sol-step::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: start;
  width: 5mm; height: 5mm; border-radius: 50%;
  background: var(--kind); color: var(--paper);
  font-size: 7pt; font-weight: 700; line-height: 5mm; text-align: center;
}
.sol-step-label {
  grid-column: 2; grid-row: 1; align-self: center;
  font-size: .9em; font-weight: 700; line-height: 1.3;
}
.sol-step-body { grid-column: 2; margin-top: 2.5mm; }
.sol-step-body:first-child { grid-row: 1; margin-top: 0; }
.sol-step-body .katex-display { overflow-x: clip; }
.sol-answer { flex: none; }

/* Hint 띠: 전체가 Hint 쪽 링크 */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 9pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 7.5pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 표: 격자선, 머리행 강조. 원문 표의 빈 칸은 태블릿 펜으로 쓸 높이(7mm)를 갖는다 */
#book table { border-collapse: collapse; width: 100%; margin: 1mm 0; }
#book th, #book td {
  border: .3mm solid var(--ink); padding: 1.2mm 1.2mm; text-align: center;
  overflow-wrap: break-word; word-break: keep-all; line-height: 1.3;
}
#book th { font-weight: 700; background: var(--paper); }
#book .original td { height: 7mm; }
/* 채울 표(work-table)는 풀이 칸 맨 위(.work-block)로 옮겨진다. 풀이 공간은 최소 25mm를 남긴다 */
#book .work-block { flex: none; }
#book .work-block .table-wrap { margin: 0; }
#book .work-block table { table-layout: fixed; margin: 0; }
#book .work-block td { height: 7mm; }
.page-center > .work-block ~ .work { min-height: 25mm; }

/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 9.5pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 9pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.5pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 8.5pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}
</style>
</head>

<script type="application/json" id="workbook-data">{"meta": {"mode": "answers", "title": "실험 2 · 기출 풀이", "chapter": 0, "total": 14}, "problems": [{"id": "q-region", "kind": "기출", "number": "1", "title": "입력 전압 구간 표시하기", "section": "실험 2 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 그림은 CMOS의 입력 전압 값의 변화를 나타낸 것이다. 아래 그림에 CMOS inverter의 출력이 High, Low, Abnormal 상태가 되는 구간을 표시하여라.(단, VCC= 5V, VIHmin= 3.5V, VILmax=1.5V, GND=0V이다)\u003c/p>", "conditions": "\u003cp>$V_{CC}=5\\,\\mathrm{V}$, $V_{IHmin}=3.5\\,\\mathrm{V}$, $V_{ILmax}=1.5\\,\\mathrm{V}$, $GND=0\\,\\mathrm{V}$이에요. 입력은 GND에 머물다가 직선으로 VCC까지 오른 뒤 VCC로 유지돼요.\u003c/p>", "ask": "\u003cp>그림의 시간축 위에 High, Low, Abnormal 상태가 되는 구간을 표시하세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-region-given-01.png", "w_mm": 130.0, "h_mm": 55.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>먼저 1.5 V와 3.5 V에 가로선을 긋고, 입력선이 그 선을 지나는 시각을 찾아요. 그 시각으로 시간축을 세 구간으로 나눠요.\u003c/p>"}, {"label": "인버터 주의", "html": "\u003cp>입력 레벨과 출력 레벨은 인버터에서 서로 반대예요. 문제가 “출력”을 물었는지 확인해요.\u003c/p>"}], "solution": {"steps": [{"label": "기준선과 구간", "html": "\u003cp>$V_{ILmax}=1.5\\,\\mathrm{V}$, $V_{IHmin}=3.5\\,\\mathrm{V}$에 가로선을 긋고 입력선이 지나는 시각을 $t_1$, $t_2$라 해요. $t_1$ 이전은 입력 Low, $t_1$~$t_2$는 Abnormal, $t_2$ 이후는 입력 High예요.\u003c/p>"}, {"label": "인버터 출력으로 바꾸기", "html": "\u003cp>인버터는 입력과 반대로 내보내요. 입력 Low 구간은 출력 High, 입력 High 구간은 출력 Low, 가운데는 출력이 보장되지 않는 Abnormal이에요.\u003c/p>"}, {"label": "완성 그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-region-solution-01.png\" width=\"360\" style=\"max-width:100%;height:auto\" alt=\"입력 상승 직선과 1.5 V, 3.5 V 기준선, 시간축 위 세 구간 표시\">\u003c/p>"}, {"label": "검산과 흔한 실수", "html": "\u003cp>입력 0 V는 Low 구간이고 출력은 5 V 근처예요. 흔한 실수는 출력을 입력과 같은 방향으로 표기하는 거예요. 채점 기준본은 전압 구역을 입력 기준으로 적었으니, 입력·출력 레벨을 함께 적으면 안전해요.\u003c/p>"}], "answer": "\u003cp>$t_1$ 이전: 입력 Low → 출력 High, $t_1$~$t_2$: Abnormal, $t_2$ 이후: 입력 High → 출력 Low. ($t_1$, $t_2$는 입력이 1.5 V, 3.5 V를 지나는 시각이에요.)\u003c/p>"}}, {"id": "q-params-4", "kind": "예상문제", "number": "2", "title": "CMOS 주요 파라미터 네 가지", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 주요 parameters에 대해 설명하여라.\u003c/p>\u003cp>$V_{OHmin}$ : / $V_{IHmin}$ : / $V_{ILmax}$ : / $V_{OLmax}$ :\u003c/p>", "conditions": "", "ask": "\u003cp>네 기호가 무엇을 뜻하는지 각각 설명하세요. (원문은 답 칸이 비어 있어요.)\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>이름을 풀어 읽어요. 첫 글자 V는 전압, I/O는 입력/출력, H/L은 High/Low, min/max는 최소/최대예요.\u003c/p>"}], "solution": {"steps": [{"label": "$V_{OHmin}$", "html": "\u003cp>HIGH를 출력할 때 최소 허용 전압이에요. 출력이 이 값 이상이어야 High로 인정돼요.\u003c/p>"}, {"label": "$V_{IHmin}$", "html": "\u003cp>HIGH를 입력 받을 때 최소 입력 전압이에요. 입력이 이 값 이상이면 High로 알아들어요.\u003c/p>"}, {"label": "$V_{ILmax}$", "html": "\u003cp>LOW를 입력 받을 때 최대 입력 전압이에요. 입력이 이 값 이하면 Low로 알아들어요.\u003c/p>"}, {"label": "$V_{OLmax}$", "html": "\u003cp>LOW를 출력할 때 최대 허용 전압이에요. 출력이 이 값 이하여야 Low로 인정돼요.\u003c/p>"}, {"label": "그림으로 위치 확인", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-params-4-solution-01.png\" width=\"480\" style=\"max-width:100%;height:auto\" alt=\"VCC에서 GND까지 V_OHmin, V_IHmin, V_ILmax, V_OLmax의 위치와 ABNORMAL 구간을 보여 주는 전압 사다리\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>순서는 $GND \u003c V_{OLmax} \u003c V_{ILmax} \u003c V_{IHmin} \u003c V_{OHmin} \u003c V_{CC}$예요. 입력 기준 사이가 Abnormal이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>입력 기준과 출력 기준을 서로 바꿔 쓰는 거예요. 입력은 I, 출력은 O로 구분해요.\u003c/p>"}], "answer": "\u003cp>$V_{OHmin}$: HIGH를 출력할 때 최소 허용 전압이에요. 출력이 이 값 이상이어야 High로 인정돼요. / $V_{IHmin}$: HIGH를 입력 받을 때 최소 입력 전압이에요. 입력이 이 값 이상이면 High로 알아들어요. / $V_{ILmax}$: LOW를 입력 받을 때 최대 입력 전압이에요. 입력이 이 값 이하면 Low로 알아들어요. / $V_{OLmax}$: LOW를 출력할 때 최대 허용 전압이에요. 출력이 이 값 이하여야 Low로 인정돼요.\u003c/p>"}}, {"id": "q-params-2017", "kind": "기출", "number": "3", "title": "CMOS 주요 파라미터 (VOHmin, VILmax)", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 주요 parameter에 대해 설명하여라.\u003c/p>\u003cp>$V_{OHmin}$ : / $V_{ILmax}$ :\u003c/p>", "conditions": "", "ask": "\u003cp>두 기호를 각각 설명하세요. (원문은 답 칸이 비어 있어요.)\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>이름을 풀어 읽어요. 첫 글자 V는 전압, I/O는 입력/출력, H/L은 High/Low, min/max는 최소/최대예요.\u003c/p>"}], "solution": {"steps": [{"label": "$V_{OHmin}$", "html": "\u003cp>HIGH를 출력할 때 최소 허용 전압이에요. 출력이 이 값 이상이어야 High로 인정돼요.\u003c/p>"}, {"label": "$V_{ILmax}$", "html": "\u003cp>LOW를 입력 받을 때 최대 입력 전압이에요. 입력이 이 값 이하면 Low로 알아들어요.\u003c/p>"}, {"label": "그림으로 위치 확인", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-params-2017-solution-01.png\" width=\"480\" style=\"max-width:100%;height:auto\" alt=\"VCC에서 GND까지 V_OHmin, V_IHmin, V_ILmax, V_OLmax의 위치와 ABNORMAL 구간을 보여 주는 전압 사다리\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>순서는 $GND \u003c V_{OLmax} \u003c V_{ILmax} \u003c V_{IHmin} \u003c V_{OHmin} \u003c V_{CC}$예요. 입력 기준 사이가 Abnormal이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>입력 기준과 출력 기준을 서로 바꿔 쓰는 거예요. 입력은 I, 출력은 O로 구분해요.\u003c/p>"}], "answer": "\u003cp>$V_{OHmin}$: HIGH를 출력할 때 최소 허용 전압이에요. 출력이 이 값 이상이어야 High로 인정돼요. / $V_{ILmax}$: LOW를 입력 받을 때 최대 입력 전압이에요. 입력이 이 값 이하면 Low로 알아들어요.\u003c/p>"}}, {"id": "q-params-2016", "kind": "기출", "number": "4", "title": "CMOS 주요 파라미터 (VIHmin, VOLmax)", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 주요 parameters에 대해 설명하여라.\u003c/p>\u003cp>$V_{IHmin}$ : / $V_{OLmax}$ :\u003c/p>", "conditions": "", "ask": "\u003cp>두 기호를 각각 설명하세요. (원문은 답 칸이 비어 있어요.)\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>이름을 풀어 읽어요. 첫 글자 V는 전압, I/O는 입력/출력, H/L은 High/Low, min/max는 최소/최대예요.\u003c/p>"}], "solution": {"steps": [{"label": "$V_{IHmin}$", "html": "\u003cp>HIGH를 입력 받을 때 최소 입력 전압이에요. 입력이 이 값 이상이면 High로 알아들어요.\u003c/p>"}, {"label": "$V_{OLmax}$", "html": "\u003cp>LOW를 출력할 때 최대 허용 전압이에요. 출력이 이 값 이하여야 Low로 인정돼요.\u003c/p>"}, {"label": "그림으로 위치 확인", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-params-2016-solution-01.png\" width=\"480\" style=\"max-width:100%;height:auto\" alt=\"VCC에서 GND까지 V_OHmin, V_IHmin, V_ILmax, V_OLmax의 위치와 ABNORMAL 구간을 보여 주는 전압 사다리\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>순서는 $GND \u003c V_{OLmax} \u003c V_{ILmax} \u003c V_{IHmin} \u003c V_{OHmin} \u003c V_{CC}$예요. 입력 기준 사이가 Abnormal이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>입력 기준과 출력 기준을 서로 바꿔 쓰는 거예요. 입력은 I, 출력은 O로 구분해요.\u003c/p>"}], "answer": "\u003cp>$V_{IHmin}$: HIGH를 입력 받을 때 최소 입력 전압이에요. 입력이 이 값 이상이면 High로 알아들어요. / $V_{OLmax}$: LOW를 출력할 때 최대 허용 전압이에요. 출력이 이 값 이하여야 Low로 인정돼요.\u003c/p>"}}, {"id": "q-schmitt-noise", "kind": "기출", "number": "5", "title": "Schmitt-trigger가 잡음에 덜 민감한 이유", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Schmitt-trigger inverter의 출력이 입력 잡음에 영향을 덜 받게 되는 이유를 입출력 특성을 이용하여 설명하여라.\u003c/p>", "conditions": "", "ask": "\u003cp>입출력 특성(히스테리시스 곡선)을 이용해 이유를 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>일반 인버터는 문턱이 하나예요. Schmitt는 문턱이 몇 개이고, 두 문턱 사이에서 출력이 어떻게 되는지 떠올려 봐요.\u003c/p>"}, {"label": "쓸 그림", "html": "\u003cp>가로축 입력, 세로축 출력인 곡선에 $V_{T-}$, $V_{T+}$를 표시하면 설명이 쉬워요.\u003c/p>"}], "solution": {"steps": [{"label": "일반 인버터의 문제", "html": "\u003cp>문턱이 하나라서 입력이 그 문턱 근처에서 조금만 흔들려도 출력이 계속 뒤집혀요.\u003c/p>"}, {"label": "Schmitt의 입출력 특성", "html": "\u003cp>올라갈 때는 $V_{T+}$, 내려올 때는 $V_{T-}$에서 출력이 바뀌는 히스테리시스 곡선이에요. 두 문턱 사이(폭 $V_H = V_{T+} - V_{T-}$)에서는 출력이 직전 값을 유지해요.\u003c/p>"}, {"label": "잡음이 들어올 때", "html": "\u003cp>잡음 때문에 입력이 두 문턱 사이에서만 흔들리면 출력은 바뀌지 않아요. 잡음이 $V_{T+}$를 넘거나 $V_{T-}$ 아래로 내려갈 만큼 클 때만 출력이 바뀌어요.\u003c/p>"}, {"label": "그림으로 확인", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-schmitt-noise-solution-01.png\" width=\"460\" style=\"max-width:100%;height:auto\" alt=\"문턱 근처에서 흔들리는 입력에 대해 인버터 출력은 5번 뒤집히고 Schmitt 출력은 한 번만 바뀌는 비교\">\u003c/p>"}, {"label": "정리", "html": "\u003cp>Schmitt-trigger는 기준치(두 문턱)에 의해 Low, High가 정해지면, 잡음이 Abnormal에 해당하는 두 문턱 사이에서 흔들려도 출력이 유지돼서 영향을 덜 받아요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>그림에서 입력이 2.3~2.75 V 사이를 오갈 때 인버터 출력은 2.5 V를 지날 때마다 뒤집혀 모두 5번 바뀌지만, Schmitt 출력은 입력이 2.9 V를 넘는 순간 한 번만 바뀌어요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>“문턱이 높아서” 또는 “문턱이 낮아서”라고만 쓰는 거예요. 문턱이 두 개이고 그 사이에서 출력이 유지된다는 점을 써야 해요.\u003c/p>"}], "answer": "\u003cp>상승 문턱 $V_{T+}$와 하강 문턱 $V_{T-}$가 달라서 두 문턱 사이(히스테리시스 폭 $V_H$)의 잡음에는 출력이 바뀌지 않기 때문이에요.\u003c/p>"}}, {"id": "q-schmitt-waveform", "kind": "기출", "number": "6", "title": "같은 입력에 대한 인버터와 Schmitt 출력", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래 그림과 같은 입력이 인버터와 Schmitt-trigger inverter에 입력될 경우 각각의 출력을 그리시오.\u003c/p>", "conditions": "\u003cp>기준선은 $V_{T+}=2.9$, $V_T=2.5$, $V_{T-}=2.1$이에요. 입력은 0 근처에서 출발해 기준선 주변을 여러 번 오르내린 뒤 5.0 근처 최고점을 지나 0 근처로 내려가요. 인버터는 $V_T$에서, Schmitt는 $V_{T+}$와 $V_{T-}$에서 바뀌어요.\u003c/p>", "ask": "\u003cp>인버터와 Schmitt-trigger inverter의 출력 파형을 각각 그리세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-schmitt-waveform-given-01.png", "w_mm": 129.0, "h_mm": 60.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>입력선이 각 기준선을 지나는 곳마다 세로 점선을 내려 봐요. 일반 인버터는 $V_T$ 하나만, Schmitt는 올라갈 때 $V_{T+}$, 내려올 때 $V_{T-}$만 봐요.\u003c/p>"}, {"label": "시작 상태", "html": "\u003cp>입력이 0 근처에서 시작하므로 두 출력은 모두 High에서 시작해요.\u003c/p>"}], "solution": {"steps": [{"label": "두 출력 따라가기", "html": "\u003cp>인버터는 $V_T=2.5$를 지날 때마다 뒤집혀서 12번 바뀌어요. Schmitt는 High에서 시작해 처음으로 $V_{T+}=2.9$ 위로 올라갈 때 Low가 되고, $V_{T-}=2.1$ 아래로 내려가기 전까지 Low를 유지해요. 맨 끝에서 $V_{T-}$ 아래로 내려갈 때 High로 돌아와 모두 2번 바뀌어요.\u003c/p>"}, {"label": "완성 그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-schmitt-waveform-solution-01.png\" width=\"300\" style=\"max-width:100%;height:auto\" alt=\"같은 입력에서 인버터 출력은 12번 뒤집히고 Schmitt 출력은 두 번만 바뀌는 파형\">\u003c/p>"}, {"label": "검산과 흔한 실수", "html": "\u003cp>Schmitt가 Low인 동안 입력의 골은 $V_{T-}$보다 높아요. 흔한 실수는 Schmitt도 $V_T$에서 바뀐다고 그리는 거예요.\u003c/p>"}], "answer": "\u003cp>인버터: $V_T$를 지날 때마다 High↔Low로 바뀌어 모두 12번 바뀌어요. Schmitt: High에서 시작해 첫 번째 $V_{T+}$ 돌파에서 Low로, 마지막 $V_{T-}$ 하향 돌파에서 High로 단 두 번만 바뀌어요.\u003c/p>"}}, {"id": "q-rprn-effect", "kind": "기출", "number": "7", "title": "Rp와 Rn이 출력에 미치는 영향", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 내부 저항 Rp와 Rn이 CMOS의 출력에 미치는 영향에 대해 설명하여라.\u003c/p>", "conditions": "\u003cp>CMOS 내부 회로는 VCC와 GND 사이에 $R_p$, $R_n$이 직렬로 있고, 가운데 출력 노드가 resistive load에 이어져 있어요. 입력은 Vin이에요.\u003c/p>", "ask": "\u003cp>$R_p$와 $R_n$이 출력에 어떤 영향을 주는지 설명하세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-rprn-effect-given-01.png", "w_mm": 90.0, "h_mm": 62.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>입력이 High일 때와 Low일 때 각각 어느 저항이 켜지는지, 그 저항에 전류가 흐르면 출력 전압이 어떻게 되는지 써 봐요.\u003c/p>"}], "solution": {"steps": [{"label": "입력 Low (출력 High)", "html": "\u003cp>$R_p$가 켜지고 $R_n$은 꺼져요. 전류가 $R_p$를 거쳐 부하로 흘러서(sourcing) $V_{OH} = V_{DD} - |I_{OH}|R_p$예요.\u003c/p>"}, {"label": "입력 High (출력 Low)", "html": "\u003cp>$R_n$이 켜지고 $R_p$는 꺼져요. 부하 쪽 전류가 $R_n$을 거쳐 GND로 흘러서(sinking) $V_{OL} = I_{OL}R_n$이에요. 꺼진 쪽은 1 MΩ 이상이라 전류가 거의 없어요.\u003c/p>"}, {"label": "그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-rprn-effect-solution-01.png\" width=\"440\" style=\"max-width:100%;height:auto\" alt=\"입력 High일 때 R_n으로 sinking, 입력 Low일 때 R_p로 sourcing 전류가 흐르는 두 경우의 회로\">\u003c/p>"}, {"label": "정리와 검산", "html": "\u003cp>저항이 작을수록 출력이 VCC, GND에 가까워 $V_{OHmin}$, $V_{OLmax}$를 지키기 쉬워요. 부하 전류가 0이면 $V_{OH}=V_{DD}$, $V_{OL}=0$이에요. 흔한 실수는 두 저항이 동시에 켜진다고 쓰는 거예요.\u003c/p>"}], "answer": "\u003cp>켜진 저항(입력 Low면 $R_p$, 입력 High면 $R_n$)에서 전압이 떨어져 출력은 $V_{OH}=V_{DD}-|I_{OH}|R_p$, $V_{OL}=I_{OL}R_n$이 돼요. 그래서 저항이 작을수록 출력 레벨이 좋아요.\u003c/p>"}}, {"id": "q-rp-derive", "kind": "기출", "number": "8", "title": "Rp 값 유도", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 내부 회로도를 이용하여 내부저항 Rp의 값을 유도하여라.\u003c/p>", "conditions": "\u003cp>$R_p$는 VCC와 출력 노드 사이의 저항이에요. 출력이 High일 때의 전압 기준은 $V_{OHmin}$, 허용 전류는 $I_{OHmax}$예요.\u003c/p>", "ask": "\u003cp>$R_p$를 구하는 식을 유도하세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-rp-derive-given-01.png", "w_mm": 90.0, "h_mm": 62.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>출력이 High가 되는 입력 레벨을 먼저 정해요. 그때 전류가 어디서 어디로 흐르는지 그림에 그리고, $R_p$ 양단 전압을 적어 봐요.\u003c/p>"}], "solution": {"steps": [{"label": "조건과 전류 길", "html": "\u003cp>$R_p$가 켜지는 때는 입력 Low, 출력 High예요. 전류(sourcing)는 VCC → $R_p$ → 출력 노드 → 부하 → GND로 흘러요.\u003c/p>"}, {"label": "식 세우기", "html": "\u003cp>$R_p$ 양단 전압은 $V_{DD}-V_{OH}$, 전류는 $|I_{OH}|$예요. 옴의 법칙으로 $V_{DD}-V_{OH}=|I_{OH}|R_p$이고, 한계 $V_{OH}=V_{OHmin}$, $|I_{OH}|=|I_{OHmax}|$에서 $R_{p(on)}$이 정해져요.\u003c/p>"}, {"label": "완성 그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-rp-derive-solution-01.png\" width=\"340\" style=\"max-width:100%;height:auto\" alt=\"입력 Low일 때 VCC에서 R_p를 거쳐 부하로 흐르는 I_OHmax와 출력 노드의 V_OHmin이 표시된 회로\">\u003c/p>"}, {"label": "검산과 흔한 실수", "html": "\u003cp>단위는 V/A = Ω예요. 흔한 실수는 그림에 $V_{OHmin}$, $I_{OHmax}$ 위치를 표시하지 않거나 부호를 거꾸로 쓰는 거예요.\u003c/p>"}], "answer": "\u003cp>$R_{p(on)} = \\dfrac{V_{DD}-V_{OHmin}}{|I_{OHmax}|}$\u003c/p>"}}, {"id": "q-rp-derive-current", "kind": "기출", "number": "9", "title": "Rp 유도: 입력 level별 전류 흐름", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 내부 회로도를 이용하여 내부저항 Rp의 값을 유도하여라.(입력 level에 따른 전류의 흐름을 이용하여 설명하시오)\u003c/p>", "conditions": "\u003cp>같은 내부 회로(VCC–$R_p$–출력 노드–$R_n$–GND, 출력 노드에 resistive load)를 써요. 입력 레벨에 따라 전류가 흐르는 길을 설명에 포함해요.\u003c/p>", "ask": "\u003cp>입력 level에 따른 전류의 흐름을 이용해 $R_p$를 유도하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>입력이 High일 때와 Low일 때 각각 전류가 흐르는 길을 한 줄씩 써 봐요. $R_p$가 쓰이는 쪽에서 식을 세워요.\u003c/p>"}], "solution": {"steps": [{"label": "입력 High일 때", "html": "\u003cp>$R_n$이 켜지고 $R_p$는 꺼져요. 전류는 부하에서 $R_n$을 거쳐 GND로 흘러요. 이 경우는 $R_p$ 식과 상관없어요.\u003c/p>"}, {"label": "입력 Low일 때", "html": "\u003cp>$R_p$가 켜지고 $R_n$은 꺼져요. 전류는 VCC에서 $R_p$를 거쳐 부하로 흘러요(sourcing). 출력은 High예요.\u003c/p>"}, {"label": "식 세우기", "html": "\u003cp>$R_p$ 양단 전압은 $V_{DD}-V_{OH}$예요. 한계 조건에서 $V_{OH}=V_{OHmin}$, 전류는 $|I_{OHmax}|$예요. $V_{DD}-V_{OHmin} = |I_{OHmax}|\\cdot R_{p(on)}$이에요.\u003c/p>"}, {"label": "완성 그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-rp-derive-current-solution-01.png\" width=\"460\" style=\"max-width:100%;height:auto\" alt=\"입력 Low일 때 VCC에서 R_p를 거쳐 부하로 흐르는 전류 I_OHmax와 V_OHmin이 표시된 회로\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>채점 기준본의 그림과 식이 같아요. 그림에는 sourcing current, $R_p$, $V_{OHmin}$, $I_{OHmax}$가 표시돼요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>식만 외워서 쓰는 거예요. 채점 메모는 그림에 어디가 $V_{OHmin}$이고 $I_{OHmax}$인지 표시하라고 했어요.\u003c/p>"}], "answer": "\u003cp>입력 Low: $R_p$ on, 전류는 VCC → $R_p$ → 부하. $R_{p(on)} = \\dfrac{V_{DD}-V_{OHmin}}{|I_{OHmax}|}$\u003c/p>"}}, {"id": "q-rn-derive", "kind": "예상문제", "number": "10", "title": "Rn 유도: 입력 level별 전류 흐름", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 내부 회로도를 이용하여 내부저항 Rn의 값을 유도하여라.(입력 level에 따른 전류의 흐름을 이용하여 설명하시오)\u003c/p>", "conditions": "\u003cp>같은 내부 회로를 써요. 출력이 Low일 때의 전압 기준은 $V_{OLmax}$, 허용 전류는 $I_{OLmax}$예요.\u003c/p>", "ask": "\u003cp>입력 level에 따른 전류의 흐름을 이용해 $R_n$을 유도하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>$R_p$ 유도와 거울상이에요. 어느 입력 레벨에서 $R_n$이 켜지는지, 전류가 어디서 어디로 가는지 먼저 써 봐요.\u003c/p>"}], "solution": {"steps": [{"label": "입력 High일 때", "html": "\u003cp>$R_n$이 켜지고 $R_p$는 꺼져요(1 MΩ 이상). 출력은 Low예요.\u003c/p>"}, {"label": "전류 길", "html": "\u003cp>VCC → 부하 → 출력 노드 → $R_n$ → GND로 전류(sinking)가 흘러요.\u003c/p>"}, {"label": "식 세우기", "html": "\u003cp>$R_n$ 양단 전압이 출력 전압 $V_{OL}$이고 전류는 $I_{OL}$이에요. $V_{OL}=I_{OL}R_n$이에요. 한계에서 $V_{OL}=V_{OLmax}$, $I_{OL}=I_{OLmax}$예요.\u003c/p>"}, {"label": "완성 그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-rn-derive-solution-01.png\" width=\"460\" style=\"max-width:100%;height:auto\" alt=\"입력 High일 때 부하에서 R_n을 거쳐 GND로 흐르는 전류 I_OLmax와 V_OLmax가 표시된 회로\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>단위는 V/A = Ω예요. 교안 6쪽 (a) 그림의 $R_{n(on)}=V_{OLmax}/I_{OLmax}$와 같아요. $R_n$은 GND 쪽이라서 분자에 $V_{DD}$가 들어가지 않아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>$R_p$ 식처럼 $V_{DD}-V$를 쓰는 거예요. $R_n$은 GND 기준이라서 $V_{OLmax}$만 써요.\u003c/p>"}], "answer": "\u003cp>$R_{n(on)} = \\dfrac{V_{OLmax}}{I_{OLmax}}$\u003c/p>"}}, {"id": "q-prop-delay", "kind": "기출", "number": "11", "title": "전달 지연이 나타나는 이유", "section": "실험 2 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 출력 특성 중 전달지연(Propagation delay)가 나타나는 이유를 설명하여라.\u003c/p>", "conditions": "", "ask": "\u003cp>전달 지연이 나타나는 이유를 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>이상적인 경우와 실제의 차이를 먼저 써요. 실제 회로에서 출력에 매달려 있는 것이 무엇인지 생각해 봐요.\u003c/p>"}], "solution": {"steps": [{"label": "이상과 현실", "html": "\u003cp>이상적인 인버터는 입력이 바뀌는 순간 출력도 바뀌어서 지연이 없어요. 실제 회로에는 다음 단의 입력 용량 같은 capacitive load $C_L$과 켜진 트랜지스터의 저항 $R$이 있어요.\u003c/p>"}, {"label": "왜 시간이 걸리나", "html": "\u003cp>용량의 전압은 순간적으로 바뀌지 못해요. 저항을 거쳐 서서히 충전·방전돼서 출력이 입력을 따라 바뀌는 데 시간이 걸려요.\u003c/p>"}, {"label": "전달 지연의 정의", "html": "\u003cp>입력이 Vcc의 50%를 지나는 때부터 출력이 50%를 지나는 때까지가 전달 지연($t_{PHL}$, $t_{PLH}$)이에요.\u003c/p>"}, {"label": "그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-prop-delay-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"입력이 바뀐 뒤 실제 출력이 지수 곡선으로 서서히 변하고 이상적 출력은 점선으로 바로 뒤집히는 비교\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>간단한 RC 모델에서 50% 지연은 $0.69\\,RC$예요. $R$이나 $C_L$이 0이면 지연도 0이 되어 이상적인 경우와 같아요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>“스위치가 느려서”처럼 소자 이름만 쓰는 거예요. 용량과 저항 때문에 충전·방전에 시간이 걸린다는 이유를 적어야 해요.\u003c/p>"}], "answer": "\u003cp>이론상 지연은 없지만 실제로는 capacitive load와 저항이 있어서 용량을 충전·방전하는 데 시간이 걸리기 때문이에요.\u003c/p>"}}, {"id": "q-delay-transition", "kind": "기출", "number": "12", "title": "전달 지연과 천이 시간 (묶음)", "section": "실험 2 · 정답 미확정", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS의 전달 지연과 천이 시간에 대해 설명하시오.\u003c/p>\u003cp>(1) 전달 지연(Propagation delay)가 나타나는 이유\u003c/p>\u003cp>(2) 천이 시간(Transition time)이 H->L 일때와 L->H일때 다른 이유\u003c/p>", "conditions": "", "ask": "\u003cp>(1)과 (2)를 각각 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "(1)", "html": "\u003cp>이상적인 경우와 실제의 차이를 써요.\u003c/p>"}, {"label": "(2)", "html": "\u003cp>출력이 내려갈 때와 올라갈 때 용량이 어떤 저항을 거쳐 충전·방전되는지 비교해 봐요.\u003c/p>"}], "solution": {"steps": [{"label": "(1) 전달 지연", "html": "\u003cp>실제 출력에는 용량 $C_L$과 저항 $R$이 있어서 충전·방전에 시간이 걸려요. 입력 50%에서 출력 50%까지가 전달 지연이에요.\u003c/p>"}, {"label": "두 방향의 길", "html": "\u003cp>출력이 H→L로 가면 부하 용량이 $R_n$을 통해 방전돼요. L→H로 가면 $R_p$를 통해 충전돼요.\u003c/p>"}, {"label": "시간 상수", "html": "\u003cp>$R_{n(on)}$과 $R_{p(on)}$이 같지 않으면 시간 상수 $R\\cdot C_L$이 달라서 10%에서 90%까지 걸리는 시간이 달라요.\u003c/p>"}, {"label": "그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-delay-transition-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"출력의 하강과 상승 곡선, 50% 지점 사이의 t_PHL, t_PLH 표시\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>$R_n=R_p$이면 두 시간이 같아야 해요. 실제로 다른 것은 저항이 같지 않다는 뜻이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>(2)에 전달 지연의 이유를 반복해서 쓰는 거예요. (2)는 H→L과 L→H의 “차이”가 이유예요.\u003c/p>"}], "answer": "\u003cp>(1) capacitive load와 저항 때문에 충·방전에 시간이 걸려서예요. (2) H→L은 $R_n$으로 방전, L→H는 $R_p$로 충전하고 두 저항이 달라 시간 상수가 다르기 때문이에요.\u003c/p>"}}, {"id": "q-transition", "kind": "예상문제", "number": "13", "title": "천이 시간이 H→L과 L→H에서 다른 이유", "section": "실험 2 · 정답 미확정", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>CMOS에서 천이시간(Transition time)이 H->L일 때와, L->H일 때 timing 특성이 달라지는 이유를 설명하여라.\u003c/p>", "conditions": "", "ask": "\u003cp>H→L과 L→H에서 timing 특성이 다른 이유를 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>출력이 내려갈 때와 올라갈 때 용량이 거쳐 가는 저항이 무엇인지 비교해 봐요.\u003c/p>"}], "solution": {"steps": [{"label": "두 방향의 길", "html": "\u003cp>출력이 H→L로 가면 부하 용량이 $R_n$을 통해 방전돼요. L→H로 가면 $R_p$를 통해 충전돼요.\u003c/p>"}, {"label": "시간 상수", "html": "\u003cp>$R_{n(on)}$과 $R_{p(on)}$이 같지 않으면 시간 상수 $R\\cdot C_L$이 달라서 10%에서 90%까지 걸리는 시간이 달라요.\u003c/p>"}, {"label": "그림", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-transition-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"출력의 하강과 상승 곡선, 50% 지점 사이의 t_PHL, t_PLH 표시\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>두 저항이 같다고 놓으면 두 시간이 같아져요. 달라진다는 사실은 저항이 다르다는 뜻이에요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>입력 파형이 달라서라고 쓰는 거예요. 같은 입력 에지 기울기여도 출력 쪽 저항이 달라서 생기는 차이예요.\u003c/p>"}], "answer": "\u003cp>H→L은 $R_n$을 거쳐 방전, L→H는 $R_p$를 거쳐 충전하는데 두 저항이 같지 않아서 시간 상수가 다르기 때문이에요.\u003c/p>"}}, {"id": "q-speed", "kind": "예상문제", "number": "14", "title": "동작속도를 정하는 두 요소", "section": "실험 2 · 정답 미확정", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>COMS의 동작속도를 결정짓는 2가지 요소와 각 요소에 따른 동작속도에 미치는 영향을 timing diagram을 그려 설명하여라.\u003c/p>", "conditions": "", "ask": "\u003cp>두 요소와 각각의 영향을 timing diagram으로 설명하세요. (원문 표기 COMS를 그대로 옮겼어요.)\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>출력을 바꾸려면 무엇을 충전·방전해야 하고, 그 길에 무엇이 있는지 떠올려요.\u003c/p>"}], "solution": {"steps": [{"label": "두 요소", "html": "\u003cp>켜진 트랜지스터의 저항 $R$($R_p$ 또는 $R_n$)과 출력에 매달린 부하 용량 $C_L$이에요.\u003c/p>"}, {"label": "영향", "html": "\u003cp>출력은 시간 상수 $\\tau=R\\cdot C_L$로 서서히 변해요. 둘 중 하나라도 크면 $\\tau$가 커져서 천이 시간과 전달 지연이 길어지고 동작속도가 느려요. 둘 중 하나라도 작으면 빨라요.\u003c/p>"}, {"label": "timing diagram", "html": "\u003cp>\u003cimg src=\"figures/solutions/q-speed-solution-01.png\" width=\"520\" style=\"max-width:100%;height:auto\" alt=\"같은 입력에서 R과 C_L의 곱이 작으면 출력이 빨리 올라가고 크면 천천히 올라가는 비교\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>간단한 RC 모델에서 50% 지연은 $0.69\\,RC$, 10~90%는 약 $2.2\\,RC$예요. $R$이나 $C_L$이 두 배면 시간도 두 배예요.\u003c/p>"}, {"label": "흔한 실수", "html": "\u003cp>주파수나 전원 전압 같은 외부 조건만 쓰는 거예요. 문제는 회로 자체가 정하는 두 요소를 물었어요.\u003c/p>"}], "answer": "\u003cp>요소 두 가지는 켜진 저항 $R$과 부하 용량 $C_L$이에요. 곱 $R\\cdot C_L$이 클수록 출력이 천천히 변해 동작속도가 느려져요.\u003c/p>"}}]}</script>
<main id="book"></main>
<script>
'use strict';

// 생성기가 문자열 치환으로 바꾸는 자리표시자. 여기서 이어 붙여 두어 치환 대상이 되지 않게 한다.
const PLACEHOLDER = '__WORKBOOK' + '_DATA__';
const KIND_SLUG = { '예제': 'example', '연습문제': 'exercise', '장말문제': 'problem', '기출': 'exam' };
const KIND_SHORT = { '예제': '예제', '연습문제': '연습', '장말문제': '문제', '기출': '문항' };   // Hint 쪽 항목 번호 앞 (번호가 종류끼리 겹침)
const FIG_SCALE_CAP = 1.5;        // 교재 인쇄 크기 대비 확대 상한
const MATH_MIN_SCALE = 0.7;
const STRIP_MATH_MIN_SCALE = 0.5;  // Hint 띠 속 식은 띠 폭에 맞춰 더 줄일 수 있음
// 쪽 맞춤 순서: 폭 → 글자. 앞 단계 값은 유지한 채 다음 단계로 간다.
const FIT_STEPS = [
  ['--pw', '40%'], ['--pw', '50%'],
  ['--fs', '0.9'], ['--fs', '0.8'],
];
// 풀이 칸 맞춤 순서: 글자 → 위 회로도 높이 → 2단
const SOL_FIT_STEPS = [['sfs', '0.9'], ['sfs', '0.8'], ['fig', '0.30'], ['fig', '0.22'], ['cols', '2']];
const PAGE_W_PX = 297 * 96 / 25.4;

const book = document.getElementById('book');

/* ---------- 작은 도우미 ---------- */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function txt(tag, cls, text) {
  const e = el(tag, cls);
  e.textContent = text;
  return e;
}
const kindSlug = kind => KIND_SLUG[kind] || 'problem';

async function loadData() {
  const q = new URLSearchParams(location.search).get('data');
  const raw = document.getElementById('workbook-data').textContent.trim();
  const url = q || (raw === PLACEHOLDER ? 'sample.json' : null);
  if (!url) return JSON.parse(raw);
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  renderMathInElement(root, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
    ],
    throwOnError: false,
    fleqn: true,
  });
}

/* ---------- 등식 줄바꿈 ---------- */
// 긴 등식(=, ≈ 등이 있고 EQ_SPLIT_LEN자보다 긴 식)만 한 줄을 따로 차지하는 display 식으로 바꾸고,
// 관계 기호마다 줄을 바꿔 세로로 맞춘다. 짧은 식은 문장 속에 그대로 둔다.
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
const REL_RE = /^(?:=|\\(?:approx|Rightarrow|leq?|geq?)(?![a-zA-Z]))/;
const EQ_SPLIT_LEN = 40;

// 중괄호·\left…\right 바깥의 관계 기호에서 나눈다: [lhs, [rel, rhs], …]
function splitRelations(tex) {
  const parts = [];
  let depth = 0, start = 0, rel = null;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (depth === 0) {
      const m = (c === '=' || c === '\\') && REL_RE.exec(tex.slice(i));
      if (m) {
        parts.push(rel ? [rel, tex.slice(start, i).trim()] : tex.slice(start, i).trim());
        rel = m[0]; i += m[0].length - 1; start = i + 1;
        continue;
      }
    }
    if (c === '{') depth++;
    else if (c === '}') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    }
  }
  if (!rel) return null;
  parts.push([rel, tex.slice(start).trim()]);
  return parts;
}

function equationTex(tex, parts, prefix) {
  const [lhs, ...rest] = parts;
  if (!lhs) return prefix + tex;
  const lines = rest.map(([rel, rhs], i) => `${i ? '' : prefix + lhs} &amp;${rel} ${rhs}`);
  return `\\begin{aligned}${lines.join(' \\\\ ')}\\end{aligned}`;
}

function breakEquations(html) {
  if (!html) return html;
  const toks = [];
  let last = 0;
  for (const m of html.matchAll(MATH_RE)) {
    toks.push({ text: html.slice(last, m.index) });
    const tex = (m[1] ?? m[2]).trim();
    const parts = tex.length > EQ_SPLIT_LEN ? splitRelations(tex) : null;
    toks.push({ tex, parts, display: !!m[1] || !!parts, prefix: '' });
    last = m.index + m[0].length;
  }
  if (!toks.length) return html;
  toks.push({ text: html.slice(last) });

  // 줄로 나뉜 식 사이에 남는 쉼표는 지우고, 식 사이의 → 는 다음 식 앞으로 옮긴다
  toks.forEach((t, k) => {
    if (t.text == null) return;
    const prev = toks[k - 1], next = toks[k + 1];
    const pd = prev && prev.display, nd = next && next.display;
    if (pd && nd && /^\s*(→|⇒)\s*$/.test(t.text)) { t.text = ''; next.prefix = '\\Rightarrow\\ '; return; }
    if (pd) t.text = t.text.replace(/^\s*[,，]\s*/, '');
    if (nd) t.text = t.text.replace(/\s*[,，]\s*$/, ' ');
    if (pd && nd && !t.text.trim()) t.text = '';
  });

  return toks.map(t => {
    if (t.text != null) return t.text;
    if (!t.display) return `$${t.tex}$`;
    return `$$${t.parts ? equationTex(t.tex, t.parts, t.prefix) : t.prefix + t.tex}$$`;
  }).join('');
}

// display 식이 칸보다 넓으면 그 식만 줄인다 (최소 70%)
function fitDisplayMath(root) {
  for (const d of root.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    k.style.transform = '';
    const avail = d.clientWidth, need = k.scrollWidth;
    if (need > avail + 1) {
      k.style.transformOrigin = 'left center';
      k.style.transform = `scale(${Math.max(MATH_MIN_SCALE, avail / need)})`;
    }
  }
}

function nextLayout() {
  void book.offsetHeight;          // 레이아웃을 돌려 새 글꼴(KaTeX 등) 로드를 시작시킴
  return document.fonts.ready;
}

/* ---------- 쪽 틀과 헤더 (공용) ---------- */
function makePage(kind, cls) {
  const page = el('section', `page ${cls}`);
  page.dataset.kind = kind;
  const head = el('header', 'page-head');
  const body = el('div', 'page-body');
  page.append(head, body);
  return { page, head, body };
}

function problemHead(p, n, total) {
  const frag = document.createDocumentFragment();
  const lead = el('div', 'head-lead');
  lead.append(txt('span', 'kind-badge', p.kind), txt('span', 'head-num', p.number));
  if (p.difficulty > 0) lead.append(txt('span', 'head-stars', '★'.repeat(p.difficulty)));
  if (p.sol) lead.append(txt('span', 'sol-tag', 'SOL'));
  lead.append(txt('span', 'ans-tag', '답안'));

  const h2 = el('h2', 'page-title');
  h2.append(txt('span', 'sr', `${p.kind} ${p.number} — `), document.createTextNode(p.title));

  const meta = el('div', 'head-meta');
  const info = [p.section, p.book_page != null ? `p.${p.book_page}` : '', `${n} / ${total}`];
  meta.append(txt('span', 'head-info', info.filter(Boolean).join(' · ')));

  frag.append(lead, h2, meta);
  return frag;
}

/* ---------- 문제 쪽 ---------- */
function figureImg(f) {
  const img = el('img', 'fig');
  img.src = f.src;
  img.alt = '';
  img.width = Math.round(f.w_mm * 10);
  img.height = Math.round(f.h_mm * 10);
  img.style.setProperty('--w-cap', `${f.w_mm * FIG_SCALE_CAP}mm`);
  img.style.setProperty('--ratio', f.w_mm / f.h_mm);
  return img;
}

function block(label, html, cls, lang) {
  const b = el('section', 'block');
  const body = el('div', `prose ${cls}`, breakEquations(html));
  if (lang) body.lang = lang;
  b.append(txt('div', 'block-label', label), body);
  return b;
}

function hintStrip(p) {
  const a = el('a', 'hint-strip');
  a.href = `#hint-${p.id}`;
  a.append(txt('div', 'hint-strip-label', 'Hint'));
  const ol = el('ol', 'hint-strip-list');
  p.hints.forEach((h, i) => {
    const li = el('li', 'hint-strip-item');
    li.dataset.n = i + 1;
    if (h.formula) li.append(stripFormula(h.formula));
    else li.append(el('span', 'hint-strip-text', h.label));   // 이름표 속 KaTeX가 grid 칸으로 흩어지지 않게
    ol.append(li);
  });
  a.append(ol);
  return a;
}

// 'formula'(구분자 없는 LaTeX)가 있으면 띠에는 이름표 대신 식을 보인다
function stripFormula(tex) {
  const span = el('span', 'hint-strip-formula');
  if (typeof katex !== 'undefined') katex.render(tex, span, { throwOnError: false });
  else span.textContent = tex;
  return span;
}

function fitStripFormulas(page) {
  for (const f of page.querySelectorAll('.hint-strip-formula')) {
    f.style.transform = '';
    const avail = f.clientWidth, need = f.scrollWidth;
    if (need > avail + 1) f.style.transform = `scale(${Math.max(STRIP_MATH_MIN_SCALE, avail / need)})`;
  }
}

// 가운데 칸: 풀이 단계와 답. solution이 없으면 빈 점 격자
function solutionArea(p) {
  const work = el('div', 'work');
  const s = p.solution;
  if (!s) return work;
  const flow = el('div', 'sol-flow');
  const ol = el('ol', 'sol-steps');
  (s.steps || []).forEach((st, i) => {
    const li = el('li', 'sol-step');
    li.dataset.n = i + 1;
    if (st.label) li.append(el('div', 'sol-step-label', st.label));
    li.append(el('div', 'prose sol-step-body', breakEquations(st.html)));
    ol.append(li);
  });
  flow.append(ol);
  work.append(flow);
  if (s.answer) {
    const a = block('답', s.answer, 'ask-box');
    a.classList.add('sol-answer');
    work.append(a);
  }
  return work;
}

function problemPage(p, n, total) {
  const { page, head, body } = makePage(kindSlug(p.kind), 'page--problem');
  page.id = p.id;
  head.append(problemHead(p, n, total));

  const row = el('div', 'page-row');
  const panel = el('div', 'panel');
  if (p.html.original) panel.append(block('문제 원문', p.html.original, 'original', p.original_lang || 'en'));   // 원문은 맨 처음
  if (p.html.conditions && p.html.conditions.trim()) panel.append(block('조건', p.html.conditions, 'conditions'));   // 조건이 없으면 라벨도 없다
  panel.append(block('구할 것', p.html.ask, 'ask-box'));
  const center = el('div', 'page-center');
  const figs = p.figures || [];
  if (figs.length) {
    const band = el('div', 'fig-band');
    figs.forEach(f => band.append(figureImg(f)));
    center.append(band);
  }
  center.append(solutionArea(p));
  row.append(panel, center);
  if (p.hints && p.hints.length) {
    row.classList.add('has-strip');
    if (p.hints.some(h => h.formula)) row.classList.add('has-formula');
    row.append(hintStrip(p));
  }
  body.append(row);
  return page;
}

// 6.5 쪽 맞춤. 들어가면 멈추고, 끝까지 넘치면 false.
function fitProblemPage(page) {
  const panel = page.querySelector('.panel');
  const fits = () => panel.scrollHeight <= panel.clientHeight + 1;
  const state = { pw: '33%', fs: '1' };
  for (const [prop, val] of FIT_STEPS) {
    if (fits()) break;
    panel.style.setProperty(prop, val);
    state[{ '--pw': 'pw', '--fs': 'fs' }[prop]] = val;
  }
  page.dataset.fit = `pw=${state.pw} fs=${state.fs}`;
  fitDisplayMath(panel);
  fitStripFormulas(page);
  const ok = fits();
  if (!ok) page.dataset.overflow = '';
  return ok;
}

// 풀이 칸 맞춤. 마지막 단계가 칸 아래나 오른쪽(넘친 단)으로 나가면 넘침.
function fitSolution(page) {
  const work = page.querySelector('.work');
  const flow = work.querySelector('.sol-flow');
  const last = flow && flow.querySelector('.sol-step:last-child');
  if (!last) return true;
  const fits = () => {
    fitDisplayMath(flow);
    const f = flow.getBoundingClientRect(), l = last.getBoundingClientRect();
    return l.bottom <= f.bottom + 1 && l.right <= f.right + 1;
  };
  const band = page.querySelector('.fig-band');
  const state = { sfs: '1', fig: '0.40', cols: '1' };
  for (const [key, val] of SOL_FIT_STEPS) {
    if (fits()) break;
    if (key === 'fig') {
      if (!band) continue;
      band.style.setProperty('--fig-frac', val);
    }
    else if (key === 'cols') flow.classList.add('is-2col');
    else work.style.setProperty(`--${key}`, val);
    state[key] = val;
  }
  const ok = fits();
  fitDisplayMath(work.querySelector('.sol-answer') || work);
  page.dataset.fit += ` sfs=${state.sfs} fig=${state.fig} cols=${state.cols}`;
  if (!ok) page.dataset.overflow = '';
  return ok;
}

/* ---------- Hint 쪽 ---------- */
function hintItem(h, i) {
  const li = el('li', 'hint-item');
  li.dataset.n = i + 1;
  li.append(el('div', 'hint-item-label', h.label), el('div', 'prose hint-item-body', breakEquations(h.html)));
  return li;
}

function hintPage(title, first) {
  const { page, head, body } = makePage('hint', 'page--hint');
  // 이어지는 Hint 쪽은 책갈피가 겹치지 않게 제목을 h2가 아닌 div로 둔다
  head.append(txt('span', 'kind-badge', 'Hint'), txt(first ? 'h2' : 'div', 'page-title', `Hint — ${title}`));
  const cols = el('div', 'hint-cols');
  body.append(cols);
  book.append(page);
  return cols;
}

function hintEntry(p, withId) {
  const root = el('article', 'hint-entry');
  if (withId) root.id = `hint-${p.id}`;
  const num = txt('a', 'hint-entry-num', `${KIND_SHORT[p.kind] || ''} ${p.number}`.trim());
  num.href = `#${p.id}`;
  const list = el('ol', 'hint-items');
  root.append(num, list);
  return { root, list };
}

// 6.6 항목을 하나씩 넣고, 단이 넘치면 새 Hint 쪽에 같은 문제 칸을 열어 잇는다.
function flowHints(meta, problems, staged) {
  const overflow = [];
  const list = problems.filter(p => p.hints && p.hints.length);
  if (!list.length) return overflow;

  let cols = hintPage(meta.title, true);
  const over = () => cols.scrollWidth > cols.clientWidth + 1;

  for (const p of list) {
    let idPlaced = false;
    let entry = hintEntry(p, true);
    cols.append(entry.root);
    for (const li of staged.get(p.id)) {
      entry.list.append(li);
      fitDisplayMath(li);
      if (!over()) continue;

      li.remove();
      if (entry.list.children.length) idPlaced = true;
      else entry.root.remove();
      cols = hintPage(meta.title, false);
      entry = hintEntry(p, !idPlaced);
      cols.append(entry.root);
      entry.list.append(li);
      fitDisplayMath(li);
      if (over()) {                 // 빈 쪽에도 안 들어가는 항목
        cols.closest('.page').dataset.overflow = '';
        overflow.push(`hint-${p.id}`);
      }
    }
  }
  return overflow;
}

/* ---------- 화면 배율 ---------- */
function applyZoom(z) {
  for (const page of book.querySelectorAll(':scope > .page')) page.style.zoom = z;
}
const screenZoom = () => applyZoom(Math.min(1, (innerWidth - 32) / PAGE_W_PX));

/* ---------- 실행 (6.9) ---------- */
async function main() {
  try {
    const data = await loadData();
    const { meta, problems } = data;
    document.title = meta.title;

    // DOM 생성
    const total = meta.total || problems.length;
    problems.forEach((p, i) => book.append(problemPage(p, i + 1, total)));
    const staging = el('div', 'staging');
    staging.setAttribute('aria-hidden', 'true');
    const staged = new Map();
    for (const p of problems) {
      const items = (p.hints || []).map(hintItem);
      staged.set(p.id, items);
      staging.append(...items);
    }
    document.body.append(staging);

    // 글꼴 + 그림 → KaTeX (수식 글꼴도 다 받은 뒤 잰다)
    await Promise.all([nextLayout(), ...[...document.images].map(img => img.complete ? null : new Promise(done => {
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
    }))]);
    renderMath(book);
    renderMath(staging);
    await nextLayout();

    const overflow = [];
    for (const page of book.querySelectorAll('.page--problem')) {
      const panelOk = fitProblemPage(page);
      const solOk = fitSolution(page);
      if (!panelOk || !solOk) overflow.push(page.id);
    }
    overflow.push(...flowHints(meta, problems, staged));
    staging.remove();

    document.body.dataset.overflow = overflow.join(',');
    document.documentElement.dataset.ready = 'true';
  } catch (err) {
    console.error(err);
    book.append(txt('p', 'load-error', `문제 데이터를 읽지 못했습니다: ${err.message}`));
    document.body.dataset.overflow = '';
    document.documentElement.dataset.ready = 'error';
    return;
  }

  // 배율은 맞춤과 Hint 쪽 나누기가 끝난 뒤에만
  screenZoom();
  addEventListener('resize', screenZoom);
  addEventListener('beforeprint', () => applyZoom(''));
  addEventListener('afterprint', screenZoom);
}

addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>
