<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img"><title>일반 인버터는 문턱 하나, Schmitt-trigger 인버터는 상승 V_T+ 와 하강 V_T− 두 문턱의 히스테리시스 곡선을 가져요</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}</style><rect width="940" height="440" rx="14" fill="#fff"/><polyline points="70.0,340.0 410.0,340.0" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="410.0,340.0 392.4,347.7 392.4,332.3" fill="#18212e"/><polyline points="70.0,340.0 70.0,70.0" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="70.0,70.0 77.7,87.6 62.3,87.6" fill="#18212e"/><text x="410" y="374" text-anchor="end" font-size="22" fill="#18212e">V<tspan dy="7" font-size="18">IN</tspan></text><text x="82" y="72" text-anchor="start" font-size="22" fill="#18212e">V<tspan dy="7" font-size="18">O</tspan></text><text x="240" y="36" text-anchor="middle" font-size="22" fill="#18212e" font-weight="700">일반 인버터</text><text x="60" y="106" text-anchor="end" font-size="20" fill="#18212e">V<tspan dy="7" font-size="18">CC</tspan></text><text x="60" y="346" text-anchor="end" font-size="20" fill="#18212e">GND</text><line x1="70" y1="100" x2="400" y2="100" stroke="#7a8594" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/><polyline points="540.0,340.0 880.0,340.0" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="880.0,340.0 862.4,347.7 862.4,332.3" fill="#18212e"/><polyline points="540.0,340.0 540.0,70.0" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="540.0,70.0 547.7,87.6 532.3,87.6" fill="#18212e"/><text x="880" y="374" text-anchor="end" font-size="22" fill="#18212e">V<tspan dy="7" font-size="18">IN</tspan></text><text x="552" y="72" text-anchor="start" font-size="22" fill="#18212e">V<tspan dy="7" font-size="18">O</tspan></text><text x="710" y="3