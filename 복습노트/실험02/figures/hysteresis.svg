" font-size="18">T+</tspan></text><polyline points="686.0,220.0 764.0,220.0" fill="none" stroke="#1e7f4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="764.0,220.0 746.4,227.7 746.4,212.3" fill="#1e7f4f"/><polyline points="764.0,220.0 686.0,220.0" fill="none" stroke="#1e7f4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="686.0,220.0 703.6,212.3 703.6,227.7" fill="#1e7f4f"/><text x="725.0" y="212" text-anchor="middle" font-size="22" fill="#1e7f4f" font-weight="700">V<tspan dy="7" font-size="18">H</tspan></text><text x="870" y="140" text-anchor="end" font-size="20" fill="#1e7f4f">V<tspan dy="7" font-size="18">H</tspan><tspan dy="-7"> = V</tspan><tspan dy="7" font-size="18">T+</tspan><tspan dy="-7"> − V</tspan><tspan dy="7" font-size="18">T−</tspan></text></svg>