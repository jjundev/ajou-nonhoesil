<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img"><title>실험 2 그림 읽기: Vin 이 U1 의 인버터 여섯 개를 차례로 지나 U2 의 1A 로 가요. CH1 은 4번 핀, CH2 는 8번 핀이에요</title><style>text{font-family:Arial,"Malgun Gothic",sans-serif}</style><rect width="1000" height="360" rx="14" fill="#fff"/><text x="24" y="108" text-anchor="start" font-size="22" fill="#18212e" font-weight="700">V<tspan dy="7" font-size="18">IN</tspan></text><line x1="24" y1="150" x2="60" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><polygon points="70,120.0 70,180.0 146,150" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="153" cy="150" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><line x1="30" y1="150" x2="70" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><text x="76" y="100" text-anchor="start" font-size="20" fill="#7a8594">1A→1Y</text><text x="74" y="196" text-anchor="start" font-size="18" fill="#7a8594">핀 1→2</text><polygon points="205,120.0 205,180.0 281,150" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="288" cy="150" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><line x1="160" y1="150" x2="205" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><text x="211" y="100" text-anchor="start" font-size="20" fill="#7a8594">2A→2Y</text><text x="209" y="196" text-anchor="start" font-size="18" fill="#7a8594">핀 3→4</text><polygon points="340,120.0 340,180.0 416,150" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="423" cy="150" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><line x1="295" y1="150" x2="340" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><text x="346" y="100" text-anchor="start" font-size="20" fill="#7a8594">3A→3Y</text><text x="344" y="196" text-anchor="start" font-size="18" fill="#7a8594">핀 5→6</text><polygon points="475,120.0 475,180.0 551,150" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="558" cy="150" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><line x1="430" y1="150" x2="475" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><text x="481" y="100" text-anchor="start" font-size="20" fill="#7a8594">6A→6Y</text><text x="479" y="196" text-anchor="start" font-size="18" fill="#7a8594">핀 13→12</text><polygon points="610,120.0 610,180.0 686,150" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="693" cy="150" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><line x1="565" y1="150" x2="610" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><text x="616" y="100" text-anchor="start" font-size="20" fill="#7a8594">5A→5Y</text><text x="614" y="196" text-anchor="start" font-size="18" fill="#7a8594">핀 11→10</text><polygon points="745,120.0 745,180.0 821,150" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="828" cy="150" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><line x1="700" y1="150" x2="745" y2="150" stroke="#18212e" stroke-width="3" stroke-linecap="round"/><text x="751" y="100" text-anchor="start" font-size="20" fill="#7a8594">4A→4Y</text><text x="749" y="196" text-anchor="start" font-size="18" fill="#7a8594">핀 9→8</text><polyline points="835.0,150.0 905.0,150.0" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="905.0,150.0 887.4,157.7 887.4,142.3" fill="#18212e"/><text x="911" y="156" text-anchor="start" font-size="20" fill="#18212e" font-weight="700">U2 1A</text><line x1="305" y1="150" x2="305" y2="270" stroke="#2674df" stroke-width="3" stroke-linecap="round"/><circle cx="305" cy="150" r="5" fill="#2674df"/><rect x="257" y="270" width="96" height="40" rx="6" fill="#e8f1ff" stroke="#2674df" stroke-width="2"/><text x="305" y="298" text-anchor="middle" font-size="22" fill="#2674df" font-weight="700">CH1</text><line x1="845" y1="150" x2="845" y2="2