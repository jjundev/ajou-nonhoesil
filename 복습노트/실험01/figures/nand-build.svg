<svg xmlns="http://www.w3.org/2000/svg" width="135.0mm" height="114.0mm" viewBox="0 0 900 760" role="img"><title>NAND 하나로 NOT, AND, OR를 만드는 방법</title><desc>NAND 입력을 묶으면 NOT, NAND 뒤에 NOT을 붙이면 AND, 입력마다 NOT을 앞에 붙이면 OR</desc><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#222}.wire{fill:none;stroke:#222;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.gate{fill:#fff;stroke:#222;stroke-width:3;stroke-linejoin:round}</style><rect width="900" height="760" fill="white"/><text x="30" y="50" font-size="22" text-anchor="start" font-family="Arial, sans-serif" fill="#222" font-weight="700">NOT: 입력 둘을 묶어요</text>
