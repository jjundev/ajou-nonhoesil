<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img">
<title>1×4 DMUX: 각 주소의 AND 경로로 데이터를 보내요</title>
<style>text{font-family:Arial,"Malgun Gothic",sans-serif;font-size:24px;fill:#18212e} .wire{fill:none;stroke:#18212e;stroke-width:3;stroke-linejoin:round;stroke-linecap:round} .gate{fill:#fff;stroke:#18212e;stroke-width:3} .accent{fill:#e8f1ff;stroke:#2674df;stroke-width:3}</style>
<rect width="640" height="560" rx="16" fill="#fff"/>
<text x="24" y="38" text-anchor="start">1×4 DMUX · 출력을 합치지 않아요</text>
<text x="24" y="94" text-anchor="start">D</text>
<text x="24" y="127" text-anchor="start">S1′ S0′</text>
<polyline class="wire" points="160,82 225,82"/>
<polyline class="wire" points="160,105 225,105"/>
<polyline class="wire" points="160,128 225,128"/>
<path class="gate" d="M225,70 h40 a35,35 0 0 1 0,70 h-40 z"/>
<text x="255" y="113" text-anchor="middle">&amp;</text>
<polyline class="wire" points="300,105 475,105"/>
<text x="490" y="113" text-anchor="start">Y0</text>
<text x="24" y="189" text-anchor="start">D</text>
<text x="24" y="222" text-anchor="start">S1′ S0</text>
<polyline class="wire" points="160,177 225,177"/>
<polyline class="wire" points="160,200 225,200"/>
<polyline class="wire" points="160,223 225,223"/>
<path class="gate" d="M225,165 h40 a35,35 0 0 1 0,70 h-40 z"/>
<text x="255" y="208" text-anchor="middle">&amp;</text>
<polyline class="wire" points="300,200 475,200"/>
<text x="490" y="208" text-anchor="start">Y1</text>
<text x="24" y="284" text-anchor="start">D</text>
<text x="24" y="317" text-anchor="start">S1 S0′</text>
<polyline class="wire" points="160,272 225,272"/>
<polyline class="wire" points="160,295 225,295"/>
<polyline class="wire" points="160,318 225,318"/>
<path class="gate" d="M225,260 h40 a35,35 0 0 1 0,70 h-40 z"/>
<text x="255" y="303" text-anchor="middle">&amp;</text>
<polyline class="wire" points="300,295 475,295"/>
<text x="490" y="303" text-anchor="start">Y2</text>
<text x="24" y="379" text-anchor="start">D</text>
<text x="24" y="412" text-anchor="start">S1 S0</text>
<polyline class="wire" points="160,367 225,367"/>
<polyline class="wire" points="160,390 225,390"/>
<polyline class="wire" points="160,413 225,413"/>
<path class="gate" d="M225,355 h40 a35,35 0 0 1 0,70 h-40 z"/>
<text x="255" y="398" text-anchor="middle">&amp;</text>
<polyline class="wire" points="300,390 475,390"/>
<text x="490" y="398" text-anchor="start">Y3</text>
<text x="24" y="470" text-anchor="start">S1과 S0를 NOT에 넣어 보수를 만들어요.</text>
<text x="24" y="510" text-anchor="start">D=1, S1S0=10 → Y2=1, 나머지=0</text>
<text x="24" y="546" text-anchor="start">D=0 → Y0=Y1=Y2=Y3=0</text>
</svg>