<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>답안지</title>
<link rel="stylesheet" href="../.vendor/pretendard/pretendard.css">
<link rel="stylesheet" href="../.vendor/katex/katex.min.css">
<script defer src="../.vendor/katex/katex.min.js"></script>
<script defer src="../.vendor/katex/auto-render.min.js"></script>
<style>
/* ==========================================================================
   답안지 템플릿 (문제 + 풀이 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 문제 데이터는 문제집과 같고, 문제마다
   solution {steps: [{label, html}], answer} 를 더한다. 1–3절은 문제집 템플릿과 같다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 10pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 6.5pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 15pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 9pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.ans-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--kind);
  border: .25mm solid var(--kind); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 10pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 7.5pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 40mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문: 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 (문제지와 같음) */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* 풀이 칸 (답안지): 점 격자 위에 번호 단계, 맨 아래 답. 맞춤: 글자 0.9 → 0.8 → 2단 */
.work {
  --sfs: 1;
  --sol-step-gap: 10mm;          /* 풀이 단계 사이 상하 여백 */
  display: flex; flex-direction: column; gap: 3mm; overflow: hidden;
  padding: 1mm 2mm 0 1mm;
  font-size: calc(var(--fs-body) * var(--sfs));
}
.sol-flow { flex: 1; min-height: 0; overflow: hidden; padding-top: 2.5mm; column-gap: 8mm; column-fill: auto; }
.sol-flow.is-2col { column-count: 2; }
.sol-steps { list-style: none; margin: 0; padding: 0; }
.sol-step {
  display: grid; grid-template-columns: 5mm minmax(0, 1fr); column-gap: 2mm;
  break-inside: avoid;
}
.sol-step + .sol-step { margin-top: var(--sol-step-gap); }
.sol-step::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: start;
  width: 5mm; height: 5mm; border-radius: 50%;
  background: var(--kind); color: var(--paper);
  font-size: 7pt; font-weight: 700; line-height: 5mm; text-align: center;
}
.sol-step-label {
  grid-column: 2; grid-row: 1; align-self: center;
  font-size: .9em; font-weight: 700; line-height: 1.3;
}
.sol-step-body { grid-column: 2; margin-top: 2.5mm; }
.sol-step-body:first-child { grid-row: 1; margin-top: 0; }
.sol-step-body .katex-display { overflow-x: clip; }
.sol-answer { flex: none; }

/* Hint 띠: 전체가 Hint 쪽 링크 */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 9pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 7.5pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 표: 격자선, 머리행 강조. 원문 표의 빈 칸은 태블릿 펜으로 쓸 높이(7mm)를 갖는다 */
#book table { border-collapse: collapse; width: 100%; margin: 1mm 0; }
#book th, #book td {
  border: .3mm solid var(--ink); padding: 1.2mm 1.2mm; text-align: center;
  overflow-wrap: break-word; word-break: keep-all; line-height: 1.3;
}
#book th { font-weight: 700; background: var(--paper); }
#book .original td { height: 7mm; }
/* 채울 표(work-table)는 풀이 칸 맨 위(.work-block)로 옮겨진다. 풀이 공간은 최소 25mm를 남긴다 */
#book .work-block { flex: none; }
#book .work-block .table-wrap { margin: 0; }
#book .work-block table { table-layout: fixed; margin: 0; }
#book .work-block td { height: 7mm; }
.page-center > .work-block ~ .work { min-height: 25mm; }

/* 퀴즈 작도: 고정된 인쇄 크기, 넘치면 검사 실패 */
#book .work-board-block { flex: none; }
#book .work-board img { display: block; width: 100mm; min-width: 90mm; height: auto; margin: 0 auto; }
.page-center > .work-board-block ~ .work { min-height: 25mm; }
/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 9.5pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 9pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.5pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 8.5pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}
</style>
</head>

<script type="application/json" id="workbook-data">{"meta": {"mode": "answers", "title": "실험 8 · 기출풀이와 퀴즈 유형 연습", "chapter": 0, "total": 24, "quiz_practice_version": 1}, "problems": [{"id": "q-jk-toggle", "kind": "출처 미확인", "number": "1", "title": "JK F/F를 Toggle로 쓰는 네 핀 값", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>JK F/F의 Clock이 Falling Edge일 때 출력(Q)이 Toggle로 동작하기 위한 PR, CLR, J, K핀의 입력값을 적으시오.\u003c/p>", "conditions": "", "ask": "\u003cp>PR, CLR, J, K 네 핀의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>강제 버튼이 쉬는 값부터 정하고, JK 표에서 반전 줄을 찾아요.\u003c/p>"}], "solution": {"steps": [{"label": "강제 버튼", "html": "\u003cp>PR=0이면 Q가 1로, CLR=0이면 Q가 0으로 고정돼요. 그러면 클럭이 와도 뒤집히지 않아요. 그래서 둘 다 1로 둬요.\u003c/p>"}, {"label": "JK 줄 고르기", "html": "\u003cp>J=K=0은 유지, J만 1은 Set, K만 1은 Reset이에요. 반전은 J=K=1 한 줄뿐이에요.\u003c/p>"}, {"label": "정리", "html": "\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>핀\u003c/th>\u003cth>값\u003c/th>\u003cth>이유\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PR\u003c/td>\u003ctd>1\u003c/td>\u003ctd>강제 Set 쉼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CLR\u003c/td>\u003ctd>1\u003c/td>\u003ctd>강제 Reset 쉼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>J\u003c/td>\u003ctd>1\u003c/td>\u003ctd>J=K=1이어야 반전\u003c/td>\u003c/tr>\u003ctr>\u003ctd>K\u003c/td>\u003ctd>1\u003c/td>\u003ctd>J=K=1이어야 반전\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "검산", "html": "\u003cp>Q이전=0이면 J·Q′+K′·Q = 1·1+0·0 = 1, Q이전=1이면 1·0+0·1 = 0이에요. 두 경우 모두 반전이에요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>J, K만 적고 PR, CLR을 빠뜨리면 조건이 모자라요. 또 74HC76의 PR·CLR은 L일 때 눌리므로 “쉬는 값”이 0이라고 적으면 틀려요.\u003c/p>"}], "answer": "\u003cp>PR=1, CLR=1, J=1, K=1 (네 핀 모두 High)\u003c/p>"}}, {"id": "q-jk-toggle-3pin", "kind": "출처 미확인", "number": "2", "title": "J, K, CLR로 Toggle 만들기", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>JK F/F의 출력 Q가 Toggle로 동작하기 위한 J, K, CLR핀의 입력값을 적으시오.\u003c/p>", "conditions": "", "ask": "\u003cp>J, K, CLR 세 핀의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>앞 문제와 같은 질문이에요. 물어보지 않은 핀도 조건으로 살펴요.\u003c/p>"}], "solution": {"steps": [{"label": "값 고르기", "html": "\u003cp>J=K=1이 반전 줄이고, CLR은 쉬게 1로 둬요. 물어본 순서대로 적으면 1, 1, 1이에요.\u003c/p>"}, {"label": "전제 밝히기", "html": "\u003cp>클럭이 하강 엣지로 들어오고 PR=1일 때 성립해요. 원문은 엣지 방향과 PR을 적지 않았어요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>CLR=0이면 Q=0으로 고정이라 반전이 안 돼요. 그래서 CLR=1이 꼭 필요해요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>세 값을 1, 1, 1로 적고 끝내도 답은 맞아요. 다만 PR=0이면 성립하지 않는다는 점을 알아 두어요.\u003c/p>"}], "answer": "\u003cp>J=1, K=1, CLR=1 (PR도 1이어야 해요)\u003c/p>"}}, {"id": "q-async-char", "kind": "기출", "number": "3", "title": "비동기식 카운터의 특징", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>비동기식 카운터의 특징을 간략하게 적으시오.\u003c/p>", "conditions": "", "ask": "\u003cp>비동기식의 특징\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>클럭이 어디로 들어가는지, 그 결과 언제 바뀌는지 두 가지를 써요.\u003c/p>"}], "solution": {"steps": [{"label": "연결", "html": "\u003cp>외부 클럭은 첫 F/F에만 들어가요. 둘째 F/F부터는 앞 F/F의 출력을 클럭으로 받아요.\u003c/p>"}, {"label": "결과", "html": "\u003cp>그래서 F/F들이 동시에 바뀌지 않고 앞에서부터 차례로 바뀌어요. 지연이 단마다 쌓여서 뒤 단일수록 늦어요.\u003c/p>"}, {"label": "보충", "html": "\u003cp>회로가 단순한 대신 11→00처럼 여러 비트가 바뀔 때 01 같은 가짜 상태를 잠깐 지나요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>2단 2진에서 11→00을 따라가 봐요. A가 먼저 0이 되어 01이 되고, 그 뒤 B가 0이 되어 00이 돼요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>“앞의 결과에 영향을 받는다”만 쓰면 동기 카운터의 되먹임도 해당돼요. 클럭이 앞 단 출력에서 온다는 점을 꼭 써요.\u003c/p>"}], "answer": "\u003cp>첫 F/F만 외부 클럭을 받고 다음 F/F는 앞 F/F의 출력을 클럭으로 받아요. 그래서 F/F가 동시에 바뀌지 않고 차례로 바뀌며 전달 지연이 단마다 쌓여요.\u003c/p>"}}, {"id": "q-xbit-ymod", "kind": "기출", "number": "4", "title": "T F/F 3단 블록도의 동작", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래의 카운터가 어떻게 동작하는지 간략하게 적으시오. (X단 Y진 카운터, 출력값의 변화순서와 범위)\u003c/p>", "conditions": "\u003cp>원문에는 블록 C 안의 출력 라벨도 B, B′로 인쇄돼 있어요. 위로 뽑힌 선의 이름은 C예요.\u003c/p>", "ask": "\u003cp>X, Y, 출력값의 변화 순서와 범위\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/xbit-given.png", "w_mm": 120, "h_mm": 47.44186046511628}], "hints": [{"label": "접근 순서", "html": "\u003cp>CLK가 어느 블록에만 들어가는지 보고 단 수를 세요.\u003c/p>"}], "solution": {"steps": [{"label": "이름", "html": "\u003cp>T 블록이 3개이니 3단이고, 각 단이 2진이에요. 그래서 3단 2진 카운터, 전체 상태는 8개예요.\u003c/p>"}, {"label": "변화 순서", "html": "\u003cp>Reset 뒤 CBA=000이에요. 하강 엣지 기준이면 A는 CLK마다, B는 A가 떨어질 때, C는 B가 떨어질 때 뒤집혀요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>CLK 하강\u003c/th>\u003cth>C B A\u003c/th>\u003cth>값\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>시작\u003c/td>\u003ctd>000\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>001\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>010\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>011\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>100\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>101\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>110\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>111\u003c/td>\u003ctd>7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>000\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "비동기", "html": "\u003cp>CLK에 의해 A가 먼저 바뀌고, 그 결과로 B, 다시 C가 바뀌어요. 그래서 비동기식이에요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>A는 CLK 1번마다, B는 2번마다, C는 4번마다 바뀌어 전체가 8번에 돌아와요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>“3단 3진”이나 “2진”으로만 쓰지 않아요. 단 수와 상태 수를 함께 써요. 원문 블록 C의 B, B′ 라벨은 인쇄 그대로이고 C 출력으로 읽어요. 상승 엣지로 동작하면 순서가 000→111→110…로 바뀌어요.\u003c/p>"}], "answer": "\u003cp>3단 2진 비동기 카운터예요. 상태는 8개(0~7)이고, Reset 뒤 CBA가 000→001→…→111→000으로 반복해요. A, B, C가 차례로 바뀌어요. (교안처럼 하강 엣지 기준)\u003c/p>"}}, {"id": "q-ripple-wave", "kind": "기출", "number": "5", "title": "74HC76 비동기 회로의 A·B 파형", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래의 카운터 회로를 보고 A,B핀의 출력파형을 Clock에 맞추어 그리시오 (4점)\u003c/p>", "conditions": "\u003cp>회로는 원문 사진을 다시 그린 그림이에요. 사진에서 일부 핀 번호가 흐려도 배선은 교안 실험 1 회로와 같아요.\u003c/p>\u003cdiv class=\"work-board\">\u003cimg src=\".pack/figures/questions/ripple-blank.png\" alt=\"A, B 파형 답란과 6주기 Clock\">\u003c/div>", "ask": "\u003cp>Clock에 맞춘 A, B 파형\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/ripple-given.png", "w_mm": 150, "h_mm": 75.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>CLK 입력 앞의 동그라미를 보고, 둘째 단 CLK가 어디서 오는지 찾아요.\u003c/p>"}], "solution": {"steps": [{"label": "A 그리기", "html": "\u003cp>세로선마다 A를 뒤집어요. 첫 하강에서 0→1이에요.\u003c/p>"}, {"label": "B 그리기", "html": "\u003cp>A가 1→0으로 떨어지는 세로선에서만 B를 뒤집어요. 2번, 4번, 6번 하강이에요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>CLK 하강\u003c/th>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>AB (A부터)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>시작(가정)\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>01\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "완성 파형", "html": "\u003cp>\u003cimg src=\".pack/figures/solutions/ripple-solution.png\" width=\"500\" style=\"max-width:100%;height:auto\" alt=\"Clock, A, B 완성 파형\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>A의 주기가 Clock의 2배, B의 주기가 Clock의 4배인지 봐요. 6번째 하강 뒤 AB=01로, 원문 답란 끝에서 B가 1인 것도 맞아요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>B를 Clock에 맞춰 뒤집으면 틀려요. 상승 엣지에서 바꿔도 틀려요. 원문 답란의 끝 막대는 눈금일 뿐이라 끝값으로 읽지 않아요. 시작값은 가정이에요.\u003c/p>"}], "answer": "\u003cp>A는 Clock 하강마다 반전(주기 2배), B는 A 하강마다 반전(주기 4배). 시작 AB=00 가정에서 하강마다 10→01→11→00→10→01이에요.\u003c/p>"}}, {"id": "q-ripple-mod", "kind": "출처 미확인", "number": "6", "title": "비동기 회로는 몇 진 카운터인가요", "section": "실험 8 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>위 문제의 회로는 몇진 카운터인지 적으시오.\u003c/p>", "conditions": "\u003cp>‘위 문제의 회로’는 Quiz 4번의 74HC76 회로예요. 이 문제지 5번 문항의 비동기 회로와 같아요. 첫 단 J(4)·K(16)·PR(2)·CL(3)과 둘째 단 J(9)·K(12)·PR(7)·CL(8)은 VCC, 첫 단 CLK(1)는 Clock Generator(+5V, 1Hz), 둘째 단 CLK(6)는 첫 단 Q(15, A)에 연결돼요.\u003c/p>", "ask": "\u003cp>몇 진 카운터인지\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>한 사이클에 서로 다른 AB가 몇 개 나오는지 세요.\u003c/p>"}], "solution": {"steps": [{"label": "상태 세기", "html": "\u003cp>앞 문제 추적표처럼 00→10→01→11→00으로 돌아요. 상태는 4개예요.\u003c/p>"}, {"label": "이름 맞추기", "html": "\u003cp>상태 수로 말하면 4진(mod-4)이에요. 교안 이름으로는 2단 2진 카운터예요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>B의 주기가 Clock의 4배라서 네 번째 하강에서 처음으로 돌아와요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>답안 충돌: 원문 제공 답은 ‘2진 카운터’이고, 상태 수는 4개예요. 답안에는 “4상태(0~3), 2단 2진”을 함께 적어 어느 표현을 원해도 뜻이 통하게 해요. 출제자가 어느 표현을 정답으로 봤는지는 확인하지 못했어요.\u003c/p>"}], "answer": "\u003cp>상태가 네 개(AB=00, 10, 01, 11)라서 4진(0~3)이에요. 교안 이름으로는 2단 2진 카운터예요. 제공 답 ‘2진 카운터’는 이 이름을 줄인 표현으로 보여요.\u003c/p>"}}, {"id": "q-and-gates", "kind": "출처 미확인", "number": "7", "title": "4단 2진 카운터를 AND로 확인하기", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>4단 2진 카운터의 결과를 AND 게이트로만 확인하려면 몇 개의 AND 게이트가 필요한지 이유와 답을 적으시오.\u003c/p>", "conditions": "", "ask": "\u003cp>필요한 AND 개수와 이유\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>실험 1에서 상태 수와 AND 수의 관계를 떠올려요.\u003c/p>"}], "solution": {"steps": [{"label": "상태 수", "html": "\u003cp>4단 2진 카운터의 상태는 2⁴=16개예요.\u003c/p>"}, {"label": "AND 수", "html": "\u003cp>상태마다 출력 하나가 켜지려면 AND가 상태 수만큼 필요해요. 그래서 16개예요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>실험 1에 대입해 봐요. 2단이면 2²=4개로 교안의 네 AND와 같아요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>단 수 4를 그대로 답으로 쓰지 않아요. “4입력 AND 기준”이라는 조건을 함께 적어요.\u003c/p>"}], "answer": "\u003cp>16개예요. 4단 2진은 상태가 2⁴=16개이고, 상태마다 4입력 AND 하나로 그 상태에서만 1을 내요.\u003c/p>"}}, {"id": "q-mod5-pins-graded", "kind": "기출", "number": "8", "title": "5진 카운터의 최소 출력핀", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>5진카운터를 만들기 위한 최소한의 출력핀의 개수와 이유를 적으시오 (3점)\u003c/p>", "conditions": "", "ask": "\u003cp>최소 출력핀 개수와 이유\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>핀 k개로 구분할 수 있는 값의 개수를 떠올려요.\u003c/p>"}], "solution": {"steps": [{"label": "k 구하기", "html": "\u003cp>2²=4는 5보다 작고 2³=8은 5 이상이에요. 그래서 k=3이에요.\u003c/p>"}, {"label": "예시", "html": "\u003cp>다섯 상태를 000, 001, 010, 011, 100으로 적을 수 있어요. 출력핀 3개면 충분해요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>핀 2개로는 00, 01, 10, 11 네 가지뿐이라 다섯째 상태를 적을 수 없어요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>채점본 손글씨 답(부분 판독)은 3개이고 다른 자료의 비슷한 문제 답은 5개예요. 다음 문항에서 왜 갈리는지 봐요. 이 문항은 단서가 없어서 3개로 풀었어요.\u003c/p>"}], "answer": "\u003cp>3개예요. 상태 5개를 구분하려면 2ᵏ≥5인 최소 k=3비트가 필요해요. 예: 000, 001, 010, 011, 100.\u003c/p>"}}, {"id": "q-mod5-pins", "kind": "출처 미확인", "number": "9", "title": "5진 카운터 출력핀 (확인용 단서)", "section": "실험 8 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>5진 카운터를 만들기 위한 최소한의 출력핀의 개수와 이유를 적으시오. (출력을 확인하기 위한 최소한의 핀의 개수)\u003c/p>", "conditions": "", "ask": "\u003cp>최소 출력핀 개수와 이유\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>앞 문항의 답과 단서 문구의 차이를 비교해요.\u003c/p>"}], "solution": {"steps": [{"label": "경우 1: Q 출력", "html": "\u003cp>이진수로 상태를 읽는다면 앞 문항처럼 3개면 돼요.\u003c/p>"}, {"label": "경우 2: 상태별 출력", "html": "\u003cp>실험 1처럼 AND로 상태마다 불을 켜서 확인한다면 다섯 상태에 출력 다섯 개가 필요해요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>2단 2진에 대입해 봐요. Q 출력은 2개, 교안의 디코더 출력은 4개예요. 같은 방식으로 5상태는 3개와 5개예요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>답안 충돌: 예상 세트의 제공 답은 5개이고, 채점본 손글씨 답은 3개예요. 괄호 단서를 어떻게 읽었는지가 다른 것으로 보이며, 출제자의 의도는 확인하지 못했어요. 두 경우를 나눠 써요.\u003c/p>"}], "answer": "\u003cp>무엇을 세는지에 따라 달라요. 이진 Q 출력으로 읽으면 3개, 상태마다 불을 하나씩 켜는 디코딩 출력이면 5개예요. 문구 “출력을 확인하기 위한”을 후자로 읽으면 제공 답 5개와 같아요.\u003c/p>"}}, {"id": "q-sync-improve", "kind": "출처 미확인", "number": "10", "title": "동기식이 보완한 점", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>동기식 카운터가 비동기식 카운터의 어떤 점을 보완한 것인지 적으시오.\u003c/p>", "conditions": "", "ask": "\u003cp>동기식이 보완한 점\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>비동기식의 약점을 먼저 떠올리고 클럭 연결로 답해요.\u003c/p>"}], "solution": {"steps": [{"label": "문제", "html": "\u003cp>비동기식은 앞 단이 바뀐 뒤 다음 단이 움직여서 지연이 쌓이고, 가짜 상태를 잠깐 지나요.\u003c/p>"}, {"label": "해결", "html": "\u003cp>동기식은 모든 F/F가 같은 클럭 엣지에서 함께 바뀌어요. 지연이 쌓이지 않아 더 빠른 클럭에 쓰기 좋아요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>AB가 11에서 00으로 갈 때를 비교해요. 비동기는 01을 지나고, 공통 클럭이면 두 F/F가 같은 엣지에서 바뀌어요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>“지연이 0”이라고 쓰지 않아요. F/F마다의 지연은 있어요. 없어지는 것은 단마다 쌓이는 지연이에요. 제공 답의 “없다”도 이 뜻으로 읽어요.\u003c/p>"}], "answer": "\u003cp>모든 F/F에 같은 클럭을 넣어 동시에 바뀌게 해요. 그래서 비동기식에서 단마다 쌓이던 전달(전파) 지연을 없애요.\u003c/p>"}}, {"id": "q-async-sync-compare", "kind": "기출", "number": "11", "title": "비동기식과 동기식 설명·보완점", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>비동기식 카운터와 동기식 카운터에 대해서 설명하고 동기식 카운터가 비동기식 카운터의 어떤점을 보완한 것인지 적으시오 (3점)\u003c/p>", "conditions": "", "ask": "\u003cp>두 방식의 설명과 보완점\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>두 방식을 클럭 연결로 한 문장씩 쓰고 마지막에 보완점을 써요.\u003c/p>"}], "solution": {"steps": [{"label": "비동기식", "html": "\u003cp>첫 F/F만 외부 클럭을 받고 나머지는 앞 F/F의 출력을 클럭으로 받아요. 차례로 바뀌며 지연이 쌓여요.\u003c/p>"}, {"label": "동기식", "html": "\u003cp>모든 F/F의 CLK가 같은 클럭에 묶여 동시에 바뀌어요.\u003c/p>"}, {"label": "보완점", "html": "\u003cp>비동기식의 쌓이는 전달 지연 문제를 없앴어요.\u003c/p>"}, {"label": "검산", "html": "\u003cp>세 요소(비동기 설명, 동기 설명, 보완점)가 다 있는지 세어 봐요. 채점본 손글씨 답도 같은 세 줄 구성이에요(부분 판독).\u003c/p>"}, {"label": "주의", "html": "\u003cp>보완점만 쓰면 3점짜리 문제의 앞 두 요소가 빠져요. 동기식의 장단점을 길게 나열할 필요는 없어요.\u003c/p>"}], "answer": "\u003cp>비동기식: 앞 F/F의 출력이 다음 F/F의 클럭이라 차례로 바뀌고 전달 지연이 쌓여요. 동기식: 모든 F/F가 같은 클럭으로 동시에 바뀌어요. 동기식은 쌓이는 전달 지연 문제를 보완했어요.\u003c/p>"}}, {"id": "q-sync-wave", "kind": "기출", "number": "12", "title": "74HC76 동기 회로의 A·B 파형", "section": "실험 8 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래의 카운터 회로를 보고 A, B핀의 출력파형을 Clock에 맞추어 그리시오.\u003c/p>", "conditions": "\u003cdiv class=\"work-board\">\u003cimg src=\".pack/figures/questions/sync-blank.png\" alt=\"A, B 파형 답란과 6주기 Clock\">\u003c/div>", "ask": "\u003cp>Clock에 맞춘 A, B 파형\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/sync-given.png", "w_mm": 150, "h_mm": 75.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>두 CLK가 같은 선인지 먼저 보고, J에 무엇이 들어가는지 찾아요.\u003c/p>"}], "solution": {"steps": [{"label": "다음 상태 계산", "html": "\u003cp>AB=00이면 J1=1이라 A 반전, J2=0이라 B=0이에요. 다음은 10이에요. 이어서 10→01, 01→00이에요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>CLK 하강\u003c/th>\u003cth>J1=B′\u003c/th>\u003cth>J2=A\u003c/th>\u003cth>다음 A\u003c/th>\u003cth>다음 B\u003c/th>\u003cth>AB (A부터)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>시작(가정)\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>00\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>00\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "완성 파형", "html": "\u003cp>\u003cimg src=\".pack/figures/solutions/sync-wave.png\" width=\"500\" style=\"max-width:100%;height:auto\" alt=\"Clock, A, B 완성 파형\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>세 번째 하강마다 00으로 돌아와 주기가 Clock의 3배예요. AB=11이 한 번도 나오지 않아요. 11에서 시작해도 다음은 00이에요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>B를 A의 하강에 맞춰 그리면 비동기 회로로 착각한 거예요. 공통 클럭이라 두 출력은 같은 엣지에서 바뀌어요. 시작값은 가정이에요.\u003c/p>"}], "answer": "\u003cp>시작 AB=00 가정에서 Clock 하강마다 10→01→00을 반복해요. A는 1번·4번 하강 뒤 한 주기 동안 1, B는 2번·5번 하강 뒤 한 주기 동안 1이에요.\u003c/p>"}}, {"id": "q-mod-and-double", "kind": "기출", "number": "13", "title": "몇 진인지와 2배 진수로 바꾸는 법", "section": "실험 8 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>위 3번 문제에 주어진 회로는 몇진 카운터인지 적으시오. 만약에 ‘X’진 카운터라면 회로의 수정 없이 ‘2*X’(2배)진 카운터로 바꾸고 싶으면 어떻게 하면 되는지 적으시오.\u003c/p>", "conditions": "\u003cp>원문의 ‘위 3번 문제에 주어진 회로’는 앞의 74HC76 동기 회로예요. 아래 그림이 그 회로예요.\u003c/p>", "ask": "\u003cp>몇 진인지와 2배로 바꾸는 방법\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/sync-given-2.png", "w_mm": 150, "h_mm": 75.0}], "hints": [{"label": "접근 순서", "html": "\u003cp>F/F 두 개로 구분할 수 있는 상태가 최대 몇 개인지 먼저 세요.\u003c/p>"}], "solution": {"steps": [{"label": "몇 진", "html": "\u003cp>앞 문제 추적처럼 00→10→01→00이에요. 상태 3개라서 3진이고, 공통 클럭이라 동기식이에요.\u003c/p>"}, {"label": "6진의 조건", "html": "\u003cp>F/F 2개의 상태는 최대 4개예요. 그래서 기존 두 F/F의 배선만 바꿔서는 6진이 될 수 없어요.\u003c/p>"}, {"label": "방법", "html": "\u003cp>기존 3진 회로는 그대로 두고 J=K=1인 T F/F를 하나 더해요. 새 F/F의 클럭에 B를 넣으면 B가 떨어질 때(세 번째 하강마다) 뒤집혀요.\u003c/p>\u003cp>\u003cimg src=\".pack/figures/solutions/mod6.png\" width=\"320\" style=\"max-width:100%;height:auto\" alt=\"3진 회로 뒤에 T F/F를 붙인 블록도\">\u003c/p>"}, {"label": "검산", "html": "\u003cp>ABC가 000, 100, 010, 001, 101, 011 여섯 상태를 돌고 6번째 하강에서 000으로 돌아와요. 파이썬 상태 전이로도 같은 결과를 확인했어요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>답안 충돌: 2배 방법의 제공 답이 네 가지로 갈려요. F/F 2개 그대로인 답은 2²=4를 넘을 수 없어요. ‘플립플롭을 하나 더 단다’가 계산과 맞지만 출제 의도는 미확정이에요. 자세한 비교는 문제설명에 있어요.\u003c/p>"}], "answer": "\u003cp>3진 동기 카운터예요. 2배인 6진은 F/F 2개로 만들 수 없어요(2²=4\u003c6). 기존 회로를 그대로 두고 T F/F 하나를 뒤에 붙여 3×2=6상태로 만들어요. (제공 답안이 갈려 출제 의도는 미확정)\u003c/p>"}}, {"id": "q-7447", "kind": "출처 미확인", "number": "14", "title": "7447 입력 0101의 핀 출력", "section": "실험 8 · 답안 충돌", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래의 왼쪽은 BCD-TO-SEVEN-SEGMENT DECODERS/DRIVERS 이고 오른쪽은 7-Segment이다. ‘ A = H, B = L, C= H, D = L, 3~5번핀은 H ’로 입력되었을 때 9~15번 핀으로 나오는 출력을 적으시오.\u003c/p>", "conditions": "\u003cp>원문 그림의 핀 배치를 옮긴 표예요. 16번 라벨은 원문에서 잘려 인쇄됐어요. 원문은 칩 번호 없이 “BCD-TO-SEVEN-SEGMENT DECODERS/DRIVERS”라고만 적어요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>핀\u003c/th>\u003cth>이름\u003c/th>\u003cth>핀\u003c/th>\u003cth>이름\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>B\u003c/td>\u003ctd>16\u003c/td>\u003ctd>VCC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>C\u003c/td>\u003ctd>15\u003c/td>\u003ctd>f\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>LT(윗줄)\u003c/td>\u003ctd>14\u003c/td>\u003ctd>g\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>BI/RBO(윗줄)\u003c/td>\u003ctd>13\u003c/td>\u003ctd>a\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>RBI(윗줄)\u003c/td>\u003ctd>12\u003c/td>\u003ctd>b\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>D\u003c/td>\u003ctd>11\u003c/td>\u003ctd>c\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>A\u003c/td>\u003ctd>10\u003c/td>\u003ctd>d\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>GND\u003c/td>\u003ctd>9\u003c/td>\u003ctd>e\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "ask": "\u003cp>핀 9~15의 출력\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/pin7447-given.png", "w_mm": 120, "h_mm": 65.5813953488372}], "hints": [{"label": "접근 순서", "html": "\u003cp>먼저 DCBA를 숫자로 바꾸고, 세그먼트를 켜는 출력이 H인지 L인지 정해요.\u003c/p>"}], "solution": {"steps": [{"label": "숫자와 세그먼트", "html": "\u003cp>0101은 5이고 교안 p15에서 acdfg가 켜져요. b, e는 꺼져요.\u003c/p>"}, {"label": "핀으로 옮기기", "html": "\u003cp>켜지는 세그먼트는 L, 꺼지는 세그먼트는 H로 적어요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>핀\u003c/th>\u003cth>세그먼트\u003c/th>\u003cth>숫자 5\u003c/th>\u003cth>출력\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>a\u003c/td>\u003ctd>켜짐\u003c/td>\u003ctd>L\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>b\u003c/td>\u003ctd>꺼짐\u003c/td>\u003ctd>H\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>c\u003c/td>\u003ctd>켜짐\u003c/td>\u003ctd>L\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>d\u003c/td>\u003ctd>켜짐\u003c/td>\u003ctd>L\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>e\u003c/td>\u003ctd>꺼짐\u003c/td>\u003ctd>H\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15\u003c/td>\u003ctd>f\u003c/td>\u003ctd>켜짐\u003c/td>\u003ctd>L\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>g\u003c/td>\u003ctd>켜짐\u003c/td>\u003ctd>L\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"label": "검산", "html": "\u003cp>L인 핀이 다섯 개이고 켜지는 세그먼트 수 5와 같아요. b와 e 두 핀만 H예요. a~g 일곱 칸을 모두 적었는지도 세어 봐요.\u003c/p>"}, {"label": "주의", "html": "\u003cp>답안 충돌: 자료마다 H·L이 정반대예요. 교안 7447·Common Anode 회로에서는 켜짐이 L이라 L 계열이 맞아요. 원문에 칩 번호가 없어 이 조건을 함께 적어요.\u003c/p>"}], "answer": "\u003cp>7447 기준 13:L, 12:H, 11:L, 10:L, 9:H, 14:L, 15:L이에요(숫자 5, a·c·d·f·g 켜짐).\u003c/p>"}}, {"id": "q-qp-e08-tf-01", "kind": "연습문제", "number": "15", "title": "둘째 단이 바뀌는 순간", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>A가 0에서 1로 올라갈 때 B가 뒤집힌다. T/F\u003c/p>", "conditions": "\u003cp>교안 실험 1의 74HC76 비동기 2단 카운터예요. J=K=1, PR=CL=1이에요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>교안의 Falling Edge 조건을 대입해요\u003c/p>"}], "solution": {"steps": [{"label": "판정 근거", "html": "\u003cp>FFB는 A의 하강 엣지에 Trigger돼요. A가 1에서 0으로 떨어질 때 B가 뒤집혀요.\u003c/p>"}, {"label": "문장 확인", "html": "\u003cp>“A가 바뀔 때마다”가 아니라 “A가 떨어질 때”예요.\u003c/p>\u003cp>AB=00에서 CLK 하강 1번이면 A만 올라가 10이고, B는 그대로예요.\u003c/p>"}], "answer": "\u003cp>F\u003c/p>"}}, {"id": "q-qp-e08-tf-02", "kind": "연습문제", "number": "16", "title": "단 수와 상태 수", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>n단 2진 카운터의 상태 수는 2ⁿ개이다. T/F\u003c/p>", "conditions": "\u003cp>되먹임 없이 T F/F를 n단 이은 카운터예요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>작은 n을 넣어 조건을 확인해요\u003c/p>"}], "solution": {"steps": [{"label": "판정 근거", "html": "\u003cp>단을 하나 이을 때마다 상태 수가 2배가 돼요. 교안의 2단 2진도 4상태(0-3 Counter)예요.\u003c/p>"}, {"label": "문장 확인", "html": "\u003cp>되먹임이 있으면 성립하지 않아요. p10의 3진 회로는 F/F 2개로 3상태예요.\u003c/p>\u003cp>n=2면 4, n=3이면 8로 앞 문제와 같아요.\u003c/p>"}], "answer": "\u003cp>T\u003c/p>"}}, {"id": "q-qp-e08-tf-03", "kind": "연습문제", "number": "17", "title": "R0로 0에 고정", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>이때 클럭이 들어와도 출력은 QD QC QB QA = L L L L을 유지한다. T/F\u003c/p>", "conditions": "\u003cp>7490에서 R0(1)=R0(2)=H, R9(1)=R9(2)=L이에요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>Reset 표에서 같은 줄을 찾아요\u003c/p>"}], "solution": {"steps": [{"label": "판정 근거", "html": "\u003cp>교안 Reset 표 첫째 줄이에요. R0 두 핀이 H이고 R9 중 L이 있으면 출력은 L L L L이에요.\u003c/p>"}, {"label": "문장 확인", "html": "\u003cp>R0 하나만 H이면 COUNT 줄이에요. 두 핀 모두 H여야 해요.\u003c/p>\u003cp>표의 COUNT 줄은 R0 중 L이 있을 때만 나와요.\u003c/p>"}], "answer": "\u003cp>T\u003c/p>"}}, {"id": "q-qp-e08-tf-04", "kind": "연습문제", "number": "18", "title": "LT 입력의 동작", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>LT에 L을 주면 모든 세그먼트가 꺼진다. T/F\u003c/p>", "conditions": "\u003cp>교안 7447 Control Pins 표는 “0: On, 1: Off”예요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>LT와 BI의 동작을 구분해요\u003c/p>"}], "solution": {"steps": [{"label": "판정 근거", "html": "\u003cp>LT는 Lamp-Test로, 켜면(L) 모든 세그먼트가 ON이에요. 모두 끄는 것은 BI예요.\u003c/p>"}, {"label": "문장 확인", "html": "\u003cp>L을 준다는 말이 “끈다”는 뜻이 아니에요. 버튼이 눌린다는 뜻이에요.\u003c/p>\u003cp>표의 LT 줄은 ON, BI 줄은 OFF예요.\u003c/p>"}], "answer": "\u003cp>F\u003c/p>"}}, {"id": "q-qp-e08-blank-01", "kind": "연습문제", "number": "19", "title": "켜지는 출력 찾기", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 빈칸", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>이때 입력이 모두 1인 AND는 ① ( )이고, 켜지는 출력 번호는 ② ( )예요.\u003c/p>", "conditions": "\u003cp>교안 실험 1 디코더예요. A를 앞에 적어 AB=01이에요. 즉 A=0, B=1이에요.\u003c/p>", "ask": "\u003cp>빈칸의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>A가 낮은 자리임을 먼저 정해요\u003c/p>"}], "solution": {"steps": [{"label": "빈칸별 근거", "html": "\u003cp>A=0이니 A′=1, B=1이니 A′·B가 1이에요. 교안의 세 번째 AND, 출력 2예요.\u003c/p>\u003cp>값으로 보면 A가 낮은 자리라 AB=01은 1×2+0=2예요.\u003c/p>\u003cp>AB=01을 값 1로 읽지 않아요. A′B, BA′처럼 순서가 다른 표현도 인정해요.\u003c/p>"}], "answer": "\u003cp>① A′·B, ② 2\u003c/p>"}}, {"id": "q-qp-e08-blank-02", "kind": "연습문제", "number": "20", "title": "7490의 두 연결", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 빈칸", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>클럭은 ① ( )번 핀(INPUT A)에 넣고, QA인 ② ( )번 핀을 ③ ( )번 핀(INPUT B)에 연결해요.\u003c/p>", "conditions": "\u003cp>교안 p11처럼 7490을 0~9 카운터로 써요.\u003c/p>", "ask": "\u003cp>빈칸의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>2진 단 → 5진 단 순서로 따라가요\u003c/p>"}], "solution": {"steps": [{"label": "빈칸별 근거", "html": "\u003cp>INPUT A가 2진 단의 입력이고 QA 12번이 5진 단의 입력 INPUT B 1번으로 들어가요.\u003c/p>\u003cp>p6 핀맵과 p11 회로의 번호가 같아요.\u003c/p>\u003cp>번호 순서를 바꾸지 않아요. 핀 이름만 쓴 답은 번호로 바꿔 적어요.\u003c/p>"}], "answer": "\u003cp>① 14, ② 12, ③ 1\u003c/p>"}}, {"id": "q-qp-e08-blank-03", "kind": "연습문제", "number": "21", "title": "입력 0011의 표시", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 빈칸", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>표시되는 숫자는 ① ( )이고, 켜지는 세그먼트는 ② ( )예요.\u003c/p>", "conditions": "\u003cp>7447 제어 핀은 모두 H이고 입력 D C B A=0011이에요.\u003c/p>", "ask": "\u003cp>빈칸의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>D C B A 순서로 값을 읽어요\u003c/p>"}], "solution": {"steps": [{"label": "빈칸별 근거", "html": "\u003cp>0011은 2+1=3이고 교안 p15 표에서 abcdg예요.\u003c/p>\u003cp>e, f만 꺼져 있어요. 7개 중 5개가 켜져요.\u003c/p>\u003cp>세그먼트 순서가 달라도 같은 집합이면 인정해요.\u003c/p>"}], "answer": "\u003cp>① 3, ② abcdg\u003c/p>"}}, {"id": "q-qp-e08-board-01", "kind": "연습문제", "number": "22", "title": "출력 3의 AND를 작도해요", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 브레드보드 작도", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>주어진 AND 회로와 핀 명세를 빈 보드에 옮겨 전원·입력·출력과 미사용 핀을 표시하세요.\u003c/p>", "conditions": "\u003cp>74HC08 한 게이트로 실험 1의 출력 3(A·B)을 만들어요. A는 1번, B는 2번에 넣고 3번 출력을 측정점 Y로 둬요. 입력 A, B는 0V 또는 5V 외부 신호예요. LED는 쓰지 않아요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"chip-spec\">\u003cthead>\u003ctr>\u003cth>핀\u003c/th>\u003cth>이름\u003c/th>\u003cth>역할\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>A\u003c/td>\u003ctd>입력 A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>B\u003c/td>\u003ctd>입력 B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Y\u003c/td>\u003ctd>출력(측정점)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>VCC\u003c/td>\u003ctd>+5V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>GND\u003c/td>\u003ctd>0V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4,5,9,10,12,13\u003c/td>\u003ctd>미사용 입력\u003c/td>\u003ctd>수업 작도 명세: NC(개방), 실사용 일반 권장과 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6,8,11\u003c/td>\u003ctd>미사용 출력\u003c/td>\u003ctd>NC, 접지 금지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"work-board\">\u003cimg src=\".pack/figures/questions/and-blank.png\" alt=\"v1 배포 PDF 작도용 빈 보드\">\u003c/div>", "ask": "\u003cp>완성한 작도\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/and-given.png", "w_mm": 75, "h_mm": 26.612903225806452}], "hints": [{"label": "접근 단서", "html": "\u003cp>같은 넷을 같은 도통 홀에 옮겨요\u003c/p>"}], "solution": {"steps": [{"label": "연결 기준", "html": "\u003cp>14→+5V, 7→GND, 1→A, 2→B, 3→Y. 미사용 입력·출력은 명세대로 NC.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>넷\u003c/th>\u003cth>핀\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>+5V\u003c/td>\u003ctd>14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GND\u003c/td>\u003ctd>7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Y\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NC\u003c/td>\u003ctd>4,5,6,8,9,10,11,12,13\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>외부 A, B는 신호원이고 Y는 측정점이에요. IC 위치·홀 좌표가 달라도 같은 넷이면 인정해요.\u003c/p>"}, {"label": "완성 결선도", "html": "\u003cp>그림은 A=B=0인 예예요. 입력 점퍼의 레일 쪽을 +5V로 옮기면 입력이 1이에요.\u003c/p>\u003cimg src=\".pack/figures/solutions/and-complete.png\" width=\"270\" style=\"max-width:100%;height:auto\" alt=\"완성 결선도: 74HC08 AND 한 개\">"}, {"label": "논리 검산", "html": "\u003cp>A·B는 A=B=1일 때만 1이에요. 실험 1에서 AB=11인 상태를 찾는 게이트예요. 이 문항은 AND 한 개만 작도해요.\u003c/p>\u003cp>A=B=1이면 Y=1, 그 밖에는 Y=0인지 진리표와 핀 넷을 확인해요.\u003c/p>\u003cp>서로 다른 입력 신호이니 1번과 2번을 묶지 않아요. 미사용 출력은 접지하지 않아요.\u003c/p>"}], "answer": "\u003cp>14→+5V, 7→GND, 1→A, 2→B, 3→Y. 미사용 입력·출력은 명세대로 NC.\u003c/p>"}}, {"id": "q-qp-e08-short-01", "kind": "연습문제", "number": "23", "title": "가짜 상태가 생기는 이유", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 짧은 서술형", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>최종 AB와, 그 사이에 잠깐 나타나는 값을 이유와 함께 두세 문장으로 설명하세요.\u003c/p>", "conditions": "\u003cp>교안 실험 1의 비동기 2단 카운터예요. AB=11에서 CLK가 떨어져요. A를 앞에 적어요.\u003c/p>", "ask": "\u003cp>이유를 담은 설명\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>클럭 경로로 인과를 설명해요\u003c/p>"}], "solution": {"steps": [{"label": "모범 답", "html": "\u003cp>최종은 00이고 잠깐 01을 지나요. A가 먼저 0이 되고, 그 하강을 받은 B가 전달 지연 뒤에 0이 되기 때문이에요.\u003c/p>\u003cp>FFB의 클럭은 A예요. A가 바뀐 뒤에야 B가 움직이니 두 값이 같은 순간에 바뀌지 않아요.\u003c/p>"}, {"label": "채점 핵심", "html": "\u003cp>채점 요소: 최종 00, 중간 01, A가 B의 클럭이라는 원인, 전달 지연이라는 표현.\u003c/p>"}, {"label": "허용 표현", "html": "\u003cp>같은 인과와 순서를 밝힌 동치 표현을 인정해요. \u003c/p>\u003cp>값의 순서(A를 앞에)를 먼저 밝혀요. 01을 값 1로 읽지 않아요.\u003c/p>"}], "answer": "\u003cp>최종은 00이고 잠깐 01을 지나요. A가 먼저 0이 되고, 그 하강을 받은 B가 전달 지연 뒤에 0이 되기 때문이에요.\u003c/p>"}}, {"id": "q-qp-e08-short-02", "kind": "연습문제", "number": "24", "title": "L일 때 켜지는 이유", "section": "실험 8 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 짧은 서술형", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>7447 출력이 L일 때 세그먼트가 켜지는 이유를 전류가 흐르는 길로 설명하세요.\u003c/p>", "conditions": "\u003cp>FND는 Common Anode이고 3·8번이 +5V예요. 각 세그먼트는 330Ω을 거쳐 7447 출력에 연결돼요.\u003c/p>", "ask": "\u003cp>이유를 담은 설명\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>전류의 시작과 끝을 먼저 적어요\u003c/p>"}], "solution": {"steps": [{"label": "모범 답", "html": "\u003cp>+5V에서 공통 애노드, LED, 330Ω을 지나 L인 출력으로 전류가 흘러 켜져요. H면 양쪽 전압 차가 없어 꺼져요.\u003c/p>\u003cp>LED는 애노드에서 캐소드로 전류가 흐를 때 켜져요. Common Anode는 애노드가 +5V로 묶여 있어 반대쪽을 낮춰야 해요.\u003c/p>"}, {"label": "채점 핵심", "html": "\u003cp>채점 요소: +5V 공통 애노드, 전류 경로, L일 때 전압 차, H일 때 꺼짐.\u003c/p>"}, {"label": "허용 표현", "html": "\u003cp>같은 인과와 순서를 밝힌 동치 표현을 인정해요. \u003c/p>\u003cp>Common Cathode와 극성이 반대예요. 이 실험에서는 Common Cathode가 동작하지 않아요.\u003c/p>"}], "answer": "\u003cp>+5V에서 공통 애노드, LED, 330Ω을 지나 L인 출력으로 전류가 흘러 켜져요. H면 양쪽 전압 차가 없어 꺼져요.\u003c/p>"}}]}</script>
<main id="book"></main>
<script>
'use strict';

// 생성기가 문자열 치환으로 바꾸는 자리표시자. 여기서 이어 붙여 두어 치환 대상이 되지 않게 한다.
const PLACEHOLDER = '__WORKBOOK' + '_DATA__';
const KIND_SLUG = { '예제': 'example', '연습문제': 'exercise', '장말문제': 'problem', '기출': 'exam' };
const KIND_SHORT = { '예제': '예제', '연습문제': '연습', '장말문제': '문제', '기출': '문항' };   // Hint 쪽 항목 번호 앞 (번호가 종류끼리 겹침)
const FIG_SCALE_CAP = 1.5;        // 교재 인쇄 크기 대비 확대 상한
const MATH_MIN_SCALE = 0.7;
const STRIP_MATH_MIN_SCALE = 0.5;  // Hint 띠 속 식은 띠 폭에 맞춰 더 줄일 수 있음
// 쪽 맞춤 순서: 폭 → 글자. 앞 단계 값은 유지한 채 다음 단계로 간다.
const FIT_STEPS = [
  ['--pw', '40%'], ['--pw', '50%'],
  ['--fs', '0.9'], ['--fs', '0.8'],
];
// 풀이 칸 맞춤 순서: 글자 → 위 회로도 높이 → 2단
const SOL_FIT_STEPS = [['sfs', '0.9'], ['sfs', '0.8'], ['fig', '0.30'], ['fig', '0.22'], ['cols', '2']];
const PAGE_W_PX = 297 * 96 / 25.4;

const book = document.getElementById('book');

/* ---------- 작은 도우미 ---------- */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function txt(tag, cls, text) {
  const e = el(tag, cls);
  e.textContent = text;
  return e;
}
const kindSlug = kind => KIND_SLUG[kind] || 'problem';

async function loadData() {
  const q = new URLSearchParams(location.search).get('data');
  const raw = document.getElementById('workbook-data').textContent.trim();
  const url = q || (raw === PLACEHOLDER ? 'sample.json' : null);
  if (!url) return JSON.parse(raw);
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  renderMathInElement(root, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
    ],
    throwOnError: false,
    fleqn: true,
  });
}

/* ---------- 등식 줄바꿈 ---------- */
// 긴 등식(=, ≈ 등이 있고 EQ_SPLIT_LEN자보다 긴 식)만 한 줄을 따로 차지하는 display 식으로 바꾸고,
// 관계 기호마다 줄을 바꿔 세로로 맞춘다. 짧은 식은 문장 속에 그대로 둔다.
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
const REL_RE = /^(?:=|\\(?:approx|Rightarrow|leq?|geq?)(?![a-zA-Z]))/;
const EQ_SPLIT_LEN = 40;

// 중괄호·\left…\right 바깥의 관계 기호에서 나눈다: [lhs, [rel, rhs], …]
function splitRelations(tex) {
  const parts = [];
  let depth = 0, start = 0, rel = null;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (depth === 0) {
      const m = (c === '=' || c === '\\') && REL_RE.exec(tex.slice(i));
      if (m) {
        parts.push(rel ? [rel, tex.slice(start, i).trim()] : tex.slice(start, i).trim());
        rel = m[0]; i += m[0].length - 1; start = i + 1;
        continue;
      }
    }
    if (c === '{') depth++;
    else if (c === '}') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    }
  }
  if (!rel) return null;
  parts.push([rel, tex.slice(start).trim()]);
  return parts;
}

// 중괄호·\left…\right·소괄호·대괄호 바깥의 쉼표에서 식 목록을 나눈다. 조각이 둘 이상이고
// 모든 조각이 (왼쪽 변이 있는) 관계식일 때만 조각 배열을, 아니면 null 을 돌려준다.
function splitEquationList(tex) {
  const pieces = [];
  let depth = 0, start = 0;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (c === '{' || c === '(' || c === '[') depth++;
    else if (c === '}' || c === ')' || c === ']') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    } else if (c === ',' && depth === 0) {
      pieces.push(tex.slice(start, i));
      start = i + 1;
    }
  }
  if (depth !== 0 || !pieces.length) return null;
  pieces.push(tex.slice(start));
  // 조각 머리의 간격 명령(`\ `, `\,`, `\quad` …)은 식 바깥이라 지운다. 꼬리는 건드리지 않는다.
  const SPACE = /^(?:\s|\\[ ,;:!]|\\q?quad(?![a-zA-Z]))+/;
  const list = pieces.map(p => p.replace(SPACE, ''));
  if (list.length > 1 && !list[list.length - 1]) list.pop();   // 말미 쉼표: 빈 마지막 조각은 버린다
  if (list.length < 2) return null;
  const ok = list.every(p => { const r = splitRelations(p); return r && r[0]; });
  return ok ? list : null;
}
function equationTex(tex, parts, prefix) {
  const [lhs, ...rest] = parts;
  if (!lhs) return prefix + tex;
  const rowsOf = (head, relations) => relations.map(([rel, rhs], i) => `${i ? '' : head} &amp;${rel} ${rhs}`);
  const list = splitEquationList(tex);
  const lines = list
    ? list.flatMap((piece, k) => { const [l, ...r] = splitRelations(piece); return rowsOf((k ? '' : prefix) + l, r); })
    : rowsOf(prefix + lhs, rest);
  return `\\begin{aligned}${lines.join(' \\\\ ')}\\end{aligned}`;
}

function breakEquations(html) {
  if (!html) return html;
  const toks = [];
  let last = 0;
  for (const m of html.matchAll(MATH_RE)) {
    toks.push({ text: html.slice(last, m.index) });
    const tex = (m[1] ?? m[2]).trim();
    const parts = tex.length > EQ_SPLIT_LEN ? splitRelations(tex) : null;
    toks.push({ tex, parts, display: !!m[1] || !!parts, prefix: '' });
    last = m.index + m[0].length;
  }
  if (!toks.length) return html;
  toks.push({ text: html.slice(last) });

  // 줄로 나뉜 식 사이에 남는 쉼표는 지우고, 식 사이의 → 는 다음 식 앞으로 옮긴다
  toks.forEach((t, k) => {
    if (t.text == null) return;
    const prev = toks[k - 1], next = toks[k + 1];
    const pd = prev && prev.display, nd = next && next.display;
    if (pd && nd && /^\s*(→|⇒)\s*$/.test(t.text)) { t.text = ''; next.prefix = '\\Rightarrow\\ '; return; }
    if (pd) t.text = t.text.replace(/^\s*[,，]\s*/, '');
    if (nd) t.text = t.text.replace(/\s*[,，]\s*$/, ' ');
    if (pd && nd && !t.text.trim()) t.text = '';
  });

  return toks.map(t => {
    if (t.text != null) return t.text;
    if (!t.display) return `$${t.tex}$`;
    return `$$${t.parts ? equationTex(t.tex, t.parts, t.prefix) : t.prefix + t.tex}$$`;
  }).join('');
}

// display 식이 칸보다 넓으면 그 식만 줄인다 (최소 70%)
function fitDisplayMath(root) {
  for (const d of root.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    k.style.transform = '';
    const avail = d.clientWidth, need = k.scrollWidth;
    if (need > avail + 1) {
      k.style.transformOrigin = 'left center';
      k.style.transform = `scale(${Math.max(MATH_MIN_SCALE, avail / need)})`;
    }
  }
}

function nextLayout() {
  void book.offsetHeight;          // 레이아웃을 돌려 새 글꼴(KaTeX 등) 로드를 시작시킴
  return document.fonts.ready;
}

/* ---------- 쪽 틀과 헤더 (공용) ---------- */
function makePage(kind, cls) {
  const page = el('section', `page ${cls}`);
  page.dataset.kind = kind;
  const head = el('header', 'page-head');
  const body = el('div', 'page-body');
  page.append(head, body);
  return { page, head, body };
}

function problemHead(p, n, total) {
  const frag = document.createDocumentFragment();
  const lead = el('div', 'head-lead');
  lead.append(txt('span', 'kind-badge', p.kind), txt('span', 'head-num', p.number));
  if (p.difficulty > 0) lead.append(txt('span', 'head-stars', '★'.repeat(p.difficulty)));
  if (p.sol) lead.append(txt('span', 'sol-tag', 'SOL'));
  lead.append(txt('span', 'ans-tag', '답안'));

  const h2 = el('h2', 'page-title');
  h2.append(txt('span', 'sr', `${p.kind} ${p.number} — `), document.createTextNode(p.title));

  const meta = el('div', 'head-meta');
  const info = [p.section, p.book_page != null ? `p.${p.book_page}` : '', `${n} / ${total}`];
  meta.append(txt('span', 'head-info', info.filter(Boolean).join(' · ')));

  frag.append(lead, h2, meta);
  return frag;
}

/* ---------- 문제 쪽 ---------- */
function figureImg(f) {
  const img = el('img', 'fig');
  img.src = f.src;
  img.alt = '';
  img.width = Math.round(f.w_mm * 10);
  img.height = Math.round(f.h_mm * 10);
  img.style.setProperty('--w-cap', `${f.w_mm * FIG_SCALE_CAP}mm`);
  img.style.setProperty('--ratio', f.w_mm / f.h_mm);
  return img;
}

function block(label, html, cls, lang) {
  const b = el('section', 'block');
  const body = el('div', `prose ${cls}`, breakEquations(html));
  if (lang) body.lang = lang;
  b.append(txt('div', 'block-label', label), body);
  return b;
}

function hintStrip(p) {
  const a = el('a', 'hint-strip');
  a.href = `#hint-${p.id}`;
  a.append(txt('div', 'hint-strip-label', 'Hint'));
  const ol = el('ol', 'hint-strip-list');
  p.hints.forEach((h, i) => {
    const li = el('li', 'hint-strip-item');
    li.dataset.n = i + 1;
    if (h.formula) li.append(stripFormula(h.formula));
    else li.append(el('span', 'hint-strip-text', h.label));   // 이름표 속 KaTeX가 grid 칸으로 흩어지지 않게
    ol.append(li);
  });
  a.append(ol);
  return a;
}

// 'formula'(구분자 없는 LaTeX)가 있으면 띠에는 이름표 대신 식을 보인다
function stripFormula(tex) {
  const span = el('span', 'hint-strip-formula');
  if (typeof katex !== 'undefined') katex.render(tex, span, { throwOnError: false });
  else span.textContent = tex;
  return span;
}

function fitStripFormulas(page) {
  for (const f of page.querySelectorAll('.hint-strip-formula')) {
    f.style.transform = '';
    const avail = f.clientWidth, need = f.scrollWidth;
    if (need > avail + 1) f.style.transform = `scale(${Math.max(STRIP_MATH_MIN_SCALE, avail / need)})`;
  }
}

// 가운데 칸: 풀이 단계와 답. solution이 없으면 빈 점 격자
function solutionArea(p) {
  const work = el('div', 'work');
  const s = p.solution;
  if (!s) return work;
  const flow = el('div', 'sol-flow');
  const ol = el('ol', 'sol-steps');
  (s.steps || []).forEach((st, i) => {
    const li = el('li', 'sol-step');
    li.dataset.n = i + 1;
    if (st.label) li.append(el('div', 'sol-step-label', st.label));
    li.append(el('div', 'prose sol-step-body', breakEquations(st.html)));
    ol.append(li);
  });
  flow.append(ol);
  work.append(flow);
  if (s.answer) {
    const a = block('답', s.answer, 'ask-box');
    a.classList.add('sol-answer');
    work.append(a);
  }
  return work;
}

function problemPage(p, n, total) {
  const { page, head, body } = makePage(kindSlug(p.kind), 'page--problem');
  page.id = p.id;
  head.append(problemHead(p, n, total));

  const row = el('div', 'page-row');
  const panel = el('div', 'panel');
  if (p.html.original) panel.append(block('문제 원문', p.html.original, 'original', p.original_lang || 'en'));   // 원문은 맨 처음
  if (p.html.conditions && p.html.conditions.trim()) panel.append(block('조건', p.html.conditions, 'conditions'));   // 조건이 없으면 라벨도 없다
  panel.append(block('구할 것', p.html.ask, 'ask-box'));
  const quizBoardPage = !!panel.querySelector('.work-board');
  for (const board of panel.querySelectorAll('.work-board')) {
    const owner = board.closest('.block');
    board.remove();
    if (owner && !owner.querySelector('.prose').textContent.trim() && !owner.querySelector('img, table, .katex')) owner.remove();
  }
  const center = el('div', 'page-center');
  const figs = p.figures || [];
  if (figs.length) {
    const band = el('div', 'fig-band');
    figs.forEach(f => band.append(figureImg(f)));
    center.append(band);
  }
  center.append(solutionArea(p));
  if (quizBoardPage) {
    const schematic = center.querySelector('.fig-band');
    if (schematic) panel.insertBefore(schematic, panel.querySelector('.conditions')?.closest('.block') || null);
  }
  row.append(panel, center);
  if (p.hints && p.hints.length) {
    row.classList.add('has-strip');
    if (p.hints.some(h => h.formula)) row.classList.add('has-formula');
    row.append(hintStrip(p));
  }
  body.append(row);
  return page;
}

// 6.5 쪽 맞춤. 들어가면 멈추고, 끝까지 넘치면 false.
function fitProblemPage(page) {
  const panel = page.querySelector('.panel');
  const fits = () => panel.scrollHeight <= panel.clientHeight + 1;
  const state = { pw: '33%', fs: '1' };
  for (const [prop, val] of FIT_STEPS) {
    if (fits()) break;
    panel.style.setProperty(prop, val);
    state[{ '--pw': 'pw', '--fs': 'fs' }[prop]] = val;
  }
  page.dataset.fit = `pw=${state.pw} fs=${state.fs}`;
  fitDisplayMath(panel);
  fitStripFormulas(page);
  const ok = fits();
  if (!ok) page.dataset.overflow = '';
  return ok;
}

// 풀이 칸 맞춤. 마지막 단계가 칸 아래나 오른쪽(넘친 단)으로 나가면 넘침.
function fitSolution(page) {
  const work = page.querySelector('.work');
  const flow = work.querySelector('.sol-flow');
  const last = flow && flow.querySelector('.sol-step:last-child');
  if (!last) return true;
  const fits = () => {
    fitDisplayMath(flow);
    const f = flow.getBoundingClientRect(), l = last.getBoundingClientRect();
    return l.bottom <= f.bottom + 1 && l.right <= f.right + 1;
  };
  const band = page.querySelector('.fig-band');
  const state = { sfs: '1', fig: '0.40', cols: '1' };
  for (const [key, val] of SOL_FIT_STEPS) {
    if (fits()) break;
    if (key === 'fig') {
      if (!band) continue;
      band.style.setProperty('--fig-frac', val);
    }
    else if (key === 'cols') flow.classList.add('is-2col');
    else work.style.setProperty(`--${key}`, val);
    state[key] = val;
  }
  const ok = fits();
  fitDisplayMath(work.querySelector('.sol-answer') || work);
  page.dataset.fit += ` sfs=${state.sfs} fig=${state.fig} cols=${state.cols}`;
  if (!ok) page.dataset.overflow = '';
  return ok;
}

/* ---------- Hint 쪽 ---------- */
function hintItem(h, i) {
  const li = el('li', 'hint-item');
  li.dataset.n = i + 1;
  li.append(el('div', 'hint-item-label', h.label), el('div', 'prose hint-item-body', breakEquations(h.html)));
  return li;
}

function hintPage(title, first) {
  const { page, head, body } = makePage('hint', 'page--hint');
  // 이어지는 Hint 쪽은 책갈피가 겹치지 않게 제목을 h2가 아닌 div로 둔다
  head.append(txt('span', 'kind-badge', 'Hint'), txt(first ? 'h2' : 'div', 'page-title', `Hint — ${title}`));
  const cols = el('div', 'hint-cols');
  body.append(cols);
  book.append(page);
  return cols;
}

function hintEntry(p, withId) {
  const root = el('article', 'hint-entry');
  if (withId) root.id = `hint-${p.id}`;
  const num = txt('a', 'hint-entry-num', `${KIND_SHORT[p.kind] || ''} ${p.number}`.trim());
  num.href = `#${p.id}`;
  const list = el('ol', 'hint-items');
  root.append(num, list);
  return { root, list };
}

// 6.6 항목을 하나씩 넣고, 단이 넘치면 새 Hint 쪽에 같은 문제 칸을 열어 잇는다.
function flowHints(meta, problems, staged) {
  const overflow = [];
  const list = problems.filter(p => p.hints && p.hints.length);
  if (!list.length) return overflow;

  let cols = hintPage(meta.title, true);
  const over = () => cols.scrollWidth > cols.clientWidth + 1;

  for (const p of list) {
    let idPlaced = false;
    let entry = hintEntry(p, true);
    cols.append(entry.root);
    for (const li of staged.get(p.id)) {
      entry.list.append(li);
      fitDisplayMath(li);
      if (!over()) continue;

      li.remove();
      if (entry.list.children.length) idPlaced = true;
      else entry.root.remove();
      cols = hintPage(meta.title, false);
      entry = hintEntry(p, !idPlaced);
      cols.append(entry.root);
      entry.list.append(li);
      fitDisplayMath(li);
      if (over()) {                 // 빈 쪽에도 안 들어가는 항목
        cols.closest('.page').dataset.overflow = '';
        overflow.push(`hint-${p.id}`);
      }
    }
  }
  return overflow;
}

/* ---------- 화면 배율 ---------- */
function applyZoom(z) {
  for (const page of book.querySelectorAll(':scope > .page')) page.style.zoom = z;
}
const screenZoom = () => applyZoom(Math.min(1, (innerWidth - 32) / PAGE_W_PX));

/* ---------- 실행 (6.9) ---------- */
// 표가 실제로 잘리거나 옆 단 글을 침범하는가. 오른쪽 가장자리(T)만 본다. wrap 이 없는 생 table 은 table 자신이 호스트.
function tableClipped(table) {
  const wrap = table.closest('.table-wrap') || table;
  const T = table.getBoundingClientRect().right;
  // (a) 가장 가까운 clip 조상(overflow-x 가 visible 이 아닌 요소, wrap 자신 포함)의 오른쪽 안쪽 가장자리를 넘는가
  for (let el = wrap; el && el !== document.documentElement; el = el.parentElement) {
    const cs = getComputedStyle(el);
    if (cs.overflowX === 'visible') continue;
    if (T > el.getBoundingClientRect().right - parseFloat(cs.borderRightWidth) + 1) return true;
    break;
  }
  // (b) 풀이 흐름 안이면: 다단은 다음 단의 왼쪽(단 오른쪽 + column-gap), 단일 단은 flow 의 오른쪽을 넘는가
  const flow = wrap.closest('.sol-flow');
  if (!flow) return false;
  const cs = getComputedStyle(flow), fr = flow.getBoundingClientRect();
  const left = fr.left + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft);
  const right = fr.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight);
  const n = parseInt(cs.columnCount, 10) || 1;   // 단일 단은 'auto'
  let limit = right;
  if (n > 1) {
    const gap = cs.columnGap === 'normal' ? parseFloat(cs.fontSize) : parseFloat(cs.columnGap);
    const colW = (right - left - gap * (n - 1)) / n;
    const col = Math.min(n - 1, Math.max(0, Math.floor((wrap.getBoundingClientRect().left - left + 1) / (colW + gap))));
    if (col < n - 1) limit = left + (col + 1) * (colW + gap);   // 다음 단의 왼쪽 가장자리
  }
  return T > limit + 1;
}

// 맞춤이 끝난 쪽에 잘린 식(display·인라인)·잘리거나 옆 단을 침범한 표·칸 밖으로 나간 풀이 단계가 남았는가
function hasClippedContent(page) {
  for (const d of page.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    const range = document.createRange();
    range.selectNodeContents(k.querySelector('.katex-html') || k);
    if (range.getBoundingClientRect().right > d.getBoundingClientRect().right + 1) return true;
  }
  // 인라인 식: 가장 가까운 글 상자 오른쪽 + 1 을 넘으면 흐름·칸이 잘라 낸다. display 식은 위에서 봤고,
  // Hint 띠의 식(.hint-strip-formula)은 따로 줄이므로 여기서 보지 않는다.
  for (const k of page.querySelectorAll('.katex')) {
    if (k.closest('.katex-display, .hint-strip-formula')) continue;
    const host = k.closest('.sol-step-body, .prose, td, th, .hint-strip-item, .sol-answer, .block');
    if (!host) continue;
    const range = document.createRange();
    range.selectNodeContents(k.querySelector('.katex-html') || k);
    if (range.getBoundingClientRect().right > host.getBoundingClientRect().right + 1) return true;
  }
  for (const t of page.querySelectorAll('table')) {
    if (tableClipped(t)) return true;
  }
  for (const flow of page.querySelectorAll('.sol-flow')) {
    const f = flow.getBoundingClientRect();
    for (const step of flow.querySelectorAll('.sol-step')) {
      const s = step.getBoundingClientRect();
      if (s.bottom > f.bottom + 1 || s.right > f.right + 1) return true;
    }
  }
  return false;
}

async function main() {
  try {
    const data = await loadData();
    const { meta, problems } = data;
    document.title = meta.title;

    // DOM 생성
    const total = meta.total || problems.length;
    problems.forEach((p, i) => book.append(problemPage(p, i + 1, total)));
    const staging = el('div', 'staging');
    staging.setAttribute('aria-hidden', 'true');
    const staged = new Map();
    for (const p of problems) {
      const items = (p.hints || []).map(hintItem);
      staged.set(p.id, items);
      staging.append(...items);
    }
    document.body.append(staging);

    // 글꼴 + 그림 → KaTeX (수식 글꼴도 다 받은 뒤 잰다)
    await Promise.all([nextLayout(), ...[...document.images].map(img => img.complete ? null : new Promise(done => {
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
    }))]);
    renderMath(book);
    renderMath(staging);
    await nextLayout();

    const overflow = [];
    for (const page of book.querySelectorAll('.page--problem')) {
      const panelOk = fitProblemPage(page);
      const solOk = fitSolution(page);
      if (!panelOk || !solOk) overflow.push(page.id);
    }
    overflow.push(...flowHints(meta, problems, staged));
    staging.remove();

    for (const page of book.querySelectorAll('.page--problem')) {   // 맞춤이 끝난 뒤 한 번 훑는다
      if (overflow.includes(page.id) || !hasClippedContent(page)) continue;
      page.dataset.overflow = '';
      overflow.push(page.id);
    }
    for (const page of book.querySelectorAll('.page--problem')) {
      const center = page.querySelector('.page-center');
      const bad = [...page.querySelectorAll('.work-board img')].some(img => {
        const r=img.getBoundingClientRect(), c=center.getBoundingClientRect();
        return img.offsetWidth < 90*96/25.4-1 || r.left<c.left-1 || r.right>c.right+1 || r.bottom>c.bottom+1;
      });
      if ((bad || (center.querySelector('.work-board-block') && (center.scrollHeight>center.clientHeight+1 || center.scrollWidth>center.clientWidth+1))) && !overflow.includes(page.id)) {
        page.dataset.overflow=''; overflow.push(page.id);
      }
    }
    document.body.dataset.overflow = overflow.join(',');
    document.documentElement.dataset.ready = 'true';
  } catch (err) {
    console.error(err);
    book.append(txt('p', 'load-error', `문제 데이터를 읽지 못했습니다: ${err.message}`));
    document.body.dataset.overflow = '';
    document.documentElement.dataset.ready = 'error';
    return;
  }

  // 배율은 맞춤과 Hint 쪽 나누기가 끝난 뒤에만
  screenZoom();
  addEventListener('resize', screenZoom);
  addEventListener('beforeprint', () => applyZoom(''));
  addEventListener('afterprint', screenZoom);
}

addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>
