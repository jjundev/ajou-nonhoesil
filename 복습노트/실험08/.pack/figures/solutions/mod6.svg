<svg xmlns="http://www.w3.org/2000/svg" width="130mm" height="42.3256mm" viewBox="0 0 860 280" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>3진 회로 뒤에 T F/F 하나를 붙여 6상태로 만드는 그림</title><rect width="860" height="280" fill="#fff"/><rect x="190" y="70" width="260" height="130" rx="8" fill="#e8f1ff" stroke="#18212e" stroke-width="3"/><text x="320" y="128" font-size="24" text-anchor="middle" fill="#18212e" font-weight="bold">문제의 3진 회로</text><text x="320" y="164" font-size="22" text-anchor="middle" fill="#18212e">(그대로 둠)</text><rect x="590" y="70" width="170" height="130" rx="8" fill="#fff" stroke="#2674df" stroke-width="3"/><text x="675" y="128" font-size="24" text-anchor="middle" fill="#2674df" font-weight="bold">T F/F</text><text x="675" y="164" font-size="20" text-anchor="middle" fill="#2674df">새로 추가</text><text x="40" y="142" font-size="24" text-anchor="start" fill="#18212e">Clock</text><polyline points="115,135 190,135" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,135 590,135" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="120" font-size="22" text-anchor="middle" fill="#2674df" font-weight="bold">B 하강</text><polyline points="760,135 820,135" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="835" y="143" font-size="24" text-anchor="middle" fill="#2674df" font-weight="bold">C</text><text x="430" y="250" font-size="24" text-anchor="middle" fill="#18212e">상태 수 3 × 2 = 6, 플립플롭 3개</text></svg>