<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 230" role="img" data-note-schematic="1">
  <style>@font-face { font-family: "Logic Lab Schematic"; font-weight: 600; font-style: normal; src: url(data:font/woff2;base64,) format("woff2"); }

:root {
  color-scheme: light dark;
  --paper: #ffffff; --ink: #18212e; --muted: #475569; --panel: #eaf2ff;
  --blue: #1658ac; --red: #ab2d20; --green: #176140; --amber: #8f4809;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151d29; --ink: #e6eef8; --muted: #bac9dc; --panel: #263951;
    --blue: #8ec5ff; --red: #ffa697; --green: #85dcb4; --amber: #ffbf7f;
  }
}
.fig-paper { fill: var(--paper); }
.fig-ink { stroke: var(--ink); }
.fig-text, .fig-dot { fill: var(--ink); }
text { font-family: "Logic Lab Schematic"; font-weight: 600; font-style: normal; }
[data-node-color="blue"] { --node: var(--blue); }
[data-node-color="red"] { --node: var(--red); }
[data-node-color] { fill: var(--node); }
.fig-crossing { stroke: var(--paper); }
[data-fill="paper"] { fill: var(--paper); }
[data-fill="ink"] { fill: var(--ink); }
[data-fill="muted"] { fill: var(--muted); }
[data-fill="blue"] { fill: var(--blue); }
[data-fill="panel"] { fill: var(--panel); }
[data-fill="red"] { fill: var(--red); }
[data-fill="green"] { fill: var(--green); }
[data-fill="amber"] { fill: var(--amber); }
[data-stroke="paper"] { stroke: var(--paper); }
[data-stroke="ink"] { stroke: var(--ink); }
[data-stroke="muted"] { stroke: var(--muted); }
[data-stroke="blue"] { stroke: var(--blue); }
[data-stroke="panel"] { stroke: var(--panel); }
[data-stroke="red"] { stroke: var(--red); }
[data-stroke="green"] { stroke: var(--green); }
[data-stroke="amber"] { stroke: var(--amber); }
</style>
  <rect class="fig-paper" width="100%" height="100%" />
  <title>비동기 2단 카운터 블록도</title>
  <rect width="742" height="230" fill="#fff" data-fill="paper" />
  <rect x="152" y="52" width="166" height="145" rx="8" fill="#e8f1ff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="panel" />
  <text class="fig-text" x="235" y="33" font-size="26" text-anchor="middle">FF<tspan baseline-shift="sub" font-size="78%">A</tspan>
  </text>
  <text class="fig-text" x="183" y="127" font-size="26" text-anchor="start">CLK</text>
  <text class="fig-text" x="176" y="173" font-size="26" text-anchor="start">T = 1</text>
  <text class="fig-text" x="298" y="85" font-size="26" text-anchor="end" data-node="A" data-node-color="blue">A</text>
  <text class="fig-text" x="298" y="173" font-size="26" text-anchor="end">A′</text>
  <path d="M152,108 l14,10 l-14,10" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" data-stroke="ink" />
  <circle cx="146" cy="118" r="6" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <rect x="440" y="52" width="166" height="145" rx="8" fill="#e8f1ff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="panel" />
  <text class="fig-text" x="523" y="33" font-size="26" text-anchor="middle">FF<tspan baseline-shift="sub" font-size="78%">B</tspan>
  </text>
  <text class="fig-text" x="471" y="127" font-size="26" text-anchor="start">CLK</text>
  <text class="fig-text" x="464" y="173" font-size="26" text-anchor="start">T = 1</text>
  <text class="fig-text" x="586" y="85" font-size="26" text-anchor="end" data-node="B" data-node-color="blue">B</text>
  <text class="fig-text" x="586" y="173" font-size="26" text-anchor="end">B′</text>
  <path d="M440,108 l14,10 l-14,10" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" data-stroke="ink" />
  <circle cx="434" cy="118" r="6" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <text class="fig-text" x="78" y="126" font-size="26" text-anchor="end">CLK</text>
  <polyline points="100,118 140,118" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="100" cy="118" r="5" />
  <polyline points="318,77 382,77 382,118 428,118" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="606,77 677,77" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="677" cy="77" r="5" data-node="B" data-node-color="blue" />
  <text class="fig-text" x="700" y="85" font-size="26" text-anchor="start" data-node="B" data-node-color="blue">B</text>
</svg>
