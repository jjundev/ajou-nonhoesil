<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>디코더와 인코더는 서로 반대 방향이에요</title><desc>디코더는 2진 코드를 한 줄만 켜진 신호로, 인코더는 한 줄만 켜진 신호를 2진 코드로 바꿔요</desc><rect width="1000" height="440" fill="#fff"/><text x="30" y="40" font-size="26" text-anchor="start" fill="#2674df" font-weight="bold">디코더 (Decoder)</text><rect x="40" y="70" width="200" height="70" rx="8" fill="#e8f1ff" stroke="#2674df" stroke-width="3"/><text x="140" y="114" font-size="22" text-anchor="middle" fill="#18212e">2진 코드  101</text><polyline points="240,105 330,105" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,85 l30,20 l-30,20 z" fill="#2674df" stroke="#2674df" stroke-width="3" stroke-linejoin="round"/><rect x="370" y="62" width="560" height="86" rx="8" fill="#fff" stroke="#18212e" stroke-width="3"/><circle cx="395" cy="94" r="20" fill="#fff" stroke="#2674df" stroke-width="3"/><text x="395" y="100" font-size="22" text-anchor="middle" fill="#18212e" font-weight="bold">0</text><text x="395" y="138" font-size="18" text-anchor="middle" fill="#6b7585">D7</text><circle cx="461" cy="94" r="20" fill="#fff" stroke="#2674df" stroke-width="3"/><text x="461" y="100" font-size="22" text-anchor="middle" fill="#18212e" font-weight="bold">0</text><text x="461" y="138" font-size="18" text-anchor="middle" fill="#6b7585">D6</text><circle cx="527" cy="94" r="20" fill="#2674df" stroke="#2674df" stroke-width="3"/><text x="527" y="100" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="527" y="138" font-size="18" text-anchor="middle" fill="#6b7585">D5</text><circle cx="593" cy="94" r="20" fill="#fff" stroke="#2674df" stroke-width="3"/><text x="593" y="100" font-size="22" text-anchor="middle" fill="#18212e" font-weight="bold">0</text><text x="593" y="138" font-size="18" text-anchor="middle" fill="#6b7585">D4</text><circle cx="659" cy="94" r="20" fill="#fff" stroke