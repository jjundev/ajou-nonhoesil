<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>74HC148 우선순위 인코더 블록도</title><desc>74HC148 우선순위 인코더: 입력 IN0~IN7과 EI는 Low 가 활성이고, 출력은 A2 A1 A0, GS, EO</desc><rect width="940" height="560" fill="#fff"/><rect x="400" y="60" width="190" height="400" rx="8" fill="#e8f1ff" stroke="#2674df" stroke-width="3"/><text x="495" y="46" font-size="24" text-anchor="middle" fill="#2674df" font-weight="bold">74HC148</text><polyline points="340,94 400,94" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="101" font-size="20" text-anchor="start" fill="#18212e">IN0</text><text x="334" y="88" font-size="18" text-anchor="end" fill="#6b7585">10</text><text x="330" y="120" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,134 400,134" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="141" font-size="20" text-anchor="start" fill="#18212e">IN1</text><text x="334" y="128" font-size="18" text-anchor="end" fill="#6b7585">11</text><text x="330" y="160" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,174 400,174" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="181" font-size="20" text-anchor="start" fill="#18212e">IN2</text><text x="334" y="168" font-size="18" text-anchor="end" fill="#6b7585">12</text><text x="330" y="200" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,214 400,214" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="221" font-size="20" text-anchor="start" fill="#18212e">IN3</text><text x="334" y="208" font-size="18" text-anchor="end" fill="#6b7585">13</text><text x="330" y="240" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,254 400,254" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="261" font-size="20" text-anchor="start" fill="#18212e">IN4</text><text x="334" y="248" font-size="18" text-anchor="end" fill="#6b7585">1</text><text x="330" y="280" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,294 400,294" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="301" font-size="20" text-anchor="start" fill="#18212e">IN5</text><text x="334" y="288" font-size="18" text-anchor="end" fill="#6b7585">2</text><text x="330" y="320" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,334 400,334" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="341" font-size="20" text-anchor="start" fill="#18212e">IN6</text><text x="334" y="328" font-size="18" text-anchor="end" fill="#6b7585">3</text><text x="330" y="360" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,374 400,374" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="381" font-size="20" text-anchor="start" fill="#18212e">IN7</text><text x="334" y="368" font-size="18" text-anchor="end" fill="#6b7585">4</text><text x="330" y="400" font-size="1" text-anchor="start" fill="#18212e"></text><polyline points="340,420 400,420" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="427" font-size="20" text-anchor="start" fill="#18212e">EI</text><text x="334" y="414" font-size="18" text-anchor="end" fill="#6b7585">5</text><polyline points="590,130 670,130" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="137" font-size="20" text-anchor="end" fill="#18212e">A0</text><text x="604" y="124" font-size="18" text-anchor="start" fill="#6b7585">9</text><text x="686" y="137" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">A0</text><polyline points="590,190 670,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="197" font-size="20" text-anchor="end" fill="#18212e">A1</text><text x="604" y="184" font-size="18" text-anchor="start" fill="#6b7585">7</text><text x="686" y="197" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">A1</text><polyline points="590,250 670,250" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="257" font-size="20" text-anchor="end" fill="#18212e">A2</text><text x="604" y="244" font-size="18" text-anchor="start" fill="#6b7585">6</text><text x="686" y="257" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">A2</text><polyline points="590,310 670,310" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="317" font-size="20" text-anchor="end" fill="#18212e">GS</text><text x="604" y="304" font-size="18" text-anchor="start" fill="#6b7585">14</text><text x="686" y="317" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">GS</text><polyline points="590,370 670,370" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="578" y="377" font-size="20" text-anchor="end" fill="#18212e">EO</text><text x="604" y="364" font-size="18" text-anchor="start" fill="#6b7585">15</text><text x="686" y="377" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">EO</text><text x="30" y="40" font-size="20" text-anchor="start" fill="#6b7585">입력(왼쪽)과 EI 는 Low(0)일 때 활성</text><text x="686" y="36" font-size="20" text-anchor="start" fill="#6b7585">출력(오른쪽)</text><text x="30" y="535" font-size="20" text-anchor="start" fill="#6b7585">숫자는 칩의 핀 번호예요</text></svg>