<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문제집</title>
<link rel="stylesheet" href="assets/vendor/pretendard/pretendard.css">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<script defer src="assets/vendor/katex/katex.min.js"></script>

<style>
/* ==========================================================================
   문제집 템플릿 (문제 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 1–3절(토큰, 쪽 틀, 헤더)은 답안지
   템플릿과 같이 쓰는 부분이다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 10pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 원문 ↔ 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 6.5pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 15pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 9pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 10pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 7.5pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 50mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문(영어): 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* Hint 띠 (별도 Hint 쪽 없음) */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 9pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 7.5pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-math { display: flex; flex-direction: column; gap: .8mm; min-width: 0; }
.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 표: 격자선, 머리행 강조. 원문 표의 빈 칸은 태블릿 펜으로 쓸 높이(7mm)를 갖는다 */
#book table { border-collapse: collapse; width: 100%; margin: 1mm 0; }
#book th, #book td {
  border: .3mm solid var(--ink); padding: 1.2mm 1.2mm; text-align: center;
  overflow-wrap: break-word; word-break: keep-all; line-height: 1.3;
}
#book th { font-weight: 700; background: var(--paper); }
#book .original td { height: 7mm; }

/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 9.5pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 9pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.5pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 8.5pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}
</style>

D는 D7…D0 여덟 비트이고, 각 행에서 한 비트만 1이에요. 출력은 A2A1A0예요.\u003c/p>", "ask": "\u003cp>나머지 일곱 행의 A2A1A0를 채우세요.\u003c/p>"}, "figures": [], "hints": [{"label": "1의 위치", "html": "\u003cp>각 행에서 1이 있는 자리의 번호를 먼저 찾아요. 오른쪽 끝이 D0이에요.\u003c/p>"}]}, {"id": "q-prio-exam", "kind": "기출", "number": "3", "title": "8×3 우선순위 인코더 — 여러 비트가 켜진 입력", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>8X3 Priority Encoder의 Truth table을 완성하시오\u003c/p>\u003cp>Fill in the blanks of the 3x8 priority decoder.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>D\u003c/th>\u003cth>A2\u003c/th>\u003cth>A1\u003c/th>\u003cth>A0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0000 0001\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0011 1010\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0101 1110\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0001 1101\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0110 0100\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1111 1111\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>(원문 표의 첫 행은 이미 채워져 있어요.)\u003c/p>", "conditions": "\u003cp>D는 D7…D0 여덟 비트예요. 원문에는 우선순위 방향이 적혀 있지 않아요. 이 자료는 교안의 74HC148 표처럼 번호가 큰 입력이 우선이라고 읽어요. 영어 문장은 3x8 priority decoder라고 쓰여 있지만 한국어 문장과 표는 8×3 우선순위 인코더예요.\u003c/p>", "ask": "\u003cp>나머지 다섯 행의 A2A1A0를 채우세요.\u003c/p>"}, "figures": [], "hints": [{"label": "먼저 볼 비트", "html": "\u003cp>여러 비트가 1이에요. 왼쪽(D7 쪽)부터 처음으로 1이 나오는 자리를 찾아요.\u003c/p>"}]}, {"id": "q-dec2x4-design", "kind": "기출", "number": "4", "title": "2×4 디코더의 게이트 설계", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>2x4 Decoder의 회로를 설계하시오.(Not gate 2개, 2-input And gate 4개)\u003c/p>\u003cp>Design a circuit diagram of 2x4 decoder. (2 NOT gates, 4 2-input AND gates)\u003c/p>", "conditions": "\u003cp>입력은 I1, I0 두 개, 출력은 O0~O3 네 개예요. 출력 Ok는 I1I0가 k를 이진수로 쓴 값일 때만 1이에요.\u003c/p>", "ask": "\u003cp>NOT 2개와 2입력 AND 4개로 회로를 그리고 논리식을 쓰세요.\u003c/p>"}, "figures": [], "hints": [{"label": "출력마다 한 조합", "html": "\u003cp>네 출력이 각각 입력 조합 하나만 1로 만들어야 해요. 조합마다 I1과 I0 중 어느 쪽에 NOT을 붙일지 정해 보세요.\u003c/p>"}]}, {"id": "q-enc4x2-design", "kind": "기출", "number": "5", "title": "4×2 인코더의 NAND 설계", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>4x2 Encoder의 회로를 설계하시오.(Not gate 4개, 4-input nand gate 3개, 2-input nand gate 2개)\u003c/p>\u003cp>Design a circuit diagram of 2x4 Encoder. (4 NOT gates, 3 4-input NAND gates, 2 2-input NAND gates)\u003c/p>", "conditions": "\u003cp>입력 D0~D3 중 한 줄만 1이라고 가정하고, 출력은 상위 비트 A와 하위 비트 B로 두어요. 영어 문장은 2x4라고 쓰였지만 한국어 문장과 게이트 수에 맞춰 4×2 인코더로 읽어요.\u003c/p>", "ask": "\u003cp>주어진 게이트 수로 회로를 그리고 A, B의 논리식을 쓰세요.\u003c/p>"}, "figures": [], "hints": [{"label": "식부터", "html": "\u003cp>D0~D3의 번호 0~3을 이진수로 쓰고, A와 B가 1이 되는 번호를 찾으세요. 그다음 NAND 두 단계가 OR을 만든다는 점을 떠올려요.\u003c/p>"}]}, {"id": "q-excess3-why", "kind": "기출", "number": "6", "title": "Excess-3 코드의 특징과 사용 이유", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Excess-3 코드의 특징과 사용이유에 대해서 설명하시오.\u003c/p>\u003cp>Describe the characteristics of Excess-3 code. And explain the reason why the Excess-3 code is used.\u003c/p>", "conditions": "", "ask": "\u003cp>Excess-3 코드가 무엇인지, 어떤 특징이 있어 왜 쓰는지 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "비교할 것", "html": "\u003cp>BCD와 비교하세요. 각 코드에 더해진 값이 무엇이고, 비트를 뒤집으면 어떤 수가 되는지 몇 개만 계산해 보세요.\u003c/p>"}]}, {"id": "q-excess3-enc-exam", "kind": "기출", "number": "7", "title": "Excess-3 인코더 회로의 진리표(네 행)", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>10진 Excess 3코드 Encoder의 회로를 보고 Truth table을 완성하시오.()\u003c/p>\u003cp>Referring to the circuit diagram below (decimal excess-3 code encoder), fill in the blanks of the truth table.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SW\u003c/th>\u003cth>Bit3\u003c/th>\u003cth>Bit2\u003c/th>\u003cth>Bit1\u003c/th>\u003cth>Bit0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>000001\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>000100\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>010000\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100000\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "conditions": "\u003cp>회로는 아래 그림과 같아요. SW5~SW0은 십진수 5~0을 나타내는 스위치이고 NOT 6개와 4입력 NAND 4개(74HC20)로 되어 있어요. 스위치를 VCC에 연결하면 그 입력은 1, 아니면 0이에요. 표의 SW 열은 왼쪽부터 SW5, SW4, …, SW0의 값이에요. NAND의 남는 입력은 VCC에 연결돼 있어요.\u003c/p>", "ask": "\u003cp>표의 Bit3~Bit0 값을 채우세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-excess3-enc-exam-given-01.png", "w_mm": 150.0, "h_mm": 81.696}], "hints": [{"label": "식으로 바꾸기", "html": "\u003cp>NAND 앞의 NOT과 드모르간 법칙을 이용하면 각 Bit가 어떤 스위치들의 OR인지 알 수 있어요. 한 스위치만 1인 행에서는 그 스위치가 들어간 Bit만 1이에요.\u003c/p>"}]}, {"id": "q-excess3-enc-6row", "kind": "예상문제", "number": "8", "title": "Excess-3 인코더 회로의 진리표(여섯 행)", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>10진 Excess 3코드 Encoder의 회로를 보고 Truth table을 완성하시오.()\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>SW\u003c/th>\u003cth>Bit3\u003c/th>\u003cth>Bit2\u003c/th>\u003cth>Bit1\u003c/th>\u003cth>Bit0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>000001\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>000010\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>000100\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>001000\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>010000\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100000\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "conditions": "\u003cp>회로는 아래 그림과 같아요. SW5~SW0은 십진수 5~0을 나타내는 스위치이고 NOT 6개와 4입력 NAND 4개(74HC20)로 되어 있어요. 스위치를 VCC에 연결하면 그 입력은 1, 아니면 0이에요. 표의 SW 열은 왼쪽부터 SW5, SW4, …, SW0의 값이에요. NAND의 남는 입력은 VCC에 연결돼 있어요.\u003c/p>", "ask": "\u003cp>표의 Bit3~Bit0 값을 채우세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-excess3-enc-6row-given-01.png", "w_mm": 150.0, "h_mm": 81.696}], "hints": [{"label": "식으로 바꾸기", "html": "\u003cp>NAND 앞의 NOT과 드모르간 법칙을 이용하면 각 Bit가 어떤 스위치들의 OR인지 알 수 있어요. 한 스위치만 1인 행에서는 그 스위치가 들어간 Bit만 1이에요.\u003c/p>"}]}, {"id": "q-1of4-excess3", "kind": "출처 미확인", "number": "9", "title": "1-out-of-4 코드를 Excess-3로 변환", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 1-out-of-4 코드를 Excess-3 코드로 변환 하시오.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>D0D1D2D3\u003c/th>\u003cth>\u003c/th>\u003cth>Excess-3\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1000\u003c/td>\u003ctd>->\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0100\u003c/td>\u003ctd>->\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0010\u003c/td>\u003ctd>->\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "conditions": "\u003cp>1-out-of-4 코드는 네 비트 중 한 비트만 1인 코드(one-hot)예요. D0D1D2D3에서 왼쪽이 D0이고, 1이 있는 자리의 번호가 십진수 0~3을 뜻해요.\u003c/p>", "ask": "\u003cp>세 행을 Excess-3 코드(4비트)로 바꾸세요.\u003c/p>"}, "figures": [], "hints": [{"label": "번호 먼저", "html": "\u003cp>각 행에서 1이 몇 번째 자리(D0부터)인지 십진수로 바꾼 다음, Excess-3 코드의 정의를 적용하세요.\u003c/p>"}]}, {"id": "q-prio-vs-binary", "kind": "기출", "number": "10", "title": "우선순위 인코더와 Binary 인코더의 비교", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Priority encoder의 특징을 Binary encoder와 비교하여 설명하시오.\u003c/p>", "conditions": "", "ask": "\u003cp>여러 입력이 동시에 1일 때 두 인코더의 출력이 어떻게 다른지 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "동시 입력", "html": "\u003cp>입력 두 개가 동시에 1인 경우를 하나 정해 두 인코더에 각각 넣어 보세요.\u003c/p>"}]}, {"id": "q-demux-from-dec", "kind": "출처 미확인", "number": "11", "title": "디코더 회로로 1 to 4 디멀티플렉서 만들기", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래의 2 to 4 Decoder의 Gate 회로를 활용하여 1 to 4 Demultiplexer의 Gate회로를 작성하시오.\u003c/p>", "conditions": "\u003cp>그림은 선택 입력 S0, S1과 NOT 2개, 2입력 AND 4개로 이루어진 2 to 4 디코더 게이트 회로예요. 출력 네 줄에는 이름이 없어요.\u003c/p>", "ask": "\u003cp>데이터 입력 D를 추가해 1 to 4 디멀티플렉서의 게이트 회로를 그리고 출력 식을 쓰세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-demux-from-dec-given-01.png", "w_mm": 150.0, "h_mm": 104.651}], "hints": [{"label": "바꿀 곳", "html": "\u003cp>디코더의 출력은 선택된 한 줄만 1이에요. 그 1 대신 데이터 D가 나오게 하려면 각 AND에 무엇을 더해야 할지 생각하세요.\u003c/p>"}]}, {"id": "q-demux-from-dec-graded", "kind": "기출", "number": "12", "title": "디코더로 DMUX 만들기와 두 회로의 차이", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>2. 아래의 2 to 4 Decoder의 Gate 회로를 활용하여 1 to 4 Demultiplexer의 Gate회로를 작성하시오.(2점.)\u003c/p>\u003cp>두 회로 간에 어떠한 차이가 있는가?(2점.) (총 4점)\u003c/p>", "conditions": "\u003cp>원문의 회로 그림은 채점 표시가 섞여 있어 이 문제지에는 싣지 않았어요. 그림은 선택 입력 S0, S1과 NOT 2개, 2입력 AND 4개로 이루어진 2 to 4 디코더 게이트 회로예요.\u003c/p>", "ask": "\u003cp>(1) 디코더 회로를 활용해 1 to 4 디멀티플렉서 회로를 작성하세요. (2) 두 회로 사이의 차이를 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "차이를 볼 곳", "html": "\u003cp>두 회로의 입력 신호 종류와 개수, AND 게이트의 입력 수, 출력이 켜지는 조건을 각각 비교해 보세요.\u003c/p>"}]}, {"id": "q-74hc148-table", "kind": "출처 미확인", "number": "13", "title": "74HC148 우선순위 인코더의 진리표", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>아래 회로는 74HC148을 활용하여 설계한 8x3 Priority Encoder 이다. 아래의 Table을 완성하시오.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>E1\u003c/th>\u003cth>0\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003cth>7\u003c/th>\u003cth>A2\u003c/th>\u003cth>A1\u003c/th>\u003cth>A0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003ctd>H\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>H\u003c/td>\u003ctd>L\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>(원문 표의 첫 행은 출력까지 이미 채워져 있어요. 표 머리 input은 E1, 0~7, output은 A2 A1 A0예요.)\u003c/p>", "conditions": "\u003cp>스위치 두 개가 IN0~IN7을 짝수 번호끼리, 홀수 번호끼리 묶어 구동하고, EI(표의 E1)는 GND에 연결돼 있어요. 74HC148은 입력, EI, 출력이 모두 Low가 활성인 칩이에요. 번호가 큰 입력이 우선이에요(교안 p11).\u003c/p>", "ask": "\u003cp>둘째 행과 셋째 행의 A2 A1 A0를 H 또는 L로 채우세요.\u003c/p>"}, "figures": [{"src": "figures/questions/q-74hc148-table-given-01.png", "w_mm": 150.0, "h_mm": 90.625}], "hints": [{"label": "세 단계", "html": "\u003cp>Low인 입력을 모두 찾고, 그중 번호가 가장 큰 입력을 고른 다음, 그 번호를 이진수로 쓴 뒤 비트를 뒤집어 H/L로 바꿔요.\u003c/p>"}]}, {"id": "q-quiz-dec2x4-table", "kind": "출처 미확인", "number": "14", "title": "2×4 디코더 회로의 진리표", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>1. 2X4 Decoder의 회로를 보고 Truth table을 완성하시오.\u003c/p>", "conditions": "\u003cp>원문 회로 그림은 해설이 같은 쪽에 섞여 있어 이 문제지에는 싣지 않고 글로 옮겼어요. 스위치 SW1(= bit0)과 SW2(= bit1)가 입력이고, 스위치를 VCC에 연결하면 1이에요. U1A(74HC04)는 SW1을, U1B는 SW2를 반전해요. 네 AND(74HC08)의 출력은 저항 330Ω을 거쳐 LED D1~D4에 연결돼 있고, 출력이 1이면 해당 LED가 켜져요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>게이트\u003c/th>\u003cth>입력 1\u003c/th>\u003cth>입력 2\u003c/th>\u003cth>출력\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>U2A (74HC08)\u003c/td>\u003ctd>SW1\u003c/td>\u003ctd>SW2\u003c/td>\u003ctd>D1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>U2B\u003c/td>\u003ctd>U1A 출력 (SW1 반전)\u003c/td>\u003ctd>SW2\u003c/td>\u003ctd>D2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>U2C\u003c/td>\u003ctd>SW1\u003c/td>\u003ctd>U1B 출력 (SW2 반전)\u003c/td>\u003ctd>D3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>U2D\u003c/td>\u003ctd>U1A 출력\u003c/td>\u003ctd>U1B 출력\u003c/td>\u003ctd>D4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "ask": "\u003cp>bit0, bit1의 네 가지 조합마다 D1~D4의 값을 채우세요. (표의 입력은 bit0, bit1 순서로 00, 10, 01, 11이에요.)\u003c/p>"}, "figures": [], "hints": [{"label": "출력별 식", "html": "\u003cp>먼저 D1~D4 각각이 bit0와 bit1의 어떤 AND인지 식으로 쓰세요. 그다음 입력 조합을 하나씩 넣어요.\u003c/p>"}]}, {"id": "q-sa-decoder-def", "kind": "출처 미확인", "number": "15", "title": "Decoder를 설명", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Decoder에 대해서 설명하시오.\u003c/p>", "conditions": "", "ask": "\u003cp>디코더가 무엇인지 입력과 출력을 포함해 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "담을 내용", "html": "\u003cp>입력 비트 수와 출력 개수의 관계, 그리고 출력 중 몇 개가 활성화되는지를 써요.\u003c/p>"}]}, {"id": "q-sa-encoder-def", "kind": "출처 미확인", "number": "16", "title": "Encoder를 설명", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Encoder에 대해서 설명하시오.\u003c/p>", "conditions": "", "ask": "\u003cp>인코더가 무엇인지 입력과 출력을 포함해 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "담을 내용", "html": "\u003cp>디코더와 반대 방향이라는 점과 입력 개수와 출력 비트 수의 관계를 써요.\u003c/p>"}]}, {"id": "q-sa-enc8x3", "kind": "출처 미확인", "number": "17", "title": "8×3 인코더 진리표", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>8X3 Encoder 진리표작성\u003c/p>", "conditions": "\u003cp>입력 D7~D0 중 한 줄만 1이라고 가정해요. 출력은 A2A1A0예요.\u003c/p>", "ask": "\u003cp>입력 여덟 가지에 대한 진리표를 작성하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "행 만들기", "html": "\u003cp>행마다 D0부터 D7까지 한 줄씩 1로 두고, 그 번호를 이진수로 바꿔 출력에 써요.\u003c/p>"}]}, {"id": "q-sa-prio-why", "kind": "출처 미확인", "number": "18", "title": "Priority Encoder의 사용 이유", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>Priority Encoder에 대해서 설명하시오(사용이유)\u003c/p>", "conditions": "", "ask": "\u003cp>우선순위 인코더를 왜 쓰는지 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "문제 상황", "html": "\u003cp>일반 인코더에 입력 두 개가 동시에 들어오면 어떤 코드가 나오는지 하나만 계산해 보세요.\u003c/p>"}]}, {"id": "q-sa-74hc143", "kind": "출처 미확인", "number": "19", "title": "우선순위 인코더 IC의 출력 핀", "section": "실험 5 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>74HC143은 Priority Encoder이다. 각 Output port A0, A1, A2, GS, EO에 대해서 설명하시오.\u003c/p>", "conditions": "\u003cp>원문은 칩 이름을 74HC143으로 적었어요. 교안에서 쓰는 우선순위 인코더 IC는 74HC148이고, 핀 이름 A0~A2, GS, EO가 같아서 74HC148의 핀으로 읽어요.\u003c/p>", "ask": "\u003cp>다섯 출력 핀의 역할을 각각 설명하세요.\u003c/p>"}, "figures": [], "hints": [{"label": "나눠 보기", "html": "\u003cp>A0~A2는 하나의 묶음이에요. GS와 EO는 각각 “입력이 있나”와 “다음 칩에 넘길 enable”과 관련이 있어요.\u003c/p>"}]}]}</script>
<main id="book"></main>
<script>
'use strict';

// 생성기가 문자열 치환으로 바꾸는 자리표시자. 여기서 이어 붙여 두어 치환 대상이 되지 않게 한다.
const PLACEHOLDER = '__WORKBOOK' + '_DATA__';
const KIND_SLUG = { '예제': 'example', '연습문제': 'exercise', '장말문제': 'problem', '기출': 'exam' };
const FIG_SCALE_CAP = 1.5;        // 교재 인쇄 크기 대비 확대 상한
const MATH_MIN_SCALE = 0.7;
const STRIP_MATH_MIN_SCALE = 0.5;  // Hint 띠 속 식은 띠 폭에 맞춰 더 줄일 수 있음
// 쪽 맞춤 순서: 폭 → 글자. 앞 단계 값은 유지한 채 다음 단계로 간다.
const FIT_STEPS = [
  ['--pw', '40%'], ['--pw', '50%'],
  ['--fs', '0.9'], ['--fs', '0.8'],
];
const PAGE_W_PX = 297 * 96 / 25.4;

const book = document.getElementById('book');

/* ---------- 작은 도우미 ---------- */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function txt(tag, cls, text) {
  const e = el(tag, cls);
  e.textContent = text;
  return e;
}
const kindSlug = kind => KIND_SLUG[kind] || 'problem';

async function loadData() {
  const q = new URLSearchParams(location.search).get('data');
  const raw = document.getElementById('workbook-data').textContent.trim();
  const url = q || (raw === PLACEHOLDER ? 'sample.json' : null);
  if (!url) return JSON.parse(raw);
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  renderMathInElement(root, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
    ],
    throwOnError: false,
    fleqn: true,
  });
}

/* ---------- 등식 줄바꿈 ---------- */
// 긴 등식(=, ≈ 등이 있고 EQ_SPLIT_LEN자보다 긴 식)만 한 줄을 따로 차지하는 display 식으로 바꾸고,
// 관계 기호마다 줄을 바꿔 세로로 맞춘다. 짧은 식은 문장 속에 그대로 둔다.
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
const REL_RE = /^(?:=|\\(?:approx|Rightarrow|leq?|geq?)(?![a-zA-Z]))/;
const EQ_SPLIT_LEN = 40;

// 중괄호·\left…\right 바깥의 관계 기호에서 나눈다: [lhs, [rel, rhs], …]
function splitRelations(tex) {
  const parts = [];
  let depth = 0, start = 0, rel = null;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (depth === 0) {
      const m = (c === '=' || c === '\\') && REL_RE.exec(tex.slice(i));
      if (m) {
        parts.push(rel ? [rel, tex.slice(start, i).trim()] : tex.slice(start, i).trim());
        rel = m[0]; i += m[0].length - 1; start = i + 1;
        continue;
      }
    }
    if (c === '{') depth++;
    else if (c === '}') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    }
  }
  if (!rel) return null;
  parts.push([rel, tex.slice(start).trim()]);
  return parts;
}

function equationTex(tex, parts, prefix) {
  const [lhs, ...rest] = parts;
  if (!lhs) return prefix + tex;
  const lines = rest.map(([rel, rhs], i) => `${i ? '' : prefix + lhs} &amp;${rel} ${rhs}`);
  return `\\begin{aligned}${lines.join(' \\\\ ')}\\end{aligned}`;
}

function breakEquations(html) {
  if (!html) return html;
  const toks = [];
  let last = 0;
  for (const m of html.matchAll(MATH_RE)) {
    toks.push({ text: html.slice(last, m.index) });
    const tex = (m[1] ?? m[2]).trim();
    const parts = tex.length > EQ_SPLIT_LEN ? splitRelations(tex) : null;
    toks.push({ tex, parts, display: !!m[1] || !!parts, prefix: '' });
    last = m.index + m[0].length;
  }
  if (!toks.length) return html;
  toks.push({ text: html.slice(last) });

  // 줄로 나뉜 식 사이에 남는 쉼표는 지우고, 식 사이의 → 는 다음 식 앞으로 옮긴다
  toks.forEach((t, k) => {
    if (t.text == null) return;
    const prev = toks[k - 1], next = toks[k + 1];
    const pd = prev && prev.display, nd = next && next.display;
    if (pd && nd && /^\s*(→|⇒)\s*$/.test(t.text)) { t.text = ''; next.prefix = '\\Rightarrow\\ '; return; }
    if (pd) t.text = t.text.replace(/^\s*[,，]\s*/, '');
    if (nd) t.text = t.text.replace(/\s*[,，]\s*$/, ' ');
    if (pd && nd && !t.text.trim()) t.text = '';
  });

  return toks.map(t => {
    if (t.text != null) return t.text;
    if (!t.display) return `$${t.tex}$`;
    return `$$${t.parts ? equationTex(t.tex, t.parts, t.prefix) : t.prefix + t.tex}$$`;
  }).join('');
}

// display 식이 칸보다 넓으면 그 식만 줄인다 (최소 70%)
function fitDisplayMath(root) {
  for (const d of root.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    k.style.transform = '';
    const avail = d.clientWidth, need = k.scrollWidth;
    if (need > avail + 1) {
      k.style.transformOrigin = 'left center';
      k.style.transform = `scale(${Math.max(MATH_MIN_SCALE, avail / need)})`;
    }
  }
}

function nextLayout() {
  void book.offsetHeight;          // 레이아웃을 돌려 새 글꼴(KaTeX 등) 로드를 시작시킴
  return document.fonts.ready;
}

/* ---------- 쪽 틀과 헤더 (공용) ---------- */
function makePage(kind, cls) {
  const page = el('section', `page ${cls}`);
  page.dataset.kind = kind;
  const head = el('header', 'page-head');
  const body = el('div', 'page-body');
  page.append(head, body);
  return { page, head, body };
}

function problemHead(p, n, total) {
  const frag = document.createDocumentFragment();
  const lead = el('div', 'head-lead');
  lead.append(txt('span', 'kind-badge', p.kind), txt('span', 'head-num', p.number));
  if (p.difficulty > 0) lead.append(txt('span', 'head-stars', '★'.repeat(p.difficulty)));
  if (p.sol) lead.append(txt('span', 'sol-tag', 'SOL'));

  const h2 = el('h2', 'page-title');
  h2.append(txt('span', 'sr', `${p.kind} ${p.number} — `), document.createTextNode(p.title));

  const meta = el('div', 'head-meta');
  const info = [p.section, p.book_page != null ? `p.${p.book_page}` : '', `${n} / ${total}`];
  meta.append(txt('span', 'head-info', info.filter(Boolean).join(' · ')));

  frag.append(lead, h2, meta);
  return frag;
}

/* ---------- 문제 쪽 ---------- */
function figureImg(f) {
  const img = el('img', 'fig');
  img.src = f.src;
  img.alt = '';
  img.width = Math.round(f.w_mm * 10);
  img.height = Math.round(f.h_mm * 10);
  img.style.setProperty('--w-cap', `${f.w_mm * FIG_SCALE_CAP}mm`);
  img.style.setProperty('--ratio', f.w_mm / f.h_mm);
  return img;
}

function block(label, html, cls, lang) {
  const b = el('section', 'block');
  const body = el('div', `prose ${cls}`, breakEquations(html));
  if (lang) body.lang = lang;
  b.append(txt('div', 'block-label', label), body);
  return b;
}

function hintStrip(p) {
  const a = el('div', 'hint-strip');
  a.append(txt('div', 'hint-strip-label', 'Hint'));
  const ol = el('ol', 'hint-strip-list');
  p.hints.forEach((h, i) => {
    const li = el('li', 'hint-strip-item');
    li.dataset.n = i + 1;
    if (h.formula) {                // 식 하나 또는 여러 줄(배열). 한 칸에 모아 grid 첫 칸으로 새지 않게
      const box = el('span', 'hint-strip-math');
      [].concat(h.formula).forEach(t => box.append(stripFormula(t)));
      li.append(box);
    }
    else li.append(el('span', 'hint-strip-text', h.label));   // 이름표 속 KaTeX가 grid 칸으로 흩어지지 않게
    ol.append(li);
  });
  a.append(ol);
  return a;
}

// 'formula'(구분자 없는 LaTeX, 여러 줄이면 배열)가 있으면 띠에는 이름표 대신 식을 보인다
function stripFormula(tex) {
  const span = el('span', 'hint-strip-formula');
  if (typeof katex !== 'undefined') katex.render(tex, span, { throwOnError: false });
  else span.textContent = tex;
  return span;
}

function fitStripFormulas(page) {
  for (const f of page.querySelectorAll('.hint-strip-formula')) {
    f.style.transform = '';
    const avail = f.clientWidth, need = f.scrollWidth;
    if (need > avail + 1) f.style.transform = `scale(${Math.max(STRIP_MATH_MIN_SCALE, avail / need)})`;
  }
}

function problemPage(p, n, total) {
  const { page, head, body } = makePage(kindSlug(p.kind), 'page--problem');
  page.id = p.id;
  head.append(problemHead(p, n, total));

  const row = el('div', 'page-row');
  const panel = el('div', 'panel');
  if (p.html.original) panel.append(block('문제 원문', p.html.original, 'original', p.original_lang || 'en'));   // 원문은 맨 처음
  if (p.html.conditions && p.html.conditions.trim()) panel.append(block('조건', p.html.conditions, 'conditions'));   // 조건이 없으면 라벨도 없다
  panel.append(block('구할 것', p.html.ask, 'ask-box'));
  const center = el('div', 'page-center');
  const figs = p.figures || [];
  if (figs.length) {
    const band = el('div', 'fig-band');
    figs.forEach(f => band.append(figureImg(f)));
    center.append(band);
  }
  center.append(el('div', 'work'));
  row.append(panel, center);
  if (p.hints && p.hints.length) {
    row.classList.add('has-strip');
    if (p.hints.some(h => h.formula)) row.classList.add('has-formula');
    row.append(hintStrip(p));
  }
  body.append(row);
  return page;
}

// 6.5 쪽 맞춤. 들어가면 멈추고, 끝까지 넘치면 false.
function fitProblemPage(page) {
  const panel = page.querySelector('.panel');
  const fits = () => panel.scrollHeight <= panel.clientHeight + 1;
  const state = { pw: '33%', fs: '1' };
  for (const [prop, val] of FIT_STEPS) {
    if (fits()) break;
    panel.style.setProperty(prop, val);
    state[{ '--pw': 'pw', '--fs': 'fs' }[prop]] = val;
  }
  page.dataset.fit = `pw=${state.pw} fs=${state.fs}`;
  fitDisplayMath(panel);
  fitStripFormulas(page);
  const ok = fits();
  if (!ok) page.dataset.overflow = '';
  return ok;
}

/* ---------- 화면 배율 ---------- */
function applyZoom(z) {
  for (const page of book.querySelectorAll(':scope > .page')) page.style.zoom = z;
}
const screenZoom = () => applyZoom(Math.min(1, (innerWidth - 32) / PAGE_W_PX));

/* ---------- 실행 (6.9) ---------- */
async function main() {
  try {
    const data = await loadData();
    const { meta, problems } = data;
    document.title = meta.title;

    // DOM 생성
    const total = meta.total || problems.length;
    problems.forEach((p, i) => book.append(problemPage(p, i + 1, total)));

    // 글꼴 + 그림 → KaTeX (수식 글꼴도 다 받은 뒤 잰다)
    await Promise.all([nextLayout(), ...[...document.images].map(img => img.decode().catch(() => {}))]);
    renderMath(book);
    await nextLayout();

    const overflow = [];
    for (const page of book.querySelectorAll('.page--problem')) {
      if (!fitProblemPage(page)) overflow.push(page.id);
    }

    document.body.dataset.overflow = overflow.join(',');
    document.documentElement.dataset.ready = 'true';
  } catch (err) {
    console.error(err);
    book.append(txt('p', 'load-error', `문제 데이터를 읽지 못했습니다: ${err.message}`));
    document.body.dataset.overflow = '';
    document.documentElement.dataset.ready = 'error';
    return;
  }

  // 배율은 쪽 맞춤이 끝난 뒤에만
  screenZoom();
  addEventListener('resize', screenZoom);
  addEventListener('beforeprint', () => applyZoom(''));
  addEventListener('afterprint', screenZoom);
}

addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>
