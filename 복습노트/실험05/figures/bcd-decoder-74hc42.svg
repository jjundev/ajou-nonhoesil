<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>BCD → 십진 디코더 (74HC42) + 출력 LED</title><desc>스위치 네 개가 74HC42의 A B C D 입력을 정하고, Low 가 활성인 출력 Y0~Y9에 LED를 VCC 쪽으로 달아요</desc><rect width="980" height="640" fill="#fff"/><rect x="330" y="50" width="190" height="520" rx="8" fill="#e8f1ff" stroke="#2674df" stroke-width="3"/><text x="425" y="318" font-size="26" text-anchor="middle" fill="#2674df" font-weight="bold">74HC42</text><polyline points="240,120 330,120" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="128" font-size="22" text-anchor="start" fill="#18212e">A</text><text x="230" y="128" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Bit0</text><polyline points="240,220 330,220" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="228" font-size="22" text-anchor="start" fill="#18212e">B</text><text x="230" y="228" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Bit1</text><polyline points="240,320 330,320" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="328" font-size="22" text-anchor="start" fill="#18212e">C</text><text x="230" y="328" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Bit2</text><polyline points="240,420 330,420" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="428" font-size="22" text-anchor="start" fill="#18212e">D</text><text x="230" y="428" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Bit3</text><polyline points="520,84 580,84" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="91" font-size="20" text-anchor="end" fill="#18212e">Y0</text><circle cx="526" cy="84" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,133 580,133" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="140" font-size="20" text-anchor="end" fill="#18212e">Y1</text><circle cx="526" cy="133" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,182 580,182" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="189" font-size="20" text-anchor="end" fill="#18212e">Y2</text><circle cx="526" cy="182" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,231 580,231" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="238" font-size="20" text-anchor="end" fill="#18212e">Y3</text><circle cx="526" cy="231" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,280 580,280" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="287" font-size="20" text-anchor="end" fill="#18212e">Y4</text><circle cx="526" cy="280" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,329 580,329" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="336" font-size="20" text-anchor="end" fill="#18212e">Y5</text><circle cx="526" cy="329" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,378 580,378" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="385" font-size="20" text-anchor="end" fill="#18212e">Y6</text><circle cx="526" cy="378" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,427 580,427" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="434" font-size="20" text-anchor="end" fill="#18212e">Y7</text><circle cx="526" cy="427" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,476 580,476" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="483" font-size="20" text-anchor="end" fill="#18212e">Y8</text><circle cx="526" cy="476" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="520,525 580,525" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="532" font-size="20" text-anchor="end" fill="#18212e">Y9</text><circle cx="526" cy="525" r="6" fill="#fff" stroke="#18212e" stroke-width="3"/><text x="30" y="40" font-size="20" text-anchor="start" fill="#6b7585">입력 (BCD 4비트)</text><text x="540" y="36" font-size="20" text-anchor="start" fill="#6b7585">출력 (Low 가 활성)</text><text x="620" y="100" font-size="20" text-anchor="start" fill="#6b7585">출력 한 줄의 LED 연결</text><polyline points="620,180 660,180" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="620" y="166" font-size="20" text-anchor="start" fill="#18212e">Yk</text><path d="M660,180 l8,-12 l12,24 l12,-24 l12,24 l8,-12" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><text x="682" y="220" font-size="20" text-anchor="middle" fill="#6b7585">330Ω</text><polyline points="712,180 750,180" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M776,164 L776,196 L750,180 Z" fill="#e8f1ff" stroke="#2674df" stroke-width="3" stroke-linejoin="round"/><polyline points="750,164 750,196" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="776,180 810,180" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="810" y="166" font-size="20" text-anchor="start" fill="#18212e">VCC</text><text x="620" y="270" font-size="20" text-anchor="start" fill="#18212e">Yk 가 Low(0)이면 전류가</text><text x="620" y="298" font-size="20" text-anchor="start" fill="#18212e">VCC → LED → 저항 → Yk 로 흘러</text><text x="620" y="326" font-size="20" text-anchor="start" fill="#18212e">LED 가 켜져요</text></svg>