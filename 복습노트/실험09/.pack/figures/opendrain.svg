  <polyline points="104,327 124,327" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="110,335 118,335" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <text class="fig-text" x="488" y="34" font-size="26" text-anchor="middle">열린 스위치</text>
  <text class="fig-text" x="488" y="81" font-size="26" text-anchor="middle">+5 V</text>
  <circle class="fig-dot" cx="488" cy="100" r="5" />
  <polyline points="488,100 488,120" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <path d="M488,120 l-10,6 l20,12 l-20,12 l20,12 l-20,12 l10,6" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" data-stroke="ink" />
  <text class="fig-text" x="517" y="153" font-size="22" text-anchor="start">10 kΩ</text>
  <polyline points="488,180 488,244" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="488" cy="203" r="5" data-node="high" data-node-color="blue" />
  <polyline points="488,203 607,203" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="607" cy="203" r="5" data-node="high" data-node-color="blue" />
  <text class="fig-text" x="632" y="212" font-size="26" text-anchor="start" data-node="high" data-node-color="blue">OUT</text>
  <text class="fig-text" x="632" y="246" font-size="26" text-anchor="start" data-node="high" data-node-color="blue">5 V</text>
  <circle cx="488" cy="248" r="4" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <polyline points="488,252 512,285" fill="none" stroke="#18212e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle cx="488" cy="289" r="4" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <polyline points="488,293 488,319" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="472,319 504,319" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="478,327 498,327" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="484,335 492,335" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
</svg>
