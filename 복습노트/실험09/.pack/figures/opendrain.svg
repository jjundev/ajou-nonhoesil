<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 355" role="img" data-note-schematic="1">
  <style>@font-face { font-family: "Logic Lab Schematic"; font-weight: 600; font-style: normal; src: url(data:font/woff2;base64,) format("woff2"); }

:root {
  color-scheme: light dark;
  --paper: #ffffff; --ink: #18212e; --muted: #475569; --panel: #eaf2ff;
  --blue: #1658ac; --red: #ab2d20; --green: #176140; --amber: #8f4809;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151d29; --ink: #e6eef8; --muted: #bac9dc; --panel: #263951;
    --blue: #8ec5ff; --red: #ffa697; --green: #85dcb4; --amber: #ffbf7f;
  }
}
.fig-paper { fill: var(--paper); }
.fig-ink { stroke: var(--ink); }
.fig-text, .fig-dot { fill: var(--ink); }
text { font-family: "Logic Lab Schematic"; font-weight: 600; font-style: normal; }
[data-node-color="blue"] { --node: var(--blue); }
[data-node-color="red"] { --node: var(--red); }
[data-node-color] { fill: var(--node); }
.fig-crossing { stroke: var(--paper); }
[data-fill="paper"] { fill: var(--paper); }
[data-fill="ink"] { fill: var(--ink); }
[data-fill="muted"] { fill: var(--muted); }
[data-fill="blue"] { fill: var(--blue); }
[data-fill="panel"] { fill: var(--panel); }
[data-fill="red"] { fill: var(--red); }
[data-fill="green"] { fill: var(--green); }
[data-fill="amber"] { fill: var(--amber); }
[data-stroke="paper"] { stroke: var(--paper); }
[data-stroke="ink"] { stroke: var(--ink); }
[data-stroke="muted"] { stroke: var(--muted); }
[data-stroke="blue"] { stroke: var(--blue); }
[data-stroke="panel"] { stroke: var(--panel); }
[data-stroke="red"] { stroke: var(--red); }
[data-stroke="green"] { stroke: var(--green); }
[data-stroke="amber"] { stroke: var(--amber); }
</style>
  <rect class="fig-paper" width="100%" height="100%" />
  <title>열린 드레인 출력과 10kΩ 풀업</title>
  <desc>스위치가 닫히면 OUT은 0V, 열리면 저항이 OUT을 5V로 끌어올린다.</desc>
  <rect width="790" height="355" fill="#fff" data-fill="paper" />
  <text class="fig-text" x="114" y="34" font-size="26" text-anchor="middle">닫힌 스위치</text>
  <text class="fig-text" x="114" y="81" font-size="26" text-anchor="middle">+5 V</text>
  <circle class="fig-dot" cx="114" cy="100" r="5" />
  <polyline points="114,100 114,120" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <path d="M114,120 l-10,6 l20,12 l-20,12 l20,12 l-20,12 l10,6" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round" data-stroke="ink" />
  <text class="fig-text" x="143" y="153" font-size="22" text-anchor="start">10 kΩ</text>
  <polyline points="114,180 114,244" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="114" cy="203" r="5" data-node="low" data-node-color="red" />
  <polyline points="114,203 233,203" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="233" cy="203" r="5" data-node="low" data-node-color="red" />
  <text class="fig-text" x="258" y="212" font-size="26" text-anchor="start" data-node="low" data-node-color="red">OUT</text>
  <text class="fig-text" x="258" y="246" font-size="26" text-anchor="start" data-node="low" data-node-color="red">0 V</text>
  <circle cx="114" cy="248" r="4" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <polyline points="114,252 114,285" fill="none" stroke="#18212e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle cx="114" cy="289" r="4" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <polyline points="114,293 114,319" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
