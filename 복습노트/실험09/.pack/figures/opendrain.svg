<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>열린 드레인 출력과 10kΩ 풀업</title><desc>NAND 출력이 0이면 스위치가 닫혀 GND로, 1이면 열려 풀업이 +5V로 끌어올려요</desc><rect width="940" height="360" fill="#fff"/><text x="210" y="36" font-size="22" text-anchor="middle" fill="#18212e" font-weight="bold">내부 결과 0 → 스위치 닫힘</text><text x="240" y="76" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">+5V</text><polyline points="240,84 240,100" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M240,100 l-10,6 l20,12 l-20,12 l20,12 l-20,12 l10,6" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/><text x="260" y="140" font-size="18" text-anchor="start" fill="#c0392b">10k</text><polyline points="240,160 240,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="190" r="5.5" fill="#18212e"/><polyline points="240,190 370,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="198" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">출력</text><polyline points="240,190 240,220" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="225" r="5" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="240,230 240,270" fill="none" stroke="#18212e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="275" r="5" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="240,280 240,300" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="220,300 260,300" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="228,308 252,308" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="255" font-size="18" text-anchor="start" fill="#6b7585">칩 안</text><text x="380" y="240" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">= 0V (0)</text><text x="630" y="36" font-size="22" text-anchor="middle" fill="#2674df" font-weight="bold">내부 결과 1 → 스위치 열림</text><text x="660" y="76" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">+5V</text><polyline points="660,84 660,100" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M660,100 l-10,6 l20,12 l-20,12 l20,12 l-20,12 l10,6" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/><text x="680" y="140" font-size="18" text-anchor="start" fill="#c0392b">10k</text><polyline points="660,160 660,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="190" r="5.5" fill="#18212e"/><polyline points="660,190 790,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="198" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">출력</text><polyline points="660,190 660,220" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="225" r="5" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="660,230 690,262" fill="none" stroke="#18212e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="660" cy="275" r="5" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="660,280 660,300" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="640,300 680,300" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="648,308 672,308" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="255" font-size="18" text-anchor="start" fill="#6b7585">칩 안</text><text x="800" y="240" font-size="22" text-anchor="start" fill="#2674df" font-weight="bold">= +5V (1)</text><text x="470" y="345" font-size="20" text-anchor="middle" fill="#6b7585">풀업이 없으면 오른쪽 경우 출력이 떠서 값이 정해지지 않아요</text></svg>