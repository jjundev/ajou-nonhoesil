<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>주소로 칸을 골라 읽고 쓰는 메모리</title><desc>네 칸 중 주소 01을 골라 1을 쓰고 나중에 읽는 예</desc><rect width="980" height="300" fill="#fff"/><rect x="260" y="90" width="120" height="100" rx="6" fill="#fff" stroke="#18212e" stroke-width="3"/><text x="320" y="152" font-size="34" text-anchor="middle" fill="#18212e" font-weight="bold">0</text><text x="320" y="222" font-size="20" text-anchor="middle" fill="#6b7585">주소 00</text><rect x="410" y="90" width="120" height="100" rx="6" fill="#e8f1ff" stroke="#2674df" stroke-width="3"/><text x="470" y="152" font-size="34" text-anchor="middle" fill="#2674df" font-weight="bold">1</text><text x="470" y="222" font-size="20" text-anchor="middle" fill="#6b7585">주소 01</text><rect x="560" y="90" width="120" height="100" rx="6" fill="#fff" stroke="#18212e" stroke-width="3"/><text x="620" y="152" font-size="34" text-anchor="middle" fill="#18212e" font-weight="bold">0</text><text x="620" y="222" font-size="20" text-anchor="middle" fill="#6b7585">주소 10</text><rect x="710" y="90" width="120" height="100" rx="6" fill="#fff" stroke="#18212e" stroke-width="3"/><text x="770" y="152" font-size="34" text-anchor="middle" fill="#18212e" font-weight="bold">1</text><text x="770" y="222" font-size="20" text-anchor="middle" fill="#6b7585">주소 11</text><text x="30" y="120" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">쓰기: 주소 01에</text><text x="30" y="152" font-size="22" text-anchor="start" fill="#18212e">1을 넣어요</text><text x="30" y="200" font-size="22" text-anchor="start" fill="#c0392b" font-weight="bold">읽기: 주소 01의</text><text x="30" y="232" font-size="22" text-anchor="start" fill="#c0392b">값을 꺼내요</text><polyline points="470,70 470,40 640,40" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="48" font-size="20" text-anchor="start" fill="#2674df">주소를 고르면 바로 그 칸으로 가요</text><text x="490" y="280" font-size="18" text-anchor="middle" fill="#6b7585">이해를 위한 예시 — 칸의 값은 지어낸 값이에요</text></svg>