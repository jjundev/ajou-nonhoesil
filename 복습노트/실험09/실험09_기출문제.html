<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문제집</title>
<link rel="stylesheet" href=".pack/assets/vendor/pretendard/pretendard.css">
<link rel="stylesheet" href=".pack/assets/vendor/katex/katex.min.css">
<script defer src=".pack/assets/vendor/katex/katex.min.js"></script>
<script defer src=".pack/assets/vendor/katex/auto-render.min.js"></script>
<style>
/* ==========================================================================
   문제집 템플릿 (문제 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 1–3절(토큰, 쪽 틀, 헤더)은 답안지
   템플릿과 같이 쓰는 부분이다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 10pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 원문 ↔ 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 6.5pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 15pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 9pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 6.5pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 10pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 7.5pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 50mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문(영어): 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* Hint 띠 (별도 Hint 쪽 없음) */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 9pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 7.5pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-math { display: flex; flex-direction: column; gap: .8mm; min-width: 0; }
.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 표: 격자선, 머리행 강조. 원문 표의 빈 칸은 태블릿 펜으로 쓸 높이(7mm)를 갖는다 */
#book table { border-collapse: collapse; width: 100%; margin: 1mm 0; }
#book th, #book td {
  border: .3mm solid var(--ink); padding: 1.2mm 1.2mm; text-align: center;
  overflow-wrap: break-word; word-break: keep-all; line-height: 1.3;
}
#book th { font-weight: 700; background: var(--paper); }
#book .original td { height: 7mm; }
/* 채울 표(work-table)는 풀이 칸 맨 위(.work-block)로 옮겨진다. 풀이 공간은 최소 25mm를 남긴다 */
#book .work-block { flex: none; }
#book .work-block .table-wrap { margin: 0; }
#book .work-block table { table-layout: fixed; margin: 0; }
#book .work-block td { height: 7mm; }
.page-center > .work-block ~ .work { min-height: 25mm; }

/* 퀴즈 작도: 고정된 인쇄 크기, 넘치면 검사 실패 */
#book .work-board-block { flex: none; }
#book .work-board img { display: block; width: 100mm; min-width: 90mm; height: auto; margin: 0 auto; }
.page-center > .work-board-block ~ .work { min-height: 25mm; }
/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 9.5pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 9pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.5pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 8.5pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}
</style>
</head>

버터를 거쳐 R 쪽 AND에 들어가요. Read/Write는 인버터를 거쳐 S·R 쪽 AND에, 그대로 출력 AND에 들어가요. 출력 AND의 나머지 입력은 Q예요.\u003c/p>", "ask": "\u003cp>Read operation 때의 Read/Write 입력 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>Read/Write가 어느 AND에 그대로, 어느 AND에 뒤집혀 들어가는지 따라가요.\u003c/p>"}]}, {"id": "q-write1", "kind": "기출", "number": "5", "title": "1 bit RAM에 1 쓰기", "section": "실험 9 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 1bit RAM에 1의 데이터를 쓰려고 할 때 입력되야하는 Selection input, input, Read/Write 값을 쓰시오.\u003c/p>", "conditions": "\u003cp>회로는 원문 그림을 다시 그린 그림이에요. 교안 p4의 1 bit RAM과 연결이 같아요. 가운데 RS 플립플롭은 S=1이면 Set, R=1이면 Reset, 둘 다 0이면 유지예요.\u003c/p>", "ask": "\u003cp>1을 쓸 때의 Selection input, Input, Read/Write 값\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/ram1-given.png", "w_mm": 150, "h_mm": 64.12213740458016}], "hints": [{"label": "접근 순서", "html": "\u003cp>Q=1이 되려면 S와 R 중 어느 쪽이 1이어야 하는지부터 정해요.\u003c/p>"}]}, {"id": "q-write0", "kind": "예상문제", "number": "6", "title": "1 bit RAM에 0 쓰기", "section": "실험 9 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 1bit RAM에 0의 데이터를 쓰려고 할 때 입력되야하는 Selection input, input, Read/Write 값을 쓰시오.\u003c/p>", "conditions": "\u003cp>회로는 원문 그림을 다시 그린 그림이에요. 교안 p4의 1 bit RAM과 연결이 같아요. 가운데 RS 플립플롭은 S=1이면 Set, R=1이면 Reset, 둘 다 0이면 유지예요.\u003c/p>", "ask": "\u003cp>0을 쓸 때의 Selection input, Input, Read/Write 값\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/ram1-given-2.png", "w_mm": 150, "h_mm": 64.12213740458016}], "hints": [{"label": "접근 순서", "html": "\u003cp>Q=0이 되려면 R=1이어야 해요. R 쪽 AND에는 Input이 어떻게 들어가나요?\u003c/p>"}]}, {"id": "q-apart1", "kind": "예상문제", "number": "7", "title": "2bit RAM의 A에 1 쓰기", "section": "실험 9 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>A part에 1의 데이터를 쓰기 위한 OE0,1 In0,1, WR0,1 의 값은?\u003c/p>", "conditions": "\u003cp>회로는 교안 p6(원문 그림과 같은 회로)을 다시 그린 그림이에요. 입력 스위치는 단자로 줄였고 핀 번호는 원문 그대로예요.\u003c/p>\u003cp>교안 범례: OE는 Read Select(0: Off, 1: On), IN은 Write Select(0: Off, 1: On), WR은 Write Value(0 or 1)예요. 범례는 OE0, IN0, WR0을 A part, OE1, IN1, WR1을 B part라고 적어요.\u003c/p>", "ask": "\u003cp>A part에 1을 쓰기 위한 OE0, OE1, IN0, IN1, WR0, WR1 값\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/ram2-given.png", "w_mm": 165, "h_mm": 105.1875}], "hints": [{"label": "접근 순서", "html": "\u003cp>A의 Set 쪽 NAND 두 입력이 무엇인지 회로도에서 찾아요. 범례 이름만 믿지 말아요.\u003c/p>"}]}, {"id": "q-bpart1", "kind": "출처 미확인", "number": "8", "title": "2bit RAM의 B에 1 쓰기", "section": "실험 9 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>9. B part에 1의 데이터를 쓰기 위한 OE0,1 In0,1, WR0,1 의 값은?\u003c/p>", "conditions": "\u003cp>회로는 교안 p6(원문 그림과 같은 회로)을 다시 그린 그림이에요. 입력 스위치는 단자로 줄였고 핀 번호는 원문 그대로예요.\u003c/p>\u003cp>교안 범례: OE는 Read Select(0: Off, 1: On), IN은 Write Select(0: Off, 1: On), WR은 Write Value(0 or 1)예요. 범례는 OE0, IN0, WR0을 A part, OE1, IN1, WR1을 B part라고 적어요.\u003c/p>\u003cp>원문 그림은 은행에 답 표시 없는 사본이 없어 다시 싣지 않았어요. 회로는 앞 문항(A part에 1 쓰기)의 그림과 같은 교안 p6 2bit RAM이에요. B의 Set 쪽 NAND(1·2번)는 IN1과 WR1, Reset 쪽 NAND(4·5번)는 IN1과 WR0을 받아요.\u003c/p>", "ask": "\u003cp>B part에 1을 쓰기 위한 OE0, OE1, IN0, IN1, WR0, WR1 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 순서", "html": "\u003cp>B의 Set 쪽 NAND 두 입력을 찾고, A를 지키려면 무엇을 0으로 둘지 생각해요.\u003c/p>"}]}, {"id": "q-bpart0", "kind": "기출", "number": "9", "title": "2bit RAM의 B에 0 쓰기", "section": "실험 9 · 풀이 검토됨", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>B part에 0의 데이터를 쓰기 위한 OE0,1 In0,1, WR0,1 의 값은?\u003c/p>", "conditions": "\u003cp>회로는 교안 p6(원문 그림과 같은 회로)을 다시 그린 그림이에요. 입력 스위치는 단자로 줄였고 핀 번호는 원문 그대로예요.\u003c/p>\u003cp>교안 범례: OE는 Read Select(0: Off, 1: On), IN은 Write Select(0: Off, 1: On), WR은 Write Value(0 or 1)예요. 범례는 OE0, IN0, WR0을 A part, OE1, IN1, WR1을 B part라고 적어요.\u003c/p>", "ask": "\u003cp>B part에 0을 쓰기 위한 OE0, OE1, IN0, IN1, WR0, WR1 값\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/ram2-given-3.png", "w_mm": 165, "h_mm": 105.1875}], "hints": [{"label": "접근 순서", "html": "\u003cp>0을 쓰려면 B의 Reset 쪽 NAND 출력이 0이 돼야 해요. 그 NAND의 두 입력을 찾아요.\u003c/p>"}]}, {"id": "q-qp-e09-tf-01", "kind": "연습문제", "number": "10", "title": "WE에 1을 주면", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>74670에서 WE에 1을 주면 쓰기 주소의 칸에 D1~D4가 저장된다. T/F\u003c/p>", "conditions": "\u003cp>교안 p8 범례: WE: Write Enable (0: On, 1: Off). 74670의 쓰기 주소와 D1~D4는 이미 맞춰 두었어요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>이름 위 줄 = 0일 때 켜짐\u003c/p>"}]}, {"id": "q-qp-e09-tf-02", "kind": "연습문제", "number": "11", "title": "IN0=0이면 A는 그대로", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>이때 WR0과 WR1을 어떤 값으로 바꿔도 A의 저장값은 1로 유지된다. T/F\u003c/p>", "conditions": "\u003cp>교안 p6 2bit RAM의 칸 A에 1이 저장돼 있어요. IN0=0, IN1=0이에요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>IN=0이면 S′=R′=1\u003c/p>"}]}, {"id": "q-qp-e09-tf-03", "kind": "연습문제", "number": "12", "title": "전원을 껐다 켜면", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>RAM은 전원을 껐다 켜도 저장한 값이 그대로 남는 메모리이다. T/F\u003c/p>", "conditions": "\u003cp>교안 실험 2의 3번은 74670의 전원을 제거했다가 다시 연결한 뒤 값의 변화를 보는 휘발성 실험이에요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>휘발성 = 전원이 꺼지면 사라짐\u003c/p>"}]}, {"id": "q-qp-e09-tf-04", "kind": "연습문제", "number": "13", "title": "읽기 때의 Output", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · T/F", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>이때 Output은 저장된 Q와 같고, Input을 바꿔도 Q는 바뀌지 않는다. T/F\u003c/p>", "conditions": "\u003cp>교안 p4 1 bit RAM이에요. Selection Input=1, Read/Write=1이에요.\u003c/p>", "ask": "\u003cp>참(T)·거짓(F) 판정\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>R/W=1은 읽기\u003c/p>"}]}, {"id": "q-qp-e09-blank-01", "kind": "연습문제", "number": "14", "title": "NAND 래치의 금지 입력", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 빈칸", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>피해야 할 입력은 S′R′ = ① ( )이에요. 이때 Q와 Q′가 모두 ② ( )이 되어 부정 상태가 돼요.\u003c/p>", "conditions": "\u003cp>NAND 게이트 두 개로 만든 SR 래치예요. 입력은 S′, R′이에요.\u003c/p>", "ask": "\u003cp>빈칸의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>NAND는 0이 하나라도 있으면 1\u003c/p>"}]}, {"id": "q-qp-e09-blank-02", "kind": "연습문제", "number": "15", "title": "74670의 칸과 주소", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 빈칸", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>74670은 ① ( )비트짜리 칸 ② ( )개로 16비트를 저장하고, 칸을 고르는 쓰기 주소 입력은 ③ ( )개(WA, WB)예요.\u003c/p>", "conditions": "\u003cp>교안 p8의 74670(16bit RAM)이에요.\u003c/p>", "ask": "\u003cp>빈칸의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>주소 n비트 → 2ⁿ칸\u003c/p>"}]}, {"id": "q-qp-e09-blank-03", "kind": "연습문제", "number": "16", "title": "74HC03 출력과 저항", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 빈칸", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>74HC03 출력은 결과가 0일 때만 핀을 GND로 당기는 ① ( ) 출력이라, 1을 만들려면 +5V에 이은 ② ( ) 저항이 필요해요.\u003c/p>", "conditions": "\u003cp>교안 p6 2bit RAM의 출력단은 74HC03이고 출력마다 10K 저항이 +5V에 연결돼요.\u003c/p>", "ask": "\u003cp>빈칸의 값\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>0만 당기고 1은 놓는 출력\u003c/p>"}]}, {"id": "q-qp-e09-board-01", "kind": "연습문제", "number": "17", "title": "RAM 한 칸(NAND SR 래치)을 작도해요", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 브레드보드 작도", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>주어진 NAND SR 래치 회로와 핀 명세를 빈 보드에 옮겨 전원·입력·되먹임·측정점과 미사용 핀을 표시하세요.\u003c/p>", "conditions": "\u003cp>74HC00 두 게이트로 2bit RAM 한 칸인 NAND SR 래치를 만들어요. S′, R′는 0V 또는 5V 외부 입력이고 LED는 쓰지 않아요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"chip-spec\">\u003cthead>\u003ctr>\u003cth>핀\u003c/th>\u003cth>이름\u003c/th>\u003cth>역할\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>S′\u003c/td>\u003ctd>입력 (0일 때 Set)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>R′\u003c/td>\u003ctd>입력 (0일 때 Reset)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Q\u003c/td>\u003ctd>출력·측정점, 4번으로 되먹임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Q′\u003c/td>\u003ctd>출력, 2번으로 되먹임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>VCC\u003c/td>\u003ctd>+5V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>GND\u003c/td>\u003ctd>0V\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9,10,12,13\u003c/td>\u003ctd>미사용 입력\u003c/td>\u003ctd>수업 작도 명세: NC(개방), 실사용 일반 권장과 구분\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8,11\u003c/td>\u003ctd>미사용 출력\u003c/td>\u003ctd>NC, 접지 금지\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"work-board\">\u003cimg src=\".pack/figures/questions/latch-blank.png\" alt=\"v1 배포 PDF 작도용 빈 보드\">\u003c/div>", "ask": "\u003cp>완성한 작도\u003c/p>"}, "figures": [{"src": ".pack/figures/questions/latch-given.png", "w_mm": 70, "h_mm": 33.1578947368421}], "hints": [{"label": "접근 단서", "html": "\u003cp>같은 넷을 같은 도통 홀에 옮겨요\u003c/p>"}]}, {"id": "q-qp-e09-short-01", "kind": "연습문제", "number": "18", "title": "쓴 뒤 IN을 접지하는 이유", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 짧은 서술형", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>2bit RAM에서 쓴 뒤 IN을 먼저 접지하고 OE로 읽어야 하는 이유를 래치 입력과 출력의 관점에서 두세 문장으로 설명하세요.\u003c/p>", "conditions": "\u003cp>교안 p7 주의 3: Write 후에는 Write Select(IN)를 접지하여 값을 저장하고, Read Select(OE)에 전압을 가하여 저장된 값을 읽는다.\u003c/p>", "ask": "\u003cp>이유를 담은 설명\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>IN=0이면 래치 입력 11\u003c/p>"}]}, {"id": "q-qp-e09-short-02", "kind": "연습문제", "number": "19", "title": "주소 입력이 하는 일", "section": "실험 9 · 풀이 검토됨 · 퀴즈 유형 연습 — 자체 출제 · 짧은 서술형", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>74670에서 주소 입력이 하는 일을 설명하고, 쓰기 주소와 읽기 주소가 따로 있으면 무엇이 가능한지 두세 문장으로 쓰세요.\u003c/p>", "conditions": "\u003cp>교안 p8 범례: RA-B: Read Adress, WA-B: Write Adress, “데이터를 읽거나 쓸 메모리 주소 선택 (00 01 10 11)”.\u003c/p>", "ask": "\u003cp>이유를 담은 설명\u003c/p>"}, "figures": [], "hints": [{"label": "접근 단서", "html": "\u003cp>주소 n비트 → 2ⁿ칸 중 하나\u003c/p>"}]}]}</script>
<main id="book"></main>
<script>
'use strict';

// 생성기가 문자열 치환으로 바꾸는 자리표시자. 여기서 이어 붙여 두어 치환 대상이 되지 않게 한다.
const PLACEHOLDER = '__WORKBOOK' + '_DATA__';
const KIND_SLUG = { '예제': 'example', '연습문제': 'exercise', '장말문제': 'problem', '기출': 'exam' };
const FIG_SCALE_CAP = 1.5;        // 교재 인쇄 크기 대비 확대 상한
const MATH_MIN_SCALE = 0.7;
const STRIP_MATH_MIN_SCALE = 0.5;  // Hint 띠 속 식은 띠 폭에 맞춰 더 줄일 수 있음
// 쪽 맞춤 순서: 폭 → 글자. 앞 단계 값은 유지한 채 다음 단계로 간다.
const FIT_STEPS = [
  ['--pw', '40%'], ['--pw', '50%'],
  ['--fs', '0.9'], ['--fs', '0.8'],
];
const PAGE_W_PX = 297 * 96 / 25.4;

const book = document.getElementById('book');

/* ---------- 작은 도우미 ---------- */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function txt(tag, cls, text) {
  const e = el(tag, cls);
  e.textContent = text;
  return e;
}
const kindSlug = kind => KIND_SLUG[kind] || 'problem';

async function loadData() {
  const q = new URLSearchParams(location.search).get('data');
  const raw = document.getElementById('workbook-data').textContent.trim();
  const url = q || (raw === PLACEHOLDER ? 'sample.json' : null);
  if (!url) return JSON.parse(raw);
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  renderMathInElement(root, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$', right: '$', display: false },
    ],
    throwOnError: false,
    fleqn: true,
  });
}

/* ---------- 등식 줄바꿈 ---------- */
// 긴 등식(=, ≈ 등이 있고 EQ_SPLIT_LEN자보다 긴 식)만 한 줄을 따로 차지하는 display 식으로 바꾸고,
// 관계 기호마다 줄을 바꿔 세로로 맞춘다. 짧은 식은 문장 속에 그대로 둔다.
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
const REL_RE = /^(?:=|\\(?:approx|Rightarrow|leq?|geq?)(?![a-zA-Z]))/;
const EQ_SPLIT_LEN = 40;

// 중괄호·\left…\right 바깥의 관계 기호에서 나눈다: [lhs, [rel, rhs], …]
function splitRelations(tex) {
  const parts = [];
  let depth = 0, start = 0, rel = null;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (depth === 0) {
      const m = (c === '=' || c === '\\') && REL_RE.exec(tex.slice(i));
      if (m) {
        parts.push(rel ? [rel, tex.slice(start, i).trim()] : tex.slice(start, i).trim());
        rel = m[0]; i += m[0].length - 1; start = i + 1;
        continue;
      }
    }
    if (c === '{') depth++;
    else if (c === '}') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    }
  }
  if (!rel) return null;
  parts.push([rel, tex.slice(start).trim()]);
  return parts;
}

// 중괄호·\left…\right·소괄호·대괄호 바깥의 쉼표에서 식 목록을 나눈다. 조각이 둘 이상이고
// 모든 조각이 (왼쪽 변이 있는) 관계식일 때만 조각 배열을, 아니면 null 을 돌려준다.
function splitEquationList(tex) {
  const pieces = [];
  let depth = 0, start = 0;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (c === '{' || c === '(' || c === '[') depth++;
    else if (c === '}' || c === ')' || c === ']') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    } else if (c === ',' && depth === 0) {
      pieces.push(tex.slice(start, i));
      start = i + 1;
    }
  }
  if (depth !== 0 || !pieces.length) return null;
  pieces.push(tex.slice(start));
  // 조각 머리의 간격 명령(`\ `, `\,`, `\quad` …)은 식 바깥이라 지운다. 꼬리는 건드리지 않는다.
  const SPACE = /^(?:\s|\\[ ,;:!]|\\q?quad(?![a-zA-Z]))+/;
  const list = pieces.map(p => p.replace(SPACE, ''));
  if (list.length > 1 && !list[list.length - 1]) list.pop();   // 말미 쉼표: 빈 마지막 조각은 버린다
  if (list.length < 2) return null;
  const ok = list.every(p => { const r = splitRelations(p); return r && r[0]; });
  return ok ? list : null;
}
function equationTex(tex, parts, prefix) {
  const [lhs, ...rest] = parts;
  if (!lhs) return prefix + tex;
  const rowsOf = (head, relations) => relations.map(([rel, rhs], i) => `${i ? '' : head} &amp;${rel} ${rhs}`);
  const list = splitEquationList(tex);
  const lines = list
    ? list.flatMap((piece, k) => { const [l, ...r] = splitRelations(piece); return rowsOf((k ? '' : prefix) + l, r); })
    : rowsOf(prefix + lhs, rest);
  return `\\begin{aligned}${lines.join(' \\\\ ')}\\end{aligned}`;
}

function breakEquations(html) {
  if (!html) return html;
  const toks = [];
  let last = 0;
  for (const m of html.matchAll(MATH_RE)) {
    toks.push({ text: html.slice(last, m.index) });
    const tex = (m[1] ?? m[2]).trim();
    const parts = tex.length > EQ_SPLIT_LEN ? splitRelations(tex) : null;
    toks.push({ tex, parts, display: !!m[1] || !!parts, prefix: '' });
    last = m.index + m[0].length;
  }
  if (!toks.length) return html;
  toks.push({ text: html.slice(last) });

  // 줄로 나뉜 식 사이에 남는 쉼표는 지우고, 식 사이의 → 는 다음 식 앞으로 옮긴다
  toks.forEach((t, k) => {
    if (t.text == null) return;
    const prev = toks[k - 1], next = toks[k + 1];
    const pd = prev && prev.display, nd = next && next.display;
    if (pd && nd && /^\s*(→|⇒)\s*$/.test(t.text)) { t.text = ''; next.prefix = '\\Rightarrow\\ '; return; }
    if (pd) t.text = t.text.replace(/^\s*[,，]\s*/, '');
    if (nd) t.text = t.text.replace(/\s*[,，]\s*$/, ' ');
    if (pd && nd && !t.text.trim()) t.text = '';
  });

  return toks.map(t => {
    if (t.text != null) return t.text;
    if (!t.display) return `$${t.tex}$`;
    return `$$${t.parts ? equationTex(t.tex, t.parts, t.prefix) : t.prefix + t.tex}$$`;
  }).join('');
}

// display 식이 칸보다 넓으면 그 식만 줄인다 (최소 70%)
function fitDisplayMath(root) {
  for (const d of root.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    k.style.transform = '';
    const avail = d.clientWidth, need = k.scrollWidth;
    if (need > avail + 1) {
      k.style.transformOrigin = 'left center';
      k.style.transform = `scale(${Math.max(MATH_MIN_SCALE, avail / need)})`;
    }
  }
}

function nextLayout() {
  void book.offsetHeight;          // 레이아웃을 돌려 새 글꼴(KaTeX 등) 로드를 시작시킴
  return document.fonts.ready;
}

/* ---------- 쪽 틀과 헤더 (공용) ---------- */
function makePage(kind, cls) {
  const page = el('section', `page ${cls}`);
  page.dataset.kind = kind;
  const head = el('header', 'page-head');
  const body = el('div', 'page-body');
  page.append(head, body);
  return { page, head, body };
}

function problemHead(p, n, total) {
  const frag = document.createDocumentFragment();
  const lead = el('div', 'head-lead');
  lead.append(txt('span', 'kind-badge', p.kind), txt('span', 'head-num', p.number));
  if (p.difficulty > 0) lead.append(txt('span', 'head-stars', '★'.repeat(p.difficulty)));
  if (p.sol) lead.append(txt('span', 'sol-tag', 'SOL'));

  const h2 = el('h2', 'page-title');
  h2.append(txt('span', 'sr', `${p.kind} ${p.number} — `), document.createTextNode(p.title));

  const meta = el('div', 'head-meta');
  const info = [p.section, p.book_page != null ? `p.${p.book_page}` : '', `${n} / ${total}`];
  meta.append(txt('span', 'head-info', info.filter(Boolean).join(' · ')));

  frag.append(lead, h2, meta);
  return frag;
}

/* ---------- 문제 쪽 ---------- */
function figureImg(f) {
  const img = el('img', 'fig');
  img.src = f.src;
  img.alt = '';
  img.width = Math.round(f.w_mm * 10);
  img.height = Math.round(f.h_mm * 10);
  img.style.setProperty('--w-cap', `${f.w_mm * FIG_SCALE_CAP}mm`);
  img.style.setProperty('--ratio', f.w_mm / f.h_mm);
  return img;
}

function block(label, html, cls, lang) {
  const b = el('section', 'block');
  const body = el('div', `prose ${cls}`, breakEquations(html));
  if (lang) body.lang = lang;
  b.append(txt('div', 'block-label', label), body);
  return b;
}

function hintStrip(p) {
  const a = el('div', 'hint-strip');
  a.append(txt('div', 'hint-strip-label', 'Hint'));
  const ol = el('ol', 'hint-strip-list');
  p.hints.forEach((h, i) => {
    const li = el('li', 'hint-strip-item');
    li.dataset.n = i + 1;
    if (h.formula) {                // 식 하나 또는 여러 줄(배열). 한 칸에 모아 grid 첫 칸으로 새지 않게
      const box = el('span', 'hint-strip-math');
      [].concat(h.formula).forEach(t => box.append(stripFormula(t)));
      li.append(box);
    }
    else li.append(el('span', 'hint-strip-text', h.label));   // 이름표 속 KaTeX가 grid 칸으로 흩어지지 않게
    ol.append(li);
  });
  a.append(ol);
  return a;
}

// 'formula'(구분자 없는 LaTeX, 여러 줄이면 배열)가 있으면 띠에는 이름표 대신 식을 보인다
function stripFormula(tex) {
  const span = el('span', 'hint-strip-formula');
  if (typeof katex !== 'undefined') katex.render(tex, span, { throwOnError: false });
  else span.textContent = tex;
  return span;
}

function fitStripFormulas(page) {
  for (const f of page.querySelectorAll('.hint-strip-formula')) {
    f.style.transform = '';
    const avail = f.clientWidth, need = f.scrollWidth;
    if (need > avail + 1) f.style.transform = `scale(${Math.max(STRIP_MATH_MIN_SCALE, avail / need)})`;
  }
}

function problemPage(p, n, total) {
  const { page, head, body } = makePage(kindSlug(p.kind), 'page--problem');
  page.id = p.id;
  head.append(problemHead(p, n, total));

  const row = el('div', 'page-row');
  const panel = el('div', 'panel');
  if (p.html.original) panel.append(block('문제 원문', p.html.original, 'original', p.original_lang || 'en'));   // 원문은 맨 처음
  if (p.html.conditions && p.html.conditions.trim()) panel.append(block('조건', p.html.conditions, 'conditions'));   // 조건이 없으면 라벨도 없다
  panel.append(block('구할 것', p.html.ask, 'ask-box'));
  const quizBoardPage = !!panel.querySelector('.work-board');
  const center = el('div', 'page-center');
  const figs = p.figures || [];
  if (figs.length) {
    const band = el('div', 'fig-band');
    figs.forEach(f => band.append(figureImg(f)));
    center.append(band);
  }
  const moved = [...panel.querySelectorAll('.work-table')];   // 학생이 채울 표는 좌측 패널이 아니라 풀이 칸 맨 위로
  if (moved.length) {
    const wb = el('div', 'work-block');
    for (const t of moved) {
      const owner = t.closest('.block');
      wb.append(t);
      if (!owner.querySelector('.prose').textContent.trim() && !owner.querySelector('img, table, .katex')) owner.remove();   // 표만 있던 블록은 빈 라벨째 지운다
    }
    center.append(wb);
  }
  const boards = [...panel.querySelectorAll('.work-board')];
  if (boards.length) {
    const area = el('div', 'work-board-block');
    for (const board of boards) {
      const owner = board.closest('.block');
      area.append(board);
      if (owner && !owner.querySelector('.prose').textContent.trim() && !owner.querySelector('img, table, .katex')) owner.remove();
    }
    center.append(area);
  }
  center.append(el('div', 'work'));
  if (quizBoardPage) {
    const schematic = center.querySelector('.fig-band');
    if (schematic) panel.insertBefore(schematic, panel.querySelector('.conditions')?.closest('.block') || null);
  }
  row.append(panel, center);
  if (p.hints && p.hints.length) {
    row.classList.add('has-strip');
    if (p.hints.some(h => h.formula)) row.classList.add('has-formula');
    row.append(hintStrip(p));
  }
  body.append(row);
  return page;
}

// 6.5 쪽 맞춤. 들어가면 멈추고, 끝까지 넘치면 false.
function fitProblemPage(page) {
  const panel = page.querySelector('.panel');
  const fits = () => panel.scrollHeight <= panel.clientHeight + 1;
  const state = { pw: '33%', fs: '1' };
  for (const [prop, val] of FIT_STEPS) {
    if (fits()) break;
    panel.style.setProperty(prop, val);
    state[{ '--pw': 'pw', '--fs': 'fs' }[prop]] = val;
  }
  page.dataset.fit = `pw=${state.pw} fs=${state.fs}`;
  fitDisplayMath(panel);
  fitStripFormulas(page);
  const center = page.querySelector('.page-center');   // 풀이 칸으로 옮긴 표가 칸에 안 들어가면 넘침으로 알린다
  const ok = fits() && (!center.querySelector('.work-block') || (center.scrollHeight <= center.clientHeight + 1 && center.scrollWidth <= center.clientWidth + 1));
  if (!ok) page.dataset.overflow = '';
  return ok;
}

/* ---------- 화면 배율 ---------- */
function applyZoom(z) {
  for (const page of book.querySelectorAll(':scope > .page')) page.style.zoom = z;
}
const screenZoom = () => applyZoom(Math.min(1, (innerWidth - 32) / PAGE_W_PX));

/* ---------- 실행 (6.9) ---------- */
// 표가 실제로 잘리거나 옆 단 글을 침범하는가. 오른쪽 가장자리(T)만 본다. wrap 이 없는 생 table 은 table 자신이 호스트.
function tableClipped(table) {
  const wrap = table.closest('.table-wrap') || table;
  const T = table.getBoundingClientRect().right;
  // (a) 가장 가까운 clip 조상(overflow-x 가 visible 이 아닌 요소, wrap 자신 포함)의 오른쪽 안쪽 가장자리를 넘는가
  for (let el = wrap; el && el !== document.documentElement; el = el.parentElement) {
    const cs = getComputedStyle(el);
    if (cs.overflowX === 'visible') continue;
    if (T > el.getBoundingClientRect().right - parseFloat(cs.borderRightWidth) + 1) return true;
    break;
  }
  // (b) 풀이 흐름 안이면: 다단은 다음 단의 왼쪽(단 오른쪽 + column-gap), 단일 단은 flow 의 오른쪽을 넘는가
  const flow = wrap.closest('.sol-flow');
  if (!flow) return false;
  const cs = getComputedStyle(flow), fr = flow.getBoundingClientRect();
  const left = fr.left + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft);
  const right = fr.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight);
  const n = parseInt(cs.columnCount, 10) || 1;   // 단일 단은 'auto'
  let limit = right;
  if (n > 1) {
    const gap = cs.columnGap === 'normal' ? parseFloat(cs.fontSize) : parseFloat(cs.columnGap);
    const colW = (right - left - gap * (n - 1)) / n;
    const col = Math.min(n - 1, Math.max(0, Math.floor((wrap.getBoundingClientRect().left - left + 1) / (colW + gap))));
    if (col < n - 1) limit = left + (col + 1) * (colW + gap);   // 다음 단의 왼쪽 가장자리
  }
  return T > limit + 1;
}

// 맞춤이 끝난 쪽에 잘린 식(display·인라인)·잘리거나 옆 단을 침범한 표·칸 밖으로 나간 풀이 단계가 남았는가
function hasClippedContent(page) {
  for (const d of page.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    const range = document.createRange();
    range.selectNodeContents(k.querySelector('.katex-html') || k);
    if (range.getBoundingClientRect().right > d.getBoundingClientRect().right + 1) return true;
  }
  // 인라인 식: 가장 가까운 글 상자 오른쪽 + 1 을 넘으면 흐름·칸이 잘라 낸다. display 식은 위에서 봤고,
  // Hint 띠의 식(.hint-strip-formula)은 따로 줄이므로 여기서 보지 않는다.
  for (const k of page.querySelectorAll('.katex')) {
    if (k.closest('.katex-display, .hint-strip-formula')) continue;
    const host = k.closest('.sol-step-body, .prose, td, th, .hint-strip-item, .sol-answer, .block');
    if (!host) continue;
    const range = document.createRange();
    range.selectNodeContents(k.querySelector('.katex-html') || k);
    if (range.getBoundingClientRect().right > host.getBoundingClientRect().right + 1) return true;
  }
  for (const t of page.querySelectorAll('table')) {
    if (tableClipped(t)) return true;
  }
  for (const flow of page.querySelectorAll('.sol-flow')) {
    const f = flow.getBoundingClientRect();
    for (const step of flow.querySelectorAll('.sol-step')) {
      const s = step.getBoundingClientRect();
      if (s.bottom > f.bottom + 1 || s.right > f.right + 1) return true;
    }
  }
  return false;
}

async function main() {
  try {
    const data = await loadData();
    const { meta, problems } = data;
    document.title = meta.title;

    // DOM 생성
    const total = meta.total || problems.length;
    problems.forEach((p, i) => book.append(problemPage(p, i + 1, total)));

    // 글꼴 + 그림 → KaTeX (수식 글꼴도 다 받은 뒤 잰다)
    await Promise.all([nextLayout(), ...[...document.images].map(img => img.complete ? null : new Promise(done => {
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
    }))]);
    renderMath(book);
    await nextLayout();

    const overflow = [];
    for (const page of book.querySelectorAll('.page--problem')) {
      if (!fitProblemPage(page)) overflow.push(page.id);
    }

    for (const page of book.querySelectorAll('.page--problem')) {   // 맞춤이 끝난 뒤 한 번 훑는다
      if (overflow.includes(page.id) || !hasClippedContent(page)) continue;
      page.dataset.overflow = '';
      overflow.push(page.id);
    }
    for (const page of book.querySelectorAll('.page--problem')) {
      const center = page.querySelector('.page-center');
      const bad = [...page.querySelectorAll('.work-board img')].some(img => {
        const r=img.getBoundingClientRect(), c=center.getBoundingClientRect();
        return img.offsetWidth < 90*96/25.4-1 || r.left<c.left-1 || r.right>c.right+1 || r.bottom>c.bottom+1;
      });
      if ((bad || (center.querySelector('.work-board-block') && (center.scrollHeight>center.clientHeight+1 || center.scrollWidth>center.clientWidth+1))) && !overflow.includes(page.id)) {
        page.dataset.overflow=''; overflow.push(page.id);
      }
    }
    document.body.dataset.overflow = overflow.join(',');
    document.documentElement.dataset.ready = 'true';
  } catch (err) {
    console.error(err);
    book.append(txt('p', 'load-error', `문제 데이터를 읽지 못했습니다: ${err.message}`));
    document.body.dataset.overflow = '';
    document.documentElement.dataset.ready = 'error';
    return;
  }

  // 배율은 쪽 맞춤이 끝난 뒤에만
  screenZoom();
  addEventListener('resize', screenZoom);
  addEventListener('beforeprint', () => applyZoom(''));
  addEventListener('afterprint', screenZoom);
}

addEventListener('DOMContentLoaded', main);
</script>
