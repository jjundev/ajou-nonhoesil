<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>Enable이 1인 SR 래치가 S·R 펄스 뒤에도 값을 기억하는 타이밍도</title><desc>Enable이 1인 SR 래치에서 S를 잠깐 1로 했다가 내려도 Q가 1로 남고, R을 잠깐 1로 하면 Q가 0이 되는 모습</desc><rect width="940" height="470" fill="#fff"/><rect x="450" y="350" width="200" height="60" fill="#e8f1ff"/><text x="20" y="88" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">E</text><polyline points="250,60 890,60" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="178" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">S</text><polyline points="250,190 370,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,150 370,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,150 450,150" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,150 450,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,190 890,190" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="268" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">R</text><polyline points="250,280 650,280" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,240 650,280" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,240 730,240" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,240 730,280" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,280 890,280" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="388" font-size="22" text-anchor="start" fill="#2674df" font-weight="bold">Q</text><rect x="250" y="360" width="120" height="40" fill="#d9dee6" stroke="none"/><text x="310" y="387" font-size="20" text-anchor="middle" fill="#6b7585">?</text><polyline points="370,360 650,360" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,360 650,400" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,400 890,400" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="342" font-size="20" text-anchor="middle" fill="#2674df" font-weight="bold">S=0, R=0 → 그대로 1</text><text x="810" y="342" font-size="20" text-anchor="middle" fill="#2674df" font-weight="bold">그대로 0</text><text x="20" y="455" font-size="18" text-anchor="start" fill="#6b7585">회색 ?는 전원을 켠 직후처럼 아직 정해지지 않은 값이에요.</text></svg>