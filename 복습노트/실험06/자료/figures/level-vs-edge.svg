<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>D 래치와 D 플립플롭의 비교 타이밍도</title><desc>Enable·클록 C가 1인 동안 D를 따라가는 D 래치와, C가 0에서 1로 오르는 순간에만 D를 저장하는 D 플립플롭의 비교</desc><rect width="940" height="520" fill="#fff"/><rect x="650" y="280" width="160" height="60" fill="#e8f1ff"/><rect x="330" y="280" width="160" height="60" fill="#e8f1ff"/><text x="20" y="98" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">C</text><polyline points="250,110 330,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="330,70 330,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="330,70 490,70" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="490,70 490,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="490,110 650,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,70 650,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,70 810,70" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="810,70 810,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="810,110 890,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="198" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">D</text><polyline points="250,210 370,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,170 370,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,170 450,170" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,170 450,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,210 570,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="570,170 570,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="570,170 730,170" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,170 730,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,210 890,210" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="318" font-size="22" text-anchor="start" fill="#2674df" font-weight="bold">Q</text><text x="20" y="344" font-size="18" text-anchor="start" fill="#6b7585">D 래치</text><rect x="250" y="290" width="80" height="40" fill="#d9dee6" stroke="none"/><text x="290" y="317" font-size="20" text-anchor="middle" fill="#6b7585">?</text><polyline points="330,330 370,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,290 370,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370,290 450,290" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,290 450,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450,330 650,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,290 650,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,290 730,290" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,290 730,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,330 890,330" fill="none" stroke="#2674df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="438" font-size="22" text-anchor="start" fill="#1e7d4f" font-weight="bold">Q</text><text x="20" y="464" font-size="18" text-anchor="start" fill="#6b7585">D F/F (↑)</text><rect x="250" y="410" width="80" height="40" fill="#d9dee6" stroke="none"/><text x="290" y="437" font-size="20" text-anchor="middle" fill="#6b7585">?</text><polyline points="330,450 650,450" fill="none" stroke="#1e7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,410 650,450" fill="none" stroke="#1e7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="650,410 890,410" fill="none" stroke="#1e7d4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="330,50 330,460" fill="none" stroke="#2674df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="330" y="42" font-size="18" text-anchor="middle" fill="#2674df">↑</text><polyline points="650,50 650,460" fill="none" stroke="#2674df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="650" y="42" font-size="18" text-anchor="middle" fill="#2674df">↑</text><text x="338" y="470" font-size="18" text-anchor="start" fill="#1e7d4f">Q=D(0) 저장</text><text x="658" y="470" font-size="18" text-anchor="start" fill="#1e7d4f">Q=D(1) 저장</text><text x="410" y="272" font-size="18" text-anchor="middle" fill="#2674df">C=1: D를 따라가요</text><text x="570" y="272" font-size="18" text-anchor="middle" fill="#6b7585">C=0: 유지</text><text x="20" y="505" font-size="18" text-anchor="start" fill="#6b7585">회색 ?는 아직 정해지지 않은 값이에요. 파란 점선은 C가 0→1로 오르는 순간이에요.</text></svg>