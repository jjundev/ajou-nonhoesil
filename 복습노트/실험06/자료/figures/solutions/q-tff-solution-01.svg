<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="71.053mm" viewBox="0 0 760 360" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>J-K F/F로 만든 T F/F</title><desc>J와 K를 하나로 묶은 입력 T와 하강 엣지 클록을 받는 J-K 플립플롭</desc><rect width="760" height="360" fill="#fff"/><rect x="330" y="60" width="220" height="240" rx="4" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="260,110 330,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="344" y="118" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">J</text><polyline points="260,250 330,250" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="344" y="258" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">K</text><path d="M330,166 L350,180 L330,194" fill="none" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="323" cy="180" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="260,180 316,180" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="356" y="188" font-size="20" text-anchor="start" fill="#6b7585">CK</text><polyline points="550,110 620,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="536" y="118" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Q</text><polyline points="550,250 620,250" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="536" y="258" font-size="22" text-anchor="end" fill="#18212e" font-weight="bold">Q′</text><text x="40" y="118" font-size="24" text-anchor="start" fill="#18212e" font-weight="bold">T</text><polyline points="70,110 260,110" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="110" r="5.5" fill="#18212e"/><polyline points="190,110 190,250 260,250" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="188" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">CLK</text><polyline points="100,180 260,180" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="118" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">Q</text><text x="630" y="258" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">Q′</text><text x="20" y="340" font-size="18" text-anchor="start" fill="#6b7585">CK 앞의 원은 하강 엣지(1→0)에서 동작한다는 표시예요. 점 없는 교차는 연결되지 않아요.</text></svg>