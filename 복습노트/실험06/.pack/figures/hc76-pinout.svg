<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>74HC76 핀 배치</title><desc>74HC76 16핀 DIP의 핀 배치. 5번이 VCC, 13번이 GND예요</desc><rect width="940" height="640" fill="#fff"/><rect x="330" y="40" width="280" height="520" rx="6" fill="#fff" stroke="#18212e" stroke-width="3"/><path d="M440,40 a30,30 0 0 0 60,0" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><rect x="290" y="74" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="98" font-size="20" text-anchor="middle" fill="#18212e">1</text><text x="276" y="98" font-size="22" text-anchor="end" fill="#18212e">1CK</text><rect x="610" y="74" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="98" font-size="20" text-anchor="middle" fill="#18212e">16</text><text x="664" y="98" font-size="22" text-anchor="start" fill="#18212e">1K</text><rect x="290" y="134" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="158" font-size="20" text-anchor="middle" fill="#18212e">2</text><text x="276" y="158" font-size="22" text-anchor="end" fill="#18212e">1PR (SET)</text><rect x="610" y="134" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="158" font-size="20" text-anchor="middle" fill="#18212e">15</text><text x="664" y="158" font-size="22" text-anchor="start" fill="#18212e">1Q</text><rect x="290" y="194" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="218" font-size="20" text-anchor="middle" fill="#18212e">3</text><text x="276" y="218" font-size="22" text-anchor="end" fill="#18212e">1CLR (RESET)</text><rect x="610" y="194" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="218" font-size="20" text-anchor="middle" fill="#18212e">14</text><text x="664" y="218" font-size="22" text-anchor="start" fill="#18212e">1Q′</text><rect x="290" y="254" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="278" font-size="20" text-anchor="middle" fill="#18212e">4</text><text x="276" y="278" font-size="22" text-anchor="end" fill="#18212e">1J</text><rect x="610" y="254" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="278" font-size="20" text-anchor="middle" fill="#18212e">13</text><text x="664" y="278" font-size="22" text-anchor="start" fill="#c0392b" font-weight="bold">GND</text><rect x="290" y="314" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="338" font-size="20" text-anchor="middle" fill="#18212e">5</text><text x="276" y="338" font-size="22" text-anchor="end" fill="#c0392b" font-weight="bold">VCC</text><rect x="610" y="314" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="338" font-size="20" text-anchor="middle" fill="#18212e">12</text><text x="664" y="338" font-size="22" text-anchor="start" fill="#18212e">2K</text><rect x="290" y="374" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="398" font-size="20" text-anchor="middle" fill="#18212e">6</text><text x="276" y="398" font-size="22" text-anchor="end" fill="#18212e">2CK</text><rect x="610" y="374" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="398" font-size="20" text-anchor="middle" fill="#18212e">11</text><text x="664" y="398" font-size="22" text-anchor="start" fill="#18212e">2Q</text><rect x="290" y="434" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="458" font-size="20" text-anchor="middle" fill="#18212e">7</text><text x="276" y="458" font-size="22" text-anchor="end" fill="#18212e">2PR (SET)</text><rect x="610" y="434" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="458" font-size="20" text-anchor="middle" fill="#18212e">10</text><text x="664" y="458" font-size="22" text-anchor="start" fill="#18212e">2Q′</text><rect x="290" y="494" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="310" y="518" font-size="20" text-anchor="middle" fill="#18212e">8</text><text x="276" y="518" font-size="22" text-anchor="end" fill="#18212e">2CLR (RESET)</text><rect x="610" y="494" width="40" height="32" rx="2" fill="#fff" stroke="#18212e" stroke-width="2"/><text x="630" y="518" font-size="20" text-anchor="middle" fill="#18212e">9</text><text x="664" y="518" font-size="22" text-anchor="start" fill="#18212e">2J</text><text x="470" y="290" font-size="28" text-anchor="middle" fill="#18212e" font-weight="bold">74HC76</text><text x="470" y="326" font-size="22" text-anchor="middle" fill="#6b7585">J-K F/F × 2</text><text x="20" y="600" font-size="20" text-anchor="start" fill="#c0392b">VCC 5번, GND 13번: 흔한 배치(14핀 14·7번, 16핀 16·8번)와 달라요.</text><text x="20" y="628" font-size="20" text-anchor="start" fill="#6b7585">PR(SET)·CLR(RESET)은 0일 때 동작해요(Active Low). 클록은 하강 엣지예요.</text></svg>