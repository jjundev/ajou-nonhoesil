<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" role="img" data-note-schematic="1">
  <style>@font-face { font-family: "Logic Lab Schematic"; font-weight: 600; font-style: normal; src: url(data:font/woff2;base64,) format("woff2"); }

:root {
  color-scheme: light dark;
  --paper: #ffffff; --ink: #18212e; --muted: #475569; --panel: #eaf2ff;
  --blue: #1658ac; --red: #ab2d20; --green: #176140; --amber: #8f4809;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151d29; --ink: #e6eef8; --muted: #bac9dc; --panel: #263951;
    --blue: #8ec5ff; --red: #ffa697; --green: #85dcb4; --amber: #ffbf7f;
  }
}
.fig-paper { fill: var(--paper); }
.fig-ink { stroke: var(--ink); }
.fig-text, .fig-dot { fill: var(--ink); }
text { font-family: "Logic Lab Schematic"; font-weight: 600; font-style: normal; }
[data-node-color="blue"] { --node: var(--blue); }
[data-node-color="red"] { --node: var(--red); }
[data-node-color] { fill: var(--node); }
.fig-crossing { stroke: var(--paper); }
[data-fill="paper"] { fill: var(--paper); }
[data-fill="ink"] { fill: var(--ink); }
[data-fill="muted"] { fill: var(--muted); }
[data-fill="blue"] { fill: var(--blue); }
[data-fill="panel"] { fill: var(--panel); }
[data-fill="red"] { fill: var(--red); }
[data-fill="green"] { fill: var(--green); }
[data-fill="amber"] { fill: var(--amber); }
[data-stroke="paper"] { stroke: var(--paper); }
[data-stroke="ink"] { stroke: var(--ink); }
[data-stroke="muted"] { stroke: var(--muted); }
[data-stroke="blue"] { stroke: var(--blue); }
[data-stroke="panel"] { stroke: var(--panel); }
[data-stroke="red"] { stroke: var(--red); }
[data-stroke="green"] { stroke: var(--green); }
[data-stroke="amber"] { stroke: var(--amber); }
</style>
  <rect class="fig-paper" width="100%" height="100%" />
  <title>NOT 두 개로 만든 고리</title>
  <desc>NOT1의 출력 Q가 NOT2로, NOT2의 출력 Q′이 NOT1로 돌아가는 고리</desc>
  <rect width="720" height="335" fill="#fff" data-fill="paper" />
  <path d="M330,72 L330,128 L376,100 Z" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round" data-stroke="ink" data-fill="paper" />
  <circle cx="383" cy="100" r="7" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <path d="M330,232 L330,288 L376,260 Z" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round" data-stroke="ink" data-fill="paper" />
  <circle cx="383" cy="260" r="7" fill="#fff" stroke="#18212e" stroke-width="3" data-stroke="ink" data-fill="paper" />
  <polyline points="390,100 640,100" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <polyline points="390,260 640,260" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <text class="fig-text" x="662" y="108" font-size="26" text-anchor="start" data-node="q" data-node-color="blue">Q</text>
  <text class="fig-text" x="662" y="268" font-size="26" text-anchor="start" data-node="q-bar" data-node-color="red">Q′</text>
  <circle class="fig-dot" cx="640" cy="100" r="5" data-node="q" data-node-color="blue" />
  <circle class="fig-dot" cx="640" cy="260" r="5" data-node="q-bar" data-node-color="red" />
  <circle class="fig-dot" cx="500" cy="100" r="5" data-node="q" data-node-color="blue" />
  <polyline points="500,100 500,200 260,200 260,260 330,260" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <circle class="fig-dot" cx="540" cy="260" r="5" data-node="q-bar" data-node-color="red" />
  <polyline points="540,260 540,165 220,165 220,100 330,100" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <text x="353" y="60" font-size="18" text-anchor="middle" fill="#6b7585" data-fill="muted">NOT1</text>
  <text x="353" y="312" font-size="18" text-anchor="middle" fill="#6b7585" data-fill="muted">NOT2</text>
  <path class="fig-crossing" d="M500,156v18" stroke-width="12" />
  <polyline points="500,156 500,174" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-stroke="ink" />
  <text class="fig-text" x="590" y="80" font-size="26" text-anchor="middle" data-node="q" data-node-color="blue">1</text>
  <text class="fig-text" x="590" y="240" font-size="26" text-anchor="middle" data-node="q-bar" data-node-color="red">0</text>
</svg>
