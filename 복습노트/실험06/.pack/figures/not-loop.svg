<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" font-family="Arial, 'Malgun Gothic', sans-serif"><title>NOT 두 개로 만든 고리</title><desc>NOT1의 출력 Q가 NOT2로, NOT2의 출력 Q′이 NOT1로 돌아가는 고리</desc><rect width="760" height="380" fill="#fff"/><path d="M330,72 L330,128 L376,100 Z" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="383" cy="100" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><path d="M330,232 L330,288 L376,260 Z" fill="#fff" stroke="#18212e" stroke-width="3" stroke-linejoin="round"/><circle cx="383" cy="260" r="7" fill="#fff" stroke="#18212e" stroke-width="3"/><polyline points="390,100 640,100" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="390,260 640,260" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="108" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">Q</text><text x="652" y="268" font-size="22" text-anchor="start" fill="#18212e" font-weight="bold">Q′</text><circle cx="500" cy="100" r="5.5" fill="#18212e"/><polyline points="500,100 500,200 260,200 260,260 330,260" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="260" r="5.5" fill="#18212e"/><polyline points="540,260 540,165 220,165 220,100 330,100" fill="none" stroke="#18212e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="353" y="60" font-size="18" text-anchor="middle" fill="#6b7585">NOT1</text><text x="353" y="312" font-size="18" text-anchor="middle" fill="#6b7585">NOT2</text><text x="580" y="88" font-size="22" text-anchor="middle" fill="#2674df" font-weight="bold">1</text><text x="580" y="248" font-size="22" text-anchor="middle" fill="#2674df" font-weight="bold">0</text><text x="20" y="345" font-size="18" text-anchor="start" fill="#2674df">Q=1이면 NOT2가 0을, NOT1이 다시 1을 내서 그대로예요.</text><text x="20" y="372" font-size="18" text-anchor="start" fill="#6b7585">선이 만나는 곳의 점은 연결, 점 없는 교차는 연결되지 않아요</text></svg>