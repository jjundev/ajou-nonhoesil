<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" font-family="Malgun Gothic, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="1200" height="710" fill="#fff"/>
<ellipse cx="170" cy="330" rx="85" ry="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="170" y="327" font-size="17" text-anchor="middle" font-weight="bold">IDLE</text>
<text x="170" y="348" font-size="12" text-anchor="middle" font-weight="normal">------</text>
<ellipse cx="450" cy="330" rx="80" ry="36" fill="#fff" stroke="#000" stroke-width="2"/>
