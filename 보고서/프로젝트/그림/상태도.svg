<text x="750" y="188" font-size="12" text-anchor="middle" font-weight="normal">OPEn</text>
<ellipse cx="1050" cy="170" rx="85" ry="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1050" y="167" font-size="17" text-anchor="middle" font-weight="bold">NEW_PW</text>
<text x="1050" y="188" font-size="12" text-anchor="middle" font-weight="normal">nEW</text>
<ellipse cx="1050" cy="400" rx="110" ry="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1050" y="397" font-size="17" text-anchor="middle" font-weight="bold">NEW_CONFIRM</text>
<text x="1050" y="418" font-size="12" text-anchor="middle" font-weight="normal">AGAIn</text>
<ellipse cx="750" cy="500" rx="120" ry="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="750" y="497" font-size="17" text-anchor="middle" font-weight="bold">MSG</text>
<text x="750" y="518" font-size="12" text-anchor="middle" font-weight="normal">Error, nonE, donE, InIt</text>
<ellipse cx="450" cy="580" rx="90" ry="36" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="450" y="577" font-size="17" text-anchor="middle" font-weight="bold">LOCK</text>
<text x="450" y="598" font-size="12" text-anchor="middle" font-weight="normal">LOCK + 남은 초</text>
<line x1="255" y1="330" x2="368" y2="330" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="312" y="320" font-size="13" text-anchor="middle" font-weight="normal">OK</text>
<line x1="500" y1="302" x2="682" y2="192" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="575" y="238" font-size="13" text-anchor="end" font-weight="normal">일치</text>
<path d="M 680,152 Q 330,20 185,295" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="400" y="98" font-size="13" text-anchor="middle" font-weight="normal">OK (다시 잠금)</text>
<line x1="450" y1="366" x2="450" y2="542" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="458" y="460" font-size="13" text-anchor="start" font-weight="normal">3회째 오답</text>
<line x1="378" y1="558" x2="210" y2="362" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="285" y="470" font-size="13" text-anchor="end" font-weight="normal">시간 만료</text>
<line x1="510" y1="354" x2="660" y2="472" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
