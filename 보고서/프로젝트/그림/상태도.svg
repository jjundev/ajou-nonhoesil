<text x="780" y="330" font-size="13" text-anchor="start" font-weight="normal">1.5초 (변경 실패)</text>
<line x1="830" y1="170" x2="963" y2="170" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="896" y="160" font-size="13" text-anchor="middle" font-weight="normal">CHG</text>
<line x1="1050" y1="206" x2="1050" y2="362" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1058" y="290" font-size="13" text-anchor="start" font-weight="normal">OK, 4~6자리</text>
<line x1="1000" y1="199" x2="815" y2="467" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="895" y="300" font-size="13" text-anchor="end" font-weight="normal">OK, 0~3자리</text>
<line x1="975" y1="427" x2="858" y2="482" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="950" y="478" font-size="13" text-anchor="start" font-weight="normal">OK (같음 또는 다름)</text>
<text x="20" y="30" font-size="12" text-anchor="start" font-weight="normal">MSG는 1.5초 동안 키를 무시하고, 변경 실패의 Error만 OPEN으로, 나머지는 IDLE로 간다.</text>
