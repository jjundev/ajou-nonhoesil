<text x="600" y="418" font-size="13" text-anchor="start" font-weight="normal">빈 입력</text>
<path d="M 750,536 L 750,680 L 110,680 L 110,356" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="430" y="672" font-size="13" text-anchor="middle" font-weight="normal">1.5초 (그 밖의 메시지)</text>
